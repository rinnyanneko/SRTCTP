

Bedzin_Description=Gare située entre celles de Dąbrowa Górnicza et Sosnowiec. Elle dispose de 6 voies, dont 3 électrifiées. Seuls les trains régionaux s'arrêtent ici.
Dabrowa_Gornicza_Description=Petite gare avec un quai central desservant 2 voies pour les trains régionaux et grandes lignes.
Psary_Description=Poste d'aiguillage informatique où une des voies se débranche de la Ligne Ferroviaire Centrale (CMK) vers la ligne 64. Trois voies principales et deux voies d'évitement sans quais y sont présentes.


Katowice_Zawodzie_Description=Seuls les trains régionaux s'arrêtent ici. Quatre voies mènent à la gare centrale de Katowice, sur deux lignes différentes. Deux quais sont disponibles.
Sosnowiec_Glowny_Description=Une des plus importantes gares de la région, desservie par tous les trains de voyageurs. Elle se situe à la bifurcation des deux lignes disponibles dans le jeu et qui possèdent chacune son quai.
Lazy_Lc_Description=Un poste d'aiguillage gardant l'entrée de la gare de Łazy. Il contrôle les aiguilles menant vers le secteur fret de la gare, tout en laissant les trains voyageurs prendre un trajet plus court à destination des quais.
Gora_Wlodowska_Description=Petite gare sans quai située sur la Ligne Ferroviaire Centrale (CMK). Les deux voies d'évitement peuvent être utilisées pour arrêter les trains qui doivent être dépassés par un autre.
Knapwowka_Description=Une bifurcation sur la Ligne Ferroviaire Centrale (CMK). Le raccordement vers la gare de Czarnca commence ici.
Olszamowice_Description=(LCS). Une petite gare sur la Ligne Ferroviaire Centrale (CMK) avec deux voies d'évitement. De là, vous commandez à distance une petite jonction à proximité nommée Pilichowice.
Pilichowice_Description=Un point de changement de voie sur la Ligne Ferroviaire Centrale (CMK) permettant de basculer les trains entre les deux voies.
Wloszczowa_Polnoc_Description=Gare intermédiaire sur la Ligne Ferroviaire Centrale (CMK) avec deux quais, Les trois voies à quai sont desservies par la plupart des trains grandes lignes. Le raccordement vers Żelisławice commence ici.
Opoczno_Poludnie_Description=Une gare sur la Ligne Ferroviaire Centrale (CMK). Elle possède un unique quai, où quelques trains grandes lignes s'arrêtent.
Dabrowa_Gornicza_Wschodnia_Description=Une gare de bifurcation de taille moyenne, où deux lignes se rejoignent. Deux de ses voies principales desservent un quai, utilisé par les trains régionaux. La majorité des trains sans arrêt sont des frets.
Zawiercie_Description=Une importante gare avec deux quais et beaucoup de voies de service, où les trains de fret peuvent être arrêtés. Une grande partie des trains voyageurs s'arrêtent ici. La Ligne Ferroviaire Centrale (CMK) se termine ici, et les trains en provenance de Varsovie rejoignent la ligne classique ici.
Sosnowiec_Poludniowy_Description=Une petite gare de bifurcation où se trouve une voie unique en provenance de Sosnowiec Dańdówka et qui se sépare en deux voies en direction de Sosnowiec Główny - une de celles-ci va à la gare et l'autre passe par le sud vers Katowice. On y trouve 7 voies, dont 2 desservent le seul quai. On trouve également un terminal intermodale à proximité de la gare.
Idzikowice_Description=La plus grande gare située sur la Ligne Ferroviaire Centrale (CMK). Deux raccordements permettent de rejoindre la ligne Tomaszów Mazowiecki – Radom. Il y a un atelier de réparation de matériel voyageur, ainsi que les services du transporteur régional. Il n'y a pas de quai à cette gare.
Slawkow_Description=Une gare de taille moyenne entre Dąbrowa Górnicza Wschodnia et Bukowno. Il y a quatre voies électrifiées, dont deux desservent le seul quai de la gare. Les trains régionaux s'arrêtent ici.
Dorota_Description=Une petite bifurcation où une double voie et une voie unique se rejoignent.
Grodzisk_Mazowiecki_Description=Une gare de la banlieue de Varsovie, où s'arrêtent des trains régionaux, grandes lignes et internationaux. Il y a 2 quais et les trains rapides peuvent traverser la gare via des voies dédiées. C'est la première gare de la ligne 4, aussi connu comme la Ligne Ferroviaire Principale (CMK).
Kozlow_Description=Gare de taille moyenne où ne s'arrêtent que les trains régionaux. Il y a trois quais, mais peu de trains s'y arrêtent. De là, vous pouvez prendre des trains pour Koniecpol, Psary, Sędziszów, Katowice et Cracovie.
Tunel_Description=Petite gare où les trains en provenance de Varsovie peuvent changer de voie pour se rendre à Cracovie ou à Sosnowiec. Il y a un seul quai qui n'est desservi que par quelques trains régionaux.
Korytow_Description=La première station de la ligne CMK. Outre les deux voies principales et les deux voies d'évitement, il y a quelques voies de service et un embranchement où des trains apportent des agrégats. Il n'y a pas de quai pour les trains voyageurs.
LazyLB_Descritpion=Un poste d'aiguillage contrôlant la zone "B" d'une grande bifurcation et du triage de Łazy.
Juliusz_Description=Un petit poste d'aiguillage comprenant un embranchement vers une entreprise locale et la possibilité de passer d'une voie à l'autre.
LazyLA_Description=Un poste d'aiguillage gardant l'entrée de la gare de Łazy. Il contrôle les aiguilles menant vers le secteur fret de la gare, tout en laissant les trains voyageurs prendre un trajet plus court à destination des quais.
Szeligi_Description=Un petit poste avec voies d'évitement sur la ligne CMK, avec un raccordement vers Marków.
Katowice_Description=La plus grande gare de bifurcation dans la capitale de la Haute-Silésie. Elle est desservie par des trains régionaux, grandes lignes et internationaux. Il y a cinq quais, étant donné que le trafic ferroviaire est important.
Dabrowa_Gornicza_Zabkowice_Description=Une gare de bifurcation à Dąbrowa Górnicza. De là, partent des trains vers le centre-ville, ainsi que vers Łazy et Huta Katowice (Hauts-fourneaux de Katowice). Trois quais et de nombreuses voies de service sont disponibles ici.
DGHK_Description=Jonction entre Dąbrowa Górnicza Ząbkowice, Dąbrowa Górnicza Południowa et Dąbrowa Górnicza Strzemieszyce, desservant également une voie de service pour les aciéries.
Bukowno_Description=Gare située entre Sławków et Olkusz, dotée de dix voies principales, dont quatre disposent d'un quai. Seuls les trains régionaux s'y arrêtent.
Lazy_Description=Un poste d'aiguillage entre Łazy ŁA et ŁC, contrôlant la partie centrale de la gare, où se trouvent les quais.
Pruszkow_Description=(LCS). Gare de taille moyenne située à la périphérie de Varsovie. Seuls les trains locaux et régionaux s'arrêtent sur l'unique quai de la gare. La gare dispose de quelques voies de service et d'un terminal à conteneurs. De là, vous pouvez contrôler à distance la jonction de Józefinow, où les trains de marchandises et de passagers sont séparés.
SosnowiecKazimierz_Description=Petite gare de jonction reliant trois lignes à voie unique en provenance de Sosnowiec Dańdówka, Sosnowiec Maczki et Dąbrowa Górnicza Strzemieszyce. Il y a trois quais où seuls les trains régionaux s'arrêtent.
Strzalki_Description=(LCS). Une petite gare sur la Ligne Ferroviaire Centrale (CMK) avec deux voies d'évitement. D'ici, vous commandez à distance une petite jonction à proximité nommée Biała Rawska.
KrakowPrzedmiescie_Description=Un petit noeud ferroviaire à l'entrée de Cracovie. Ici, les trains de marchandises sont séparés des trains de passagers qui se dirigent vers la gare principale de la ville.
Niedzwiedz_Description=Niedźwiedź (en polonais « Ours ») est une autre petite gare avec deux voies supplémentaires pour arrêter un train plus lent, et deux autres avec un quai desservant uniquement les trains de banlieue.
Slomniki_Description=Petite gare entre Miechów et Niedźwiedź, où seuls les trains de banlieue s'arrêtent. Il y a quatre voies, dont trois peuvent accueillir des trains de passagers.
Raciborowice_Description=Jonction séparant le trafic en provenance et à destination de la gare de marchandises de Kraków Nowa Huta et de Kraków Batowice. 
KrakowBatowice_Description=Une gare de taille moyenne avec six voies principales, dont trois avec des quais pour les trains régionaux de passagers.
Miechow_Descrption=Une petite gare avec quatre voies principales qui peuvent être utilisées pour dépasser les trains plus lents, située entre Tunel et Słomniki. Deux des voies de la gare sont situées devant un quai, où s'arrêtent les trains de banlieue et certains trains longue distance plus lents.
Starzyny_Description=(LCS). Un embranchement qui protège l'entrée de la voie ferrée principale en direction de Kozłów. Ici, les trains peuvent continuer leur voyage vers Varsovie via la CMK, ou se diriger plus à l'ouest vers Częstochowa via la gare de Koniecpol. De là, vous contrôlez à distance une petite jonction à proximité nommée Sprowa.
Zastow_Description=Petite gare située entre la jonction de Raciborowice et la gare de Niedźwiedź. Il y a deux voies latérales où l'on peut arrêter un train lent pour qu'il soit dépassé, et deux voies principales situées près d'un quai, où seuls les trains de banlieue sont censés s'arrêter.
Zyrardow_Description=(LCS) Gare située entre Grodzisk Mazowiecki et Skierniewice. Elle dispose de deux quais qui peuvent accueillir jusqu'à trois trains simultanément. Le poste d'aiguillage contrôle également la jonction Radziwiłłów Mazowiecki située à proximité.
Skierniewice_description=Grande gare de bifurcation, d'où partent les lignes vers Varsovie, Łódź, Łowicz et Łuków. En dehors des trois quais, il y a de nombreuses voies latérales qui pourraient être utilisées pour arrêter les trains pour leurs arrêts techniques. À côté de la gare se trouve un dépôt historique de locomotives à vapeur.
Plycwia_description=Petite gare située entre Skierniewice et Rogów. On y trouve deux quais, ainsi que deux voies latérales qui peuvent être utilisées pour dépasser les trains plus lents.
Rogow_description=Gare de taille moyenne située entre les gares de Koluszki et de Płyćwia. Elle dispose d'un seul quai, situé entre deux voies principales, ainsi que de quatre autres voies latérales, qui peuvent être utilisées en cas de besoin de dépassement.
Koluszki_description=Grande gare de bifurcation, où la ligne vers Łódź s'embranche sur celle reliant Varsovie et Katowice. Il y a trois quais ici, ainsi que de nombreuses voies latérales utiles pour les dépassements.
Galkowek_description=(LCS) Petite gare près de Koluszki, desservant deux lignes - une ligne de voyageurs vers Łódź Fabryczna (ligne 17) et une ligne de fret via la gare de fret de Łódź Olechów (ligne 25). Sur la ligne 17, il y a deux quais pour les passagers. Ce poste d'aiguillage contrôle également à distance la signalisation de la gare de Łódź Andrzejów, près de Łódź Widzew.
Widzew_Description=Gare importante dans la région de Łódź, desservant tous les types de trains de passagers traversant la ville. Une base de maintenance pour la compagnie locale de transport en commun est également située à cet endroit. Il y a trois quais disponibles, six voies au total. Les trains de marchandises peuvent éviter complètement la gare en utilisant une ligne d'évitement.
Zakowice_Description=Petite bifurcation sur un itinéraire alternatif de Łódź à Koluszki, utilisée principalement par les trains de marchandises. Il est contrôlé à distance depuis le bâtiment du répartiteur situé à Koluszki.
Wlochy_description=Poste de contrôle des trains de passagers entrant dans Varsovie par l'ouest. C'est là que se croisent les lignes en provenance de Katowice, Poznań et Grodzisk Mazowiecki.
Lublinek_Description=Une gare près de l'aéroport Łódź Lublinek. La gare dispose de deux quais centraux. Seuls les trains régionaux s'y arrêtent.
Baby_Description=Une gare située entre Piotrków Trybunalski et Koluszki. La gare dispose d'une voie de garage, d'une aire de chargement et de quais inhabituellement positionnés entre les signaux d'entrée et de sortie.
Rokiciny_Description=Une petite gare située entre Piotrków Trybunalski et Koluszki. La gare dispose d'une gare de triage et de quais inhabituellement positionnés entre les signaux d'entrée et de sortie.
Pabianice_Description=Une gare ferroviaire avec un quai central et un quai latéral. La ligne en direction de Łask est équipée d'un poste d'aiguillage automatique.
Gajewniki_Description=Un poste de jonction situé près de Zduńska Wola. Des lignes partent du poste vers la ligne principale du charbon, qui relie le nord et le sud.
Lask_Description=Une gare ferroviaire avec un quai central et un quai latéral. Une voie de garage menant à une unité militaire bifurque depuis la gare. Les lignes vers Pabianice et Gajewniki sont équipées de postes d'aiguillage automatiques.
Zabieniec_Description=Une gare de taille moyenne située entre Zgierz et Łódź Kaliska. La gare dispose de deux quais simples. De nombreuses voies de garage partent de la gare.
Zgierz_Description=Une gare de jonction acheminant le trafic provenant de Łowicz et Kutno vers Łódź Widzew et Łódź Kaliska. Une voie de garage PKP Energetyka est située à la gare.
Retkinia_Description=Un poste de jonction dirigeant le trafic de Zduńska Wola vers Zgierz ou Koluszki. Sur la ligne en direction de Łódź Lublinek, se trouve l'arrêt de passagers Łódź Retkinia.
Chojny_Description=Une gare située dans la partie sud de Łódź qui, pendant longtemps, n'a pas accueilli de trafic voyageurs et est tombée en ruine. Suite à la reconstruction de Łódź Fabryczna, la gare a commencé à desservir le trafic longue distance et régional. La gare dispose de deux quais.
Zdunska_Wola_Description=Une grande gare de jonction d'où partent des lignes vers la Coal Trunk Line. La gare dispose de deux quais et de nombreuses voies supplémentaires utilisées pour le trafic de marchandises. Les trains régionaux et certains trains longue distance s'y arrêtent.
Kaliska_Description=Une grande gare de jonction située dans la partie ouest de Łódź. Elle gère le trafic ferroviaire en provenance de Kutno, Łowicz, Zduńska Wola et Łódź Chojny. La gare dispose de trois quais et de nombreuses voies pour l'exploitation ferroviaire.
Witonia_Description=Une gare située sur la ligne à voie unique Zgierz – Kutno. Elle assure également la commande à distance des gares de Łęczyca et d'Ozorków. Ces deux gares disposent de gares de triage, tandis que celle de Łęczyca comporte en outre une voie de garage militaire. Chaque gare est équipée de quais pour l'accueil des trains de voyageurs.
Zgierz_Polnoc_Description=Poste de commande à distance situé dans le poste d'aiguillage de Zgierz, assurant la supervision de trois gares sur la ligne à voie unique Zgierz – Kutno. Les gares de Zgierz Kontrewers et Zgierz Północ disposent chacune de deux voies et de deux quais courts à un seul bord. La gare de Chociszew dispose de deux quais plus longs et d'une voie supplémentaire.
Glinnik_Description=Une voie d'évitement exploitée localement à l'aide d'un système d'enclenchement à relais. Depuis cette gare, le chef de circulation contrôle également à distance la gare de Stryków, qui dispose d'une voie principale supplémentaire et d'un triage.
Glowno_Description=La gare a fait l'objet d'une modernisation en 2015, au cours de laquelle un équipement de signalisation informatisé a été installé. Depuis cette modernisation, le chef de circulation de Głowno contrôle également à distance la gare de Domaniewice. La gare de Domaniewice sert à tester un nouveau type de signal doté d'une tête de signal abaissable.
Lowicz_Przedmiescie_Description=Gare de taille moyenne située sur la ligne ferroviaire n° 15 à voie unique au départ de Zgierz. Outre le prolongement de la ligne 15 en direction de Bednary, la gare est reliée par deux embranchements permettant aux trains de se diriger vers Łowicz Główny ou Bednary.
Lowicz_Glowny_Description=Grande gare de jonction située sur la ligne principale E20. C'est ici que bifurque le corridor de fret CE20, permettant aux trains de marchandises de contourner le nœud ferroviaire de Varsovie en passant par Skierniewice, puis en direction de Łuków. La gare dispose de deux quais centraux. Lors de sa modernisation, les anciens postes de jonction d'Arkadia et de Placencja ont été intégrés à la gare.
Belchow_Description=Il s'agit de la seule gare située entre Skierniewice et Łowicz Główny. Elle dispose d'un quai et de cinq voies. Elle est pilotée à distance depuis Skierniewice. La ligne en direction de Skierniewice est équipée d'un système de signalisation par blocs automatiques, installé lors de la modernisation.
