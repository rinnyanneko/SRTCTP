

Sosnowiec_Glowny_Description=Az egyik legfontosabb állomás a régióban. A játékban elérhető két vasúti fővonal találkozik itt, mindkettőnek külön-külön peronja van. Az összes személyvonat megáll itt.
Knapwowka_Description=Egy kis szolgálati hely, peronok nélkül. Czarnca felé indul egy mellékvonal az állomásról.
Wloszczowa_Polnoc_Description=Egy közepes állomás a fővonalon, két peronnal. A 3 vágány a peronok mellet szolgálja ki a távolsági vonatokat. Egy elágazó vonal indul Żelisławice felé erről az állomásról.
Olszamowice_Description=Egy kis szolgálati hely a fővonalon két mellékvágánnyal.
Dabrowa_Gornicza_Description=Egy kis állomás két vágánnyal. Mind a regionális, mind a távolsági vonatok megállnak itt.
Lazy_Lc_Description=Egy szolgálati hely, ami Łazy állomás egyik bejáratát irányítja. A váltókkal a tehervonati vágányok felé lehet terelni a vonatokat, mivel így szabad utat tudunk biztosítani a személyvonatoknak.


Katowice_Zawodzie_Description=Csak a regionális vonatok állnak meg itt. 4 vágány van Katowice Főpályaudvar felé, mindkét vonalon kettő. 2 peron van az állomáson.
Gora_Wlodowska_Description=Egy kis szolgálati hely a fővonalon, peron nélkül. A mellékvágányokat vonatok előztetésére lehet használni.
Pilichowice_Description=Egy szolgálati hely a fővonalon. Csak a bal vágányról a jobb vágányra, illetve vissza lehet terelni a vonatokat.
Psary_Description=Egy egyszerű szolgálati hely, ahol a fővonalról kiágazik a 64-es számú vasútvonal. Három fővágány és két mellékvágány található itt. Peron nincs a szolgálati helyen.
Bedzin_Description=Egy állomás Dąbrowa Górnicza és Sosnowiec Glówny között. 6 fővágány van az állomáson, ebből 3 villamosított. Csak a regionális vonatok állnak meg itt.
Opoczno_Poludnie_Description=Az állomás a fővonalon található. Csak egy peronja van, ahol pár távolsági vonat áll meg.
Dabrowa_Gornicza_Wschodnia_Description=Egy közepes elágazó állomás, ahol két vonal találkozik. A hat fővágányból, kettőhöz tartozik peron, ahol a regionális vonatok állnak meg. A legtöbb áthaladó vonat tehervonat.
Zawiercie_Description=Egy nagy állomás két peronnal és sok mellékvágánnyal, ahol a tehervonatokat meg lehet állítani. A személyszállító vonatok nagy része megáll itt. A vasúti fővonal itt véget ér, és Varsó felé hagyományos vasúti pályán haladnak a vonatok.
Idzikowice_Description=A központi vasútvonal legnagyobb állomása. A fővonaltól két elágazás van a Tomaszów Mazowiecki - Radom vonalig. Az állomáson van egy személygépkocsi-javító műhely és egy regionális vasúti fuvarozó járműkarbantartó telephelye. Az állomás nem szolgálja ki a személyforgalmat – nincsenek peronok.
Slawkow_Description=Közepes méretű állomás Dąbrowa Górnicza Wschodnia és Bukowno között. Itt három villamosított vágány van, amelyek közül kettő az állomás egyetlen peronját szolgálja ki. Itt állnak meg a regionális vonatok.
Dorota_Description=Egy kis csomópont, ahol két kétvágányú és egy egyvágányú vonal találkozik.
Grodzisk_Mazowiecki_Description=Megálló Varsó külvárosában, ahol regionális, távolsági és nemzetközi vonatok állnak meg. Itt két peron van, a gyorsvonatok külön vágányaikon haladhatnak át az állomáson. Ez a 4-es vonal első állomása, más néven Fő vasút (CMK).
Kozlow_Description=Közepes méretű állomás, ahol csak regionális vonatok állnak meg. Három peron van, de nem sok vonat áll meg itt. Innen vonatok indulnak Koniecpol, Psary, Sędziszów, Katowice és Krakkó felé.
Tunel_Description=Egy kis állomás, ahol a Varsóból induló vonatok válthatnak pályát Krakkóba vagy Sosnowiecbe. Egyetlen peron van, amelyet csak néhány regionális vonat használ.
Sosnowiec_Poludniowy_Description=Egy kis csomópont, ahol a Sosnowiec Dańdówkától induló egy vágány két vágányra ágazik Sosnowiec Główny felé – az egyik az állomásra vezet, a másik pedig délről kerüli meg. Itt hét vágány található, amelyek közül kettő az egyetlen peron mellett található. Az állomás mellett intermodális konténerterminál is található.
Korytow_Description=A CMK útvonal első állomása. A két fő- és két további vágányon kívül van néhány mellékvágány és egy mellékvágány, ahová az aggregátumot vonatok szállítják. Nincs peron a személyszállító vonatok számára.
LazyLA_Description=A Łazy állomás bejáratát őrző jelzőfülke. Az állomás teherforgalmi részébe vezető váltókat vezérli, így a személyvonatok a legrövidebb úton jutnak el a peronokhoz.
LazyLB_Descritpion=Egy nagy csomópont és púpos pályaudvar "B" területét irányító jelzőállomás Łazy.
Juliusz_Description=Mellékvágány-oszlop egy mellékvágánnyal egy közeli vállalathoz, és lehetőség a bal vágányról a jobbra és vissza váltani.
Szeligi_Description=Egy kis állomás a CMK útvonalon, ahol a Markówba tartó elágazó vonal csatlakozik a főútvonalhoz.
Katowice_Description=A legnagyobb csomópont Felső-Szilézia fővárosában. Helyi, távolsági és nemzetközi vonatokat szolgál ki. Itt öt peron van, jelentős a vonatforgalom.
Dabrowa_Gornicza_Zabkowice_Description=Egy csomópont Dąbrowa Górnicza városában. Innen vonatok indulnak a városközpontba, valamint Łazy és Huta Katowice (Katowice Acélművek) felé. Három platform és sok oldalsó pálya áll rendelkezésre itt.
DGHK_Description=Dąbrowa Górnicza Ząbkowice, Dąbrowa Górnicza Południowa és Dąbrowa Górnicza Strzemieszyce csomópontja, amely szintén egy steelwerks iparvágányt szolgál ki.
Bukowno_Description=Egy állomás Sławków és Olkusz között, tíz fő vágánnyal, amelyek közül négy két peron egyikén található. Itt csak az elővárosi vonatok állnak meg.
Lazy_Description=Jelződoboz Łazy ŁA és ŁC között, amely az állomás központi részét irányítja, ahol a peronok találhatók.
Pruszkow_Description=Közepes méretű állomás Varsó külvárosában. Az állomás egyetlen peronján csak helyi és regionális vonatok állnak meg. Az állomáson van néhány mellékvágány és egy konténerterminál.
SosnowiecKazimierz_Description=Egy kis csomópont, amely három egyvágányú vonalat köt össze Sosnowiec Dańdówka, Sosnowiec Maczki és Dąbrowa Górnicza Strzemieszyce városaiból. Három peron van, ahol csak az elővárosi vonatok állnak meg.
