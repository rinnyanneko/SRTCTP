

Bedzin_Description=Stazione tra Dąbrowa Górnicza e Sosnowiec Główny. Ha 6 binari principali, di cui solo 3 sono elettrificati. Qui si fermano solo i treni locali.


Katowice_Zawodzie_Description=Qui fermano solo i treni locali. Da qui, quattro binari conducono alla stazione principale di Katowice, divisi tra le linee 1 e 138. Ogni linea ha il suo marciapiede.
Dabrowa_Gornicza_Description=Una piccola stazione con due binari e un marciapiede. Si fermano qui sia treni regionali che a lunga percorrenza.
Lazy_Lc_Description=Una cabina di segnalamento che permette l'ingresso alla stazione di Łazy. Serve per manovrare gli scambi che dirigono i treni merci verso il fascio merci della stazione, permettendo ai treni viaggiatori di prendere la via più breve per i marciapiedi.
Gora_Wlodowska_Description=Una piccola stazione sulla linea ferroviaria principale, dove i treni viaggiatori non effettuano fermate. Dispone di due binari di precedenza che possono essere utilizzati per fermare i treni di minore priorità.
Psary_Description=Stazione dove un binario di raccordo si dirama dalla linea ferroviaria principale e si collega alla linea 64 - Kozłów - Koniecpol. Ha tre binari principali e due binari di precedenza. In questa stazione non ci sono marciapiedi.
Knapwowka_Description=Un bivio sulla linea ferroviaria principale. Da qui parte una diramazione per la stazione di Czarnca.
Wloszczowa_Polnoc_Description=Stazione di medie dimensioni sulla linea ferroviaria principale con due marciapiedi. Tre binari servono la maggior parte dei treni a lunga percorrenza. Da qui parte una diramazione verso Żelisławice.
Olszamowice_Description=(LCS). Una piccola stazione sulla linea ferroviaria principale con due binari di precedenza. Da qui si controlla a distanza un piccolo bivio nelle vicinanze, Pilichowice.
Pilichowice_Description=Un posto di comunicazione situato sulla linea ferroviaria principale. Qui è possibile solo passare dal binario di sinistra a quello di destra e viceversa.
Sosnowiec_Glowny_Description=Una delle più impostanti stazioni della regione, che serve tutti i treni viaggiatori. Le linee 1 e 62 disponibili sul simulatore si incontrano qui, ciascuna con il proprio marciapiede.
Opoczno_Poludnie_Description=Stazione sulla linea ferroviaria principale. Alcuni treni a lunga percorrenza si fermano sull'unico marciapiede disponibile.
Dabrowa_Gornicza_Wschodnia_Description=Una stazione di medie dimensioni in cui convergono due linee ferroviarie. Dei sei binari disponibili, solo due hanno un marciapiede, dove si fermano i treni locali. La maggior parte dei treni che passano qui sono convogli merci.
Zawiercie_Description=Una grande stazione con due marciapiedi e un fascio merci con molti binari su cui possono essere fermati i treni merci. La maggior parte dei treni viaggiatori si ferma qui. La linea ferroviaria principale termina qui e i treni provenienti da Varsavia proseguono sui binari della linea tradizionale.
Sosnowiec_Poludniowy_Description=Piccola stazione su un bivio, dove il binario unico da Sosnowiec Dańdówka converge con 2 binari che conducono a Sosnowiec Główny - uno porta alla stazione, e l'altro la aggira da sud. Ci sono 7 binari, 2 dei quali hanno un marciapiede. Si trova un terminal intermodale di container a fianco alla stazione.
Idzikowice_Description=È la stazione più grande della linea ferroviaria principale. Ci sono due diramazioni dalla linea principale alla linea Tomaszów Mazowiecki - Radom. È presente un'officina per la riparazione delle vetture viaggiatori e un impianto di manutenzione per il materiale rotabile della compagnia ferroviaria regionale. Non ci sono marciapiedi.
Slawkow_Description=Stazione di medie dimensioni tra Dąbrowa Górnicza Wschodnia e Bukowno. Ci sono quattro binari elettrificati, due dei quali servono per il servizio viaggiatori sull'unico marciapiede. Qui si fermano i treni locali.
Dorota_Description=Stazione di diramazione dove si incontrano due linee ferroviarie a doppio binario e una a semplice binario.
Grodzisk_Mazowiecki_Description=Stazione nella zona periferica di Varsavia, dove fermano i treni regionali, a lunga percorrenza e internazionali. Ci sono due marciapiedi, i treni espressi transitano dalla stazione su binari dedicati. È la stazione di partenza della linea numero 4, nota anche come linea ferroviaria principale (CMK).
Kozlow_Description=Una stazione di medie dimensioni di importanza minore dove fermano alcuni treni regionali sui tre marciapiedi disponibili. Da qui si può prendere treni per Koniecpol, Psary, Sędziszów, Katowice e Kraków.
Tunel_Description=Una piccola stazione da cui i treni provenienti da Varsavia possono dirigersi verso Cracovia o Sosnowiec. C'è solo un marciapiede dove effettuano fermata alcuni treni regionali.
Korytow_Description=La prima stazione della linea CMK. Oltre ai due binari principali e a due binari aggiuntivi, ci sono alcuni binari secondari e un binario di raccordo dove gli aggregati vengono consegnati dai treni. Non ci sono marciapiedi per far fermare i treni viaggiatori.
LazyLB_Descritpion=Una cabina di segnalamento che controlla l'area "B" di un grande bivio e i binari di smistamento di Łazy.
Juliusz_Description=Una piccola cabina di segnalamento con una diramazione verso un'azienda locale e la possibilità di passare da un binario all'altro.
Szeligi_Description=Una piccola stazione sulla linea CMK, dove una diramazione per Marków si collega alla linea principale.
LazyLA_Description=Una cabina di segnalamento che protegge l'ingresso della stazione di Łazy. Controlla gli scambi che portano alla parte merci della stazione, consentendo ai treni passeggeri di prendere la via più breve per raggiungere i marciapiedi.
Katowice_Description=È la più grande stazione di snodo della capitale dell'Alta Slesia. Serve i treni locali, a lunga percorrenza e internazionali. Dispone di cinque marciapiedi e il traffico ferroviario è molto intenso.
Dabrowa_Gornicza_Zabkowice_Description=Stazione di diramazione a Dąbrowa Górnicza. Da qui partono treni diretti a Łazy, al centro città e alle Acciaierie di Katowice. Ci sono tre marciapiedi e molti binari secondari.
DGHK_Description=Un bivio tra Dąbrowa Górnicza Ząbkowice,  Dąbrowa Górnicza Południowa e Dąbrowa Górnicza Strzemieszyce, che serve anche un binario di raccordo per l'acciaieria.
Bukowno_Description=Stazione con dieci binari principali, quattro dei quali si trovano su due marciapiedi, situata tra Sławków e Olkusz. Qui fermano solo i treni regionali.
Lazy_Description=Una cabina di segnalamento tra Łazy ŁA e ŁC, che controlla la parte centrale della stazione, dove si trovano i marciapiedi.
Pruszkow_Description=(LCS). Stazione di medie dimensioni alla periferia di Varsavia. Sull'unico binario della stazione fermano solo treni locali e regionali. Nella stazione sono presenti alcuni binari di raccordo e un terminal per container. Da qui è possibile controllare a distanza il bivio di Józefinow, dove vengono smistati i treni merci e passeggeri.
SosnowiecKazimierz_Description=Piccola stazione su un bivio che collega tre linee a binario unico provenienti da Sosnowiec Dańdówka, Sosnowiec Maczki e Dąbrowa Górnicza Strzemieszyce. Ci sono tre binari dove fermano solo i treni regionali.
Strzalki_Description=(LCS). Una piccola stazione sulla linea ferroviaria principale con due binari di precedenza. Da qui si controlla a distanza un piccolo bivio nelle vicinanze, chiamato Biała Rawska.
KrakowBatowice_Description=Una stazione di medie dimensioni con sei binari principali, tre dei quali hanno un binario per i treni regionali.
Niedzwiedz_Description=Niedźwiedź (in polacco “Orso”) è un'altra piccola stazione con due binari supplementari per fermare treni più lenti e altri due con un marciapiede per i treni locali.
Starzyny_Description=(LCS). Un bivio che protegge l'ingresso della linea ferroviaria principale provenendo da Kozłów. Qui i treni possono continuare il loro viaggio verso Varsavia via MRR, oppure dirigersi più a ovest verso Częstochowa via Koniecpol. Da qui si controlla a distanza un piccolo bivio nelle vicinanze, chiamato Sprowa.
KrakowPrzedmiescie_Description=Un piccolo bivio all'ingresso di Cracovia. Qui i treni merci sono separati dai treni passeggeri diretti alla stazione principale di Cracovia.
Raciborowice_Description=Un bivio che separa il traffico da e verso la stazione merci di Kraków Nowa Huta e Kraków Batowice. 
Zastow_Description=Piccola stazione situata tra il bivio di Raciborowice e la stazione di Niedźwiedź. Ci sono due binari dove è possibile fermare i treni più lenti, e due binari principali con un marciapiede, dove è prevista la fermata solo dei treni pendolari.
Miechow_Descrption=Piccola stazione con quattro binari principali che possono essere utilizzati per far passare i treni più veloci, situata tra Tunel e Słomniki. Due dei binari della stazione hanno un marciapiede, dove si fermano i treni regionali e alcuni treni più lenti a lunga percorrenza.
Slomniki_Description=Piccola stazione tra Miechów e Niedźwiedź, dove fermano solo treni locali. Qui ci sono quattro binari, tre dei quali possono accogliere treni passeggeri.
