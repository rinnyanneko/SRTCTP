



Katowice_Zawodzie_Description=Sólo paran aquí los trenes de cercanías. Cuatro vías conducen desde aquí a la estación principal de Katowice, ambas en línea separada. Hay dos andenes disponibles.
Sosnowiec_Glowny_Description=Una de las estaciones más importantes de la región, que presta servicio a todos los trenes de pasajeros. Aquí confluyen las dos líneas principales disponibles en el juego, cada una de ellas con su propio andén.
Bedzin_Description=Una estación entre Dąbrowa Górnicza y la estación principal de Sosnowiec. Cuenta con 6 vías principales, 3 de ellas electrificadas. Aquí solo paran trenes de cercanías.
Dabrowa_Gornicza_Description=Pequeña estación con dos vías y un andén. Aquí paran tanto trenes regionales como de larga distancia.
Psary_Description=Una estación sencilla en la que un apartadero se bifurca de la vía principal y conecta con la línea 64. Hay tres vías principales y dos laterales, sin andenes.
Knapwowka_Description=Un cruce en la ruta ferroviaria principal. De aquí parte un ramal hacia la estación de Czarnca.
Wloszczowa_Polnoc_Description=Una estación de tamaño medio en la Ruta Ferroviaria Principal con dos andenes. Sus tres vías dan servicio a la mayoría de los trenes de larga distancia. Aquí comienza una línea de bifurcación hacia Żelisławice.
Olszamowice_Description=(LCS). Una pequeña estación en la ruta ferroviaria principal con dos vías laterales. Desde aquí se controla a distancia un pequeño cruce cercano llamado Pilichowice.
Pilichowice_Description=Un cruce en la ruta ferroviaria principal. Aquí sólo es posible cambiar de la vía izquierda a la derecha y viceversa.
Lazy_Lc_Description=Un enclavamiento que vigila la entrada a la estación de Łazy. Controla las agujas que conducen a la parte de mercancías de la estación, permitiendo que los trenes de pasajeros tomen el camino más corto hacia los andenes.
Gora_Wlodowska_Description=Una pequeña estación sin andenes en la Ruta Ferroviaria Principal. Las dos vías laterales se pueden utilizar para detener los trenes que se van a adelantar.
Opoczno_Poludnie_Description=Estación de la línea principal de ferrocarril. Tiene un andén, donde paran algunos trenes de larga distancia.
Dabrowa_Gornicza_Wschodnia_Description=Estación de enlace de tamaño medio, donde confluyen dos líneas. Dos de sus seis vías principales se encuentran junto al andén, donde paran los trenes de cercanías. La mayoría de los trenes que pasan por aquí son de carga.
Zawiercie_Description=Una gran estación con dos andenes y muchas vías laterales, donde pueden detenerse trenes de carga. La mayoría de los trenes de pasajeros paran aquí. Aquí termina la Ruta Ferroviaria Principal, y los trenes procedentes de Varsovia continúan por vías regulares.
Sosnowiec_Poludniowy_Description=Pequeña estación de bifurcación, donde la vía única de Sosnowiec Dańdówka se bifurca en dos vías que conducen a Sosnowiec Główny, una de las cuales entra en la estación y la otra la circunvala por el sur. Tiene siete vías, dos de las cuales están situadas junto a un único andén. Junto a la estación hay también una terminal intermodal de contenedores.
Idzikowice_Description=La estación más grande situada en la Ruta Ferroviaria Principal. Aquí se separan dos ramales de la línea Tomaszów Mazowiecki - Radom. Aquí hay una empresa de mantenimiento de coches de pasajeros, así como un servicio de transportistas regionales. En esta estación no hay andenes.
Slawkow_Description=Estación de tamaño medio situada entre Dąbrowa Górnicza Wschodnia y Bukowno. Cuenta con cuatro vías electrificadas, dos de las cuales dan servicio al único andén de la estación. Aquí paran los trenes regionales.
Dorota_Description=Pequeño cruce en el que confluyen dos líneas de vía doble y una de vía única.
Grodzisk_Mazowiecki_Description=Estación situada en la zona suburbana de Varsovia, donde paran trenes regionales, de larga distancia e internacionales. Dispone de dos andenes, y los trenes exprés pueden pasar por la estación a través de sus vías separadas. Es la primera estación de la línea 4, también conocida como Ruta Ferroviaria Principal (CMK).
Tunel_Description=Pequeña estación donde los trenes procedentes de Varsovia pueden cambiar de vía para ir a Cracovia o Sosnowiec. Hay un único andén que solo utilizan algunos trenes regionales.
Kozlow_Description=Estación de tamaño medio en la que sólo paran trenes regionales. Tiene tres andenes, pero no paran muchos trenes. Desde aquí se pueden coger trenes hacia Koniecpol, Psary, Sędziszów, Katowice y Cracovia.
Korytow_Description=La primera estación de la ruta CMK. Además de las dos vías principales y las dos adicionales, hay algunas vías laterales y un apartadero donde los trenes entregan los áridos. No dispone de andén para pasajeros.
LazyLA_Description=Un enclavamiento que vigila la entrada a la estación de Łazy. Controla las agujas que conducen a la zona de mercancías de la estación, permitiendo que los trenes de pasajeros tomen el camino más corto hacia los andenes.
LazyLB_Descritpion=Enclavamiento que controla la zona "B" de un gran nudo ferroviario y el lomo de asno de Łazy.
Juliusz_Description=Apartadero con una vía muerta a hacia una empresa cercana y posibilidad de cambiar de la vía izquierda a la derecha y viceversa.
Szeligi_Description=Una pequeña estación en la ruta CMK, donde un ramal hacia Marków conecta con la Ruta Principal.
Katowice_Description=La mayor estación de enlace de la capital de la Alta Silesia. Da servicio a los trenes de cercanías, larga distancia e internacionales. Dispone de cinco andenes, ya que el tráfico de trenes es importante.
Dabrowa_Gornicza_Zabkowice_Description=Una estación de enlace en Dąbrowa Górnicza. Desde aquí salen trenes hacia el centro de la ciudad, así como hacia Łazy y Huta Katowice (Acería de Katowice). Hay tres andenes y muchas vías laterales.
SosnowiecKazimierz_Description=Pequeña estación de enlace que conecta tres líneas de vía única procedentes de Sosnowiec Dańdówka, Sosnowiec Maczki y Dąbrowa Górnicza Strzemieszyce. Cuenta con tres andenes en los que solo paran trenes de cercanías.
DGHK_Description=Un cruce entre Dąbrowa Górnicza Ząbkowice, Dąbrowa Górnicza Południowa y Dąbrowa Górnicza Strzemieszyce, también da servicio a un apartadero de la acería.
Bukowno_Description=Estación entre Sławków y Olkusz con diez vías principales, cuatro de ellas en uno de los dos andenes. Aquí solo paran trenes de cercanías.
Lazy_Description=Torre de señales entre Łazy ŁA y ŁC, que controla la parte central de la estación, donde se encuentran los andenes.
Pruszkow_Description=(LCS). Estación de tamaño medio situada en las afueras de Varsovia. En el único andén de la estación sólo paran trenes regionales y de cercanías. En la estación hay algunos apartaderos y una terminal de contenedores. Desde aquí se puede controlar a distancia el nudo de Józefinow, donde se separan los trenes de mercancías de los de pasajeros.
Strzalki_Description=(LCS). Una pequeña estación en la Ruta Ferroviaria Principal con dos vías laterales. Desde aquí se controla a distancia un pequeño cruce cercano llamado Biała Rawska.
Slomniki_Description=Pequeña estación entre Miechów y Niedźwiedź, donde solo paran trenes de cercanías. Cuenta con cuatro vías, tres de las cuales admiten trenes de pasajeros.
Raciborowice_Description=Cruce que separa el tráfico hacia y desde la estación de mercancías de Cracovia Nowa Huta y Cracovia Batowice. 
KrakowBatowice_Description=Estación de tamaño medio con seis vías principales, tres de ellas con andenes para trenes regionales de pasajeros.
Miechow_Descrption=Pequeña estación con cuatro vías principales que pueden utilizarse para adelantar a los trenes más lentos, situada entre Tunel y Słomniki. Dos de las vías de la estación están situadas junto a un andén, donde paran los trenes de cercanías y algunos trenes más lentos de largo recorrido.
Zastow_Description=Pequeña estación situada entre el nudo de Raciborowice y la estación de Niedźwiedź. Dispone de dos vías laterales donde puede parar un tren lento para ser rebasado, y dos vías principales situadas junto a un andén, donde solo está prevista la parada de trenes de cercanías.
KrakowPrzedmiescie_Description=Pequeño nudo de comunicaciones a la entrada de Cracovia. Aquí se dividen los trenes de carga de los de pasajeros, que se dirigen a la estación principal de la ciudad.
Niedzwiedz_Description=Niedźwiedź (en polaco, «Oso») es otra pequeña estación con dos vías adicionales para parar un tren más lento, y otras dos con un andén que da servicio únicamente a trenes de cercanías.
Starzyny_Description=(LCS). Un cruce que guarda la entrada a la Ruta Ferroviaria Principal cuando se sale de Kozłów. Aquí los trenes pueden continuar su viaje a Varsovia a través de la MRR, o dirigirse más al oeste hacia Częstochowa a través de la estación de Koniecpol. Desde aquí se controla a distancia un pequeño cruce cercano llamado Sprowa.
