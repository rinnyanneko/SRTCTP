



Katowice_Zawodzie_Description=本站僅有普通列車停靠。往卡托維茲總站方向有屬於 1 號線與 138 號線的四條區間路線，兩條路線各自設有一座雙側月台。
Bedzin_Description=本站位於棟布羅瓦古爾尼恰與索斯諾維茨總站之間，設有 6 條主股道，其中僅 3 條電氣化。本站僅有普通列車停靠。
Dabrowa_Gornicza_Description=一座設有兩條股道及一座月台的小站，普通列車與快速列車均停靠本站。
Lazy_Lc_Description=負責瓦濟站棟布羅瓦古爾尼恰端進站作業的號誌樓。此處控制將貨運列車導向車站貨運區各支線的轉轍器，並將通往月台的最短路徑留給客運列車。
Gora_Wlodowska_Description=中央鐵路幹線上的小站，沒有客運列車停靠。站內有兩條副正線，可供遭超越的列車待避。
Psary_Description=本站為中央鐵路幹線分歧通往科茲武夫－科涅茨波爾路線聯絡線之處，設有三條主要正線及兩條副正線，站內沒有月台。
Knapwowka_Description=中央鐵路幹線上的分歧號誌站，通往恰恩察站的聯絡線由此分出。
Wloszczowa_Polnoc_Description=中央鐵路幹線上的車站，設有兩座月台；多數快速列車停靠於月台旁的三條股道。
Olszamowice_Description=（LCS）中央鐵路幹線上的小站，設有兩條副正線。鄰近的小型分歧號誌站皮利霍維采由此處遠端控制。
Opoczno_Poludnie_Description=中央鐵路幹線上的車站，部分長途列車停靠於站內唯一的月台。
Dabrowa_Gornicza_Wschodnia_Description=四個方向路線交會的樞紐站。六條主股道中僅兩條設於月台旁，供普通列車停靠。通過本站的列車多為貨運列車。
Zawiercie_Description=設有兩座月台及多條副正線的大站，貨運列車可停放於此。多數客運列車停靠本站，中央鐵路幹線亦在此終止。
Sosnowiec_Glowny_Description=本地區最重要的車站之一，亦辦理特快列車業務。遊戲中的 1 號線與 62 號線在此交會，兩條路線各有一座月台。
Pilichowice_Description=中央鐵路幹線區間上的分歧號誌站，此處僅能讓列車由左線轉至右線，或由右線轉至左線。
Sosnowiec_Poludniowy_Description=一座小型樞紐站。自索斯諾維茨丹杜夫卡而來的單線區間在此分出兩條通往索斯諾維茨總站的單線區間，一條進入該站，另一條由南側繞行。本站共有七條股道，其中兩條位於唯一的月台旁，另設有貨櫃場站。
Idzikowice_Description=中央鐵路幹線上最大的車站。主線在此分出兩條聯絡線，通往托馬舒夫馬佐維茨基－拉多姆路線。站內設有客車修理廠及區域營運業者的車輛維修基地。本站不辦理客運，亦未設月台。
Slawkow_Description=位於棟布羅瓦古爾尼恰東站與布科夫諾站之間的中型車站。站內有四條電氣化股道，其中兩條位於一座島式月台旁，區域列車停靠本站。
Dorota_Description=一座未設月台的分歧號誌站，兩條複線鐵路與一條單線鐵路在此交會。
Grodzisk_Mazowiecki_Description=位於華沙都會區的車站，辦理區域、長途及國際列車。旅客可使用兩座月台的三個月台側，特快列車則經獨立股道繞過月台。本站為 4 號線（中央鐵路幹線）的起點站。
Kozlow_Description=一座重要性較低的中型車站，三座月台僅有普通列車停靠。列車可由此駛往科涅茨波爾（CMK）、森濟舒夫、克拉科夫及卡托維茲方向。
Tunel_Description=一座小站，將來自華沙方向的列車分流往索斯諾維茨與克拉科夫。站內唯一的月台僅有普通列車停靠。
Korytow_Description=中央鐵路幹線上的第一座車站。除兩條主要正線與兩條副正線外，另有側線及一條供砂石列車駛入的專用線。本站沒有客運列車停靠。
LazyLA_Description=負責瓦濟站扎維爾切端進站作業的號誌樓。此處控制將貨運列車導向車站貨運區各支線的轉轍器，並控制客運列車進入客運區。
LazyLB_Descritpion=負責大型樞紐兼調車場瓦濟站「B」區的號誌樓。
Juliusz_Description=服務附近工廠的專用線號誌站，並可讓列車由一條路線轉至另一條路線。
Szeligi_Description=中央鐵路幹線上一座沒有月台的小站，亦辦理通往馬爾庫夫站的聯絡線。
Katowice_Description=上西里西亞首府規模最大的樞紐車站，辦理都會、區域及長途運輸，包括特快與長途列車。站內設有五座月台、九個月台側，列車運轉非常繁忙。
Dabrowa_Gornicza_Zabkowice_Description=棟布羅瓦古爾尼恰的一座樞紐站。列車由此駛往瓦濟、市中心及卡托維茲鋼鐵廠。站內設有三座月台及多條副正線，可供遭超越的列車待避。
DGHK_Description=位於棟布羅瓦古爾尼恰宗布科維采、南站與斯特熱梅希采之間的分歧號誌站，亦辦理通往鋼鐵廠的專用線。
Bukowno_Description=位於斯瓦夫庫夫與奧爾庫什之間的樞紐站，設有十條主股道，其中四條位於兩座月台旁。本站僅有普通列車停靠。
Lazy_Description=負責瓦濟站中央區域的號誌樓，這座大型車站唯一的月台即位於此區。本站與 ŁA、ŁC 號誌樓相鄰，並辦理通往機務段的專用線。
Pruszkow_Description=（LCS）位於華沙都會區的中型車站，僅有區域及通勤列車停靠。站內有一座雙側月台、數條專用線及一座貨櫃場站。約瑟菲努夫分歧號誌站由此遠端控制，貨運與客運列車在進入華沙樞紐前於該處分流。
SosnowiecKazimierz_Description=一座小型樞紐站，索斯諾維茨丹杜夫卡、索斯諾維茨馬奇基及棟布羅瓦古爾尼恰斯特熱梅希采三站的單線區間在此交會。站內有三座單側月台，僅辦理普通列車。
Strzalki_Description=（LCS）中央鐵路幹線上的小站，設有兩條副正線。鄰近的小型分歧號誌站比亞瓦拉夫斯卡由此遠端控制。
KrakowPrzedmiescie_Description=克拉科夫入口處的分歧號誌站。前往克拉科夫總站的客運列車與繞過主要客運站的貨運列車在此分流。
Slomniki_Description=一座小站，設有三個供區域列車使用的月台側，以及一條未設月台、可供貨運列車停放待避的股道。相鄰號誌站為梅胡夫與涅茲維茲。
Raciborowice_Description=位於克拉科夫巴托維采站前的分歧號誌站，將部分貨運列車導向主要貨運站克拉科夫新胡塔。
KrakowBatowice_Description=一座中型車站，設有六條可辦理列車作業的主股道，其中三條設有月台側，僅供區域客運列車停靠。
Miechow_Descrption=位於圖內爾站與斯沃姆尼基站之間的小站，設有四條可供列車互相超越的主股道。其中兩條主股道位於月台旁，普通列車及部分快速列車停靠。
Starzyny_Description=負責守望科茲武夫端進入中央鐵路幹線的分歧號誌站。列車可由此經 CMK 前往華沙，或經科涅茨波爾前往琴斯托霍瓦。斯普羅瓦分歧號誌站亦由此遠端控制。
Zastow_Description=位於拉契波羅維采分歧號誌站與涅茲維茲站之間、僅辦理區域運輸的小站。站內有兩條可供慢速列車待避的副正線，以及兩條主要正線；主要正線間設有一座雙側島式月台。
Niedzwiedz_Description=另一座小站，設有兩條供慢速列車待避的副正線。站內亦僅有一座雙側月台，且只有普通列車停靠。
Zyrardow_Description=（LCS）日拉爾杜夫站位於馬佐夫舍格羅濟斯克與斯凱爾涅維采之間。站內兩座月台最多可同時辦理三班列車。本站號誌樓亦控制附近的馬佐夫舍拉季維武夫分歧號誌站。
Plycwia_description=普維契維亞是一座位於斯凱爾涅維采與羅古夫之間的小站，設有兩座月台及兩條可供慢速列車待避的副正線。
Rogow_description=羅古夫是一座位於科盧什基與普維契維亞之間的中型車站。站內有一座位於兩條主要正線之間的島式月台，以及兩條供慢速列車待避的副正線。
Koluszki_description=科盧什基是一座大型樞紐站，通往羅茲的路線在此自華沙－卡托維茲路線分出。另有一組聯絡線通往扎科維采南與斯沃特維內號誌站。站內有三座月台及多條適合列車待避與停放的副正線。
Galkowek_description=（LCS）加烏庫維克是科盧什基附近的小站，辦理兩條鐵路：通往羅茲法布里奇納的客運線，以及經羅茲奧萊胡夫貨運站的貨運線。客運線設有兩座月台。本站亦遠端控制羅茲安傑尤夫專用線號誌站。
Zakowice_Description=扎科維采南是羅茲至托馬舒夫馬佐維茨基路線上的小型分歧號誌站，主要供貨運列車使用，由科盧什基行車調度員所在的建築遠端控制。
Skierniewice_description=斯凱爾涅維采是一座大型樞紐站，通往華沙、羅茲、沃維奇及武庫夫的路線由此分出。除三座月台外，另有多條副正線可供列車技術停車。車站旁有一座歷史悠久的蒸汽機車庫。
Widzew_Description=羅茲維澤夫是羅茲市內的重要車站，所有行經市區的各類客運列車均在此停靠。站內亦設有當地營運業者的維修基地，旅客可使用三座月台。
Wlochy_description=辦理自西側進入華沙樞紐之客運列車的分歧號誌站，來自卡托維茲、波茲南與馬佐夫舍格羅濟斯克的路線在此交會。
Rokiciny_Description=一座位於彼得庫夫特雷布納爾斯基與科盧什基之間的小站，設有貨物裝卸場，以及位置特殊、位於進站與出站號誌機之間的月台。
Baby_Description=本站位於彼得庫夫特雷布納爾斯基與科盧什基之間，設有專用線、貨物裝卸場，以及位置特殊、位於進站與出站號誌機之間的月台。
Pabianice_Description=一座設有雙側月台與單側月台的車站，往瓦斯克的區間設有自動閉塞號誌站。
Gajewniki_Description=位於茲敦斯卡沃拉附近的分歧號誌站，通往連接南北之煤運幹線的路線由此分出。
Lask_Description=一座設有雙側月台與單側月台的車站，另有通往軍事單位的專用線。往帕比亞尼采與加耶夫尼基的區間設有自動閉塞號誌站。
Zabieniec_Description=位於茲蓋日與羅茲卡利斯卡之間的中型車站，設有兩座單側月台，並有多條專用線由此分出。
Zgierz_Description=一座樞紐站，將來自沃維奇與庫特諾的列車導向羅茲維澤夫及羅茲卡利斯卡。站內設有 PKP Energetyka 的專用線。
Lublinek_Description=位於羅茲盧布利內克機場附近的車站，設有兩座雙側月台，僅有區域列車停靠。
Retkinia_Description=一座分歧號誌站，將來自茲敦斯卡沃拉的列車導向茲蓋日或科盧什基。往羅茲盧布利內克的區間設有羅茲雷特基尼亞客運乘降所。
Zdunska_Wola_Description=一座大型樞紐站，通往煤運幹線的路線由此分出。站內有兩座月台及多條供貨運使用的副正線，區域列車與部分長途列車停靠本站。
Chojny_Description=位於羅茲南部的車站，過去長期不辦理客運並逐漸荒廢。羅茲法布里奇納改建後，本站開始辦理長途與區域運輸，站內設有兩座月台。
Kaliska_Description=位於羅茲西部的大型樞紐站，辦理來自庫特諾、沃維奇、茲敦斯卡沃拉及羅茲霍伊內方向的列車。站內設有三座月台及多條辦理列車作業的股道。
Witonia_Description=位於茲蓋日－庫特諾單線區間的車站，並遠端控制文奇察與奧佐爾庫夫兩站。兩站均設有貨物裝卸場，文奇察另有軍用專用線；各站皆設有客運月台。
Zgierz_Polnoc_Description=設於茲蓋日號誌樓內的遠端控制席，負責茲蓋日－庫特諾單線區間上的三座車站。茲蓋日孔特雷韋爾斯與茲蓋日北站各有兩條股道及兩座短型單側月台；霍齊謝夫則有兩座較長月台及一條額外股道。
Glinnik_Description=一座採繼電聯鎖、由當地控制的複線交會站。值班員亦由此遠端控制斯特雷庫夫站；該站多一條主股道及一座貨物裝卸場。
Glowno_Description=本站於 2015 年現代化改造時裝設電腦聯鎖設備。改造後，格沃夫諾值班員亦遠端控制多馬涅維采站；該站正在測試一種號誌頭可下降的新型號誌機。
Lowicz_Przedmiescie_Description=位於自茲蓋日而來之 15 號單線鐵路上的中型車站。除 15 號線繼續通往貝德納雷外，另有兩條聯絡線，可讓列車駛往沃維奇總站或貝德納雷方向。
Lowicz_Glowny_Description=位於 E20 幹線上的大型樞紐站。CE20 貨運走廊由此分出，使貨運列車可經斯凱爾涅維采再往武庫夫方向，繞過華沙鐵路樞紐。站內設有兩座雙側月台；現代化改造時，原阿爾卡迪亞與普拉岑恰分歧號誌站已併入本站。
Belchow_Description=斯凱爾涅維采與沃維奇總站之間唯一的車站，設有一座月台及五條股道，由斯凱爾涅維采遠端控制。往斯凱爾涅維采的區間設有於現代化改造期間裝設的自動閉塞號誌。
