

Bedzin_Description=Станція між Домбровой-Гурничей і Сосновцем-Головним. Вона має 6 основних колій, з яких тільки 3 електрифіковані. Зупинка лише для приміських поїздів.
Dabrowa_Gornicza_Description=Невелика станція з двома коліями та платформою. Як і приміські, так і поїзди далекого прямування зупиняються тут.


Katowice_Zawodzie_Description=Тут зупиняються лише приміські поїзди. Звідси до головної станції в Катовіцах ведуть чотири колії, розділені на лінії № 1 і 138. Кожна с цих ліній має особисту платформу.
Sosnowiec_Glowny_Description=Одна з найважливіших станцій у воєводстві, яка обслуговує усі пасажирські поїзда. Тут зустрічаються лінії № 1 і 62, котрі мають власні платформи.
Lazy_Lc_Description=Пост чергового, розташований на початку станції Łazy. Цей пост експлуатує маршрути, що ведуть до вантажної частини станції, дозволяючи пасажирським поїздам рухатися під платформою найкоротшим шляхом.
Gora_Wlodowska_Description=Мала станція без платформ на Центральній залізничній магістралі. Дві бокові колії можуть бути використані для зупинки поїздів, яких повинні наздогнати.
Knapwowka_Description=Вузлова станція на Центральній Залізничній Магістралі. Тут від головної лінії відходить гілка до станції Czarnca (Чарнка).
Wloszczowa_Polnoc_Description=Станція на Центральній Залізничній Магістралі з двома платформами. Більшість швидкісних поїздів зупиняються на трьох коліях. Тут починається відгалуження до Żelisławice (Желіславиці).
Psary_Description=Проста станція, де від Центральної Залізничної Магістралі відгалужується під'їзна колія, що з'єднує її з лінією 64. На станції є три головні колії та дві бічні, без платформ.
Olszamowice_Description=Мала станція на Центральній Залізничній Магістралі з двома боковими коліями. Звідси ви дистанційно керуєте невеликим роз'їздом неподалік під назвою Pilichowice.
Pilichowice_Description=Стрілочний пост на маршруті Центральної Залізничної Магістралі. В цьому місці можлива лише зміна лівої колії на праву і навпаки.
Opoczno_Poludnie_Description=Станція на Центральній Залізничній Магістралі. На її єдиній платформі зупиняються деякі поїзди далекого прямування.
Dabrowa_Gornicza_Wschodnia_Description=Вузлова станція, де зустрічаються лінії в чотирьох напрямках. З шести головних колій лише дві знаходяться на платформі, яка обслуговує пасажирські поїзди. Більшість поїздів, що проходять тут - вантажні.
Zawiercie_Description=Велика станція з двома платформами та безліччю бічних колій, де можуть зупинятися вантажні поїзди. Більшість пасажирських поїздів зупиняються тут. Саме тут закінчується Центральна Залізнична Магістраль, і поїзди з Warsaw (Варшави) продовжують рух по звичайних коліях.
Idzikowice_Description=Найбільша станція на Центральній Залізничній Магістралі. Тут від головної лінії відходять дві гілки на лінію Tomaszów Mazowiecki – Radom (Томашів Мазовецький - Радом). На станції розташований пункт ремонту пасажирських вагонів та пункт технічного обслуговування рухомого складу регіонального залізничного оператора. Станція не обслуговує пасажирські перевезення - тут немає платформ.
Grodzisk_Mazowiecki_Description=Станція у варшавському передмісті, яка обслуговує місцеві, міжміські та міжнародні поїзди. Пасажири можуть користуватися трьома сторонами платформ на двох перонах. Швидкісні поїзди об'їжджають платформи окремими коліями. Це початкова станція лінії № 4 Центральної Залізничної Магістралі.
Szeligi_Description=Маленька станція без перонів на Центральній залізничній магістралі, яка також обслуговує з'єднання зі станцією Marków (Маркув).
Sosnowiec_Poludniowy_Description=Невелика вузлова станція, де одна колія з Sosnowiec Dańdówka (Сосновець-Дандувка) розгалужується на дві колії, що ведуть до Sosnowiec Główny (Сосновець-Головний) - одна з них заходить на станцію, а інша оминає її з півдня. Тут є сім колій, дві з яких розташовані біля єдиної платформи. Поруч зі станцією знаходиться також інтермодальний контейнерний термінал.
LazyLA_Description=Сигнальний пост, що охороняє вхід на станцію Łazy (Лази). Він керує стрілками, що ведуть до товарної частини станції, дозволяючи пасажирським поїздам обирати найкоротший шлях до платформ.
LazyLB_Descritpion=Сигнальний пост, що контролює зону "B" великого вузла і сортувального парку Łazy (Лази).
Juliusz_Description=Пост з під'їзною колією до сусіднього підприємства та можливістю переходу з лівої колії на праву і назад.
Kozlow_Description=Станція середнього розміру, де зупиняються лише регіональні поїзди. Тут є три платформи, але тут зупиняється не так багато поїздів. Звідси можна відправитись до Psary, Sędziszów, Katowice та Kraków.
Tunel_Description=Невелика станція, де поїзди з Варшави можуть пересісти на іншу колію, щоб поїхати до Кракова або Сосновця. Є одна платформа, яка використовується лише кількома регіональними поїздами.
Slawkow_Description=Станція середнього розміру між Dąbrowa Górnicza Wschodnia (Домбровою Гурнічою Східною) та Bukowno (Буковно). Тут є чотири електрифіковані колії, дві з яких обслуговують єдину платформу станції. Тут зупиняються регіональні поїзди.
Dorota_Description=Невелика розв'язка, де перетинаються дві двоколійні та одна одноколійна лінії.
Korytow_Description=Перша станція маршруту CMK. Окрім двох головних та двох додаткових колій, є кілька бічних колій та під'їзна колія, якою поїзди перевозять щебінь. Платформи для зупинки пасажирських поїздів немає.
Katowice_Description=Найбільша вузлова станція в столиці Верхньої Сілезії. Обслуговує місцеві, міжміські та міжнародні поїзди. Тут є п'ять платформ, оскільки рух поїздів є значним.
Dabrowa_Gornicza_Zabkowice_Description=Вузлова станція в Dąbrowa Górnicza (Домброві Гурнічій). Звідси відправляються поїзди до центру міста, а також до Łazy (Лазів) та Huta Katowice (Гути Катовіце) (Катовіцького металургійного заводу). Тут є три платформи та багато бічних колій.
DGHK_Description=Відгалуження між Dąbrowa Górnicza Ząbkowice, Dąbrowa Górnicza Południowa та Dąbrowa Górnicza Strzemieszyce, яке також обслуговує під'їзну колію до металургійного заводу.
Bukowno_Description=Станція між Sławków та Olkusz з десятьма головними коліями, чотири з яких знаходяться на одній з двох платформ. Тут зупиняються лише приміські поїзди.
SosnowiecKazimierz_Description=Невелика вузлова станція, що з'єднує три одноколійні лінії з Sosnowiec Dańdówka, Sosnowiec Maczki та Dąbrowa Górnicza Strzemieszyce. Має три платформи, на яких зупиняються лише приміські поїзди.
Lazy_Description=Сигнальний пост між Łazy ŁA і ŁC, що керує центральною частиною станції, де розташовані платформи.
Pruszkow_Description=(LCS). Станція середнього розміру на околиці Варшави. На єдиній платформі станції зупиняються лише місцеві та регіональні поїзди. На станції є кілька під'їзних колій та контейнерний термінал. Звідси ви можете дистанційно керувати роз'їздом Józefinow, де розділяються вантажні та пасажирські поїзди.
Strzalki_Description=(LCS). Невелика станція на Головному залізничному маршруті з двома бічними коліями. Звідси ви дистанційно керуєте невеликим роз'їздом неподалік під назвою Biała Rawska.
KrakowBatowice_Description=Станція середнього розміру з шістьма головними коліями, три з яких мають платформи для регіональних пасажирських поїздів.
KrakowPrzedmiescie_Description=Пост відгалуження на в'їзді до Кракова. Тут розділяється рух пасажирських поїздів у напрямку Кракова-Головного та вантажних, які оминають головну станцію, що обслуговує пасажирський рух.
Slomniki_Description=Невелика станція з трьома перонними краями для регіональних поїздів і однією колією без перону, де можна відставити для обгону вантажний поїзд. Сусідніми постами руху є Miechów(Мєхув) і Niedźwiedź(Нєдзвєдзь).
Miechow_Descrption=Невелика станція з чотирма головними коліями, які можна використовувати для обгону повільніших поїздів, розташована між Tunel(Тунелем) і Słomniki (Сломниками). Дві колії станції розташовані біля платформи, де зупиняються приміські та деякі повільніші поїзди далекого сполучення.
Raciborowice_Description=Пост відгалуження перед Kraków Batowice(Краковом Батовицями), що направляє частину вантажних поїздів на головну вантажну станцію Kraków Nowa Huta(Краків Нова Гута). 
Plycwia_description=Невелика станція, розташована між Skierniewice (Скерневицями) та Rogów (Рогувом). Тут є дві платформи, а також дві бічні колії, які можна використовувати для обгону повільніших поїздів.
Zastow_Description=Невелика станція, що обслуговує лише регіональний рух, розташована між постом відгалуження Raciborowice (Раціборовіце) та станцією Niedźwiedź (Нєдзвєдзь). Тут знаходяться дві додаткові головні колії, де можна зупинити повільніший поїзд, і дві основні головні колії, біля яких збудовано острівний двосторонній перон.
Starzyny_Description=(LCS) Пост відгалуження, що охороняє в'їзд на Центральну залізничну магістраль з боку Козлова. Поїзди звідси прямують у напрямку Варшави через CMK, або в напрямку Częstochowa (Ченстохови) через Koniecpol (Конєцполь). З цього місця можна дистанційно керувати постом відгалуження Sprowa (Спрова).
Galkowek_description=(LCS) Невелика станція біля Koluszki (Колюшок), що обслуговує дві лінії - пасажирську до Лодзі-Фабричної (лінія 17) та вантажну через вантажну станцію Łódź Olechów (Лодзь-Олехув) (лінія 25). На лінії 17 є дві пасажирські платформи. Цей пост централізації також дистанційно керує сигналізацією на станції Łódź Andrzejów (Лодзь-Анджеюв), що знаходиться біля станції Łódź Widzew (Лодзь-Відзев).
Zakowice_Description=Невеликий роз'їзд на альтернативному маршруті з Лодзі до Koluszki (Колюшок), що використовується переважно вантажними поїздами. Він дистанційно керується з диспетчерської будівлі, розташованої в Колюшках.
Niedzwiedz_Description=Ще одна невелика станція з двома додатковими коліями для зупинки повільніших поїздів. Тут також є лише один, двосторонній перон, на якому зупиняються лише пасажирські поїзди.
Skierniewice_description=Велика вузлова станція, з якої розходяться лінії на Варшаву, Лодзь, Лович і Луків. Окрім трьох платформ, тут є багато бічних колій, які можна використовувати для технічних зупинок поїздів. Поруч зі станцією розташоване історичне паровозне депо.
Widzew_Description=Важлива станція в районі Лодзі, що обслуговує всі види пасажирських поїздів, що проходять через місто. Тут також знаходиться база технічного обслуговування місцевої транспортної компанії. Доступно три платформи, загалом шість колій. Вантажні поїзди можуть повністю оминути станцію, використовуючи обхідну лінію.
Zyrardow_Description=(LCS) Станція між Grodzisk Mazowiecki (Гродзиськом-Мазовецьким) та Skierniewice (Скерневицями). Тут є дві платформи, що можуть одночасно обслуговувати до трьох поїздів. Пост централізації, що знаходиться тут, також керує сусіднім роз'їздом Radziwiłłów Mazowiecki (Радзивіллув-Мазовецький).
Koluszki_description=Велика вузлова станція, де лінія на Лодзь відгалужується від лінії, що з'єднує Варшаву та Катовіце. Тут є три платформи, а також багато бічних колій, корисних для обгону.
Rogow_description=Станція середнього розміру, розташована між станціями Koluszki (Колюшки) та Płyćwia (Пличвя). Тут є одна платформа, розташована між двома головними коліями, а також чотири інші бічні колії, які можна використовувати за потреби для обгону.
Wlochy_description=Роз'їзд, що обслуговує пасажирські поїзди, які в'їжджають до Варшави із заходу. Тут сходяться лінії з Катовіце, Познані та Гродзиська-Мазовецького.
Rokiciny_Description=Невелика станція, розташована між Пйотркувом-Трибунальським і Колюшками. На станції є вантажний двір і незвично розташовані платформи між вхідними та вихідними сигналами.
Lask_Description=Залізнична станція з однією острівною платформою та однією односторонньою платформою. Від станції відгалужується під'їзна колія до військової частини. Лінії в напрямку Паб'яниць і Гаєвників обладнані постами автоматичного блокування.
Baby_Description=Станція, розташована між Пйотркувом-Трибунальським і Колюшками. На станції є під'їзна колія, вантажний двір і незвично розташовані платформи між вхідними та вихідними сигналами.
Pabianice_Description=Залізнична станція з однією острівною платформою та однією односторонньою платформою. Лінія в напрямку Ласька обладнана постом автоматичного блокування.
Gajewniki_Description=Пост відгалуження, розташований поблизу Здунської-Волі. Від поста відгалужуються лінії до Вугільної магістралі, яка з'єднує північ і південь.
Kaliska_Description=Велика вузлова станція, розташована в західній частині Лодзі. Вона обслуговує рух поїздів з Кутно, Ловича, Здунської-Волі та Лодзі-Хойни. На станції є три платформи та численні колії для роботи поїздів.
Zabieniec_Description=Станція середнього розміру, розташована між Згежем і Лодзь-Каліською. На станції є дві односторонні платформи. Від станції відгалужуються численні під'їзні колії.
Zgierz_Description=Вузлова станція, що спрямовує рух від Ловича та Кутно в напрямку Лодзь-Відзева та Лодзь-Каліської. На станції розташована під'їзна колія PKP Energetyka.
Lublinek_Description=Станція поблизу аеропорту Лодзь-Люблінек. На станції є дві острівні платформи. Тут зупиняються лише регіональні поїзди.
Retkinia_Description=Пост відгалуження, що спрямовує рух від Здунської-Волі в напрямку Згежа або Колюшок. На лінії в напрямку Лодзь-Люблінека знаходиться пасажирська зупинка Лодзь-Реткіня.
Chojny_Description=Станція в південній частині Лодзі, яка тривалий час не обслуговувала пасажирський рух і занепадала. Після реконструкції Лодзі-Фабричної станція почала обслуговувати дальнє та регіональне сполучення. Станція має дві платформи.
Zdunska_Wola_Description=Велика вузлова станція, від якої відгалужуються лінії до Вугільної магістралі. На станції є дві платформи та численні додаткові колії, що використовуються для вантажного руху. Тут зупиняються регіональні та окремі поїзди далекого сполучення.
