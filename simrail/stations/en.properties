

Katowice_Zawodzie_Description=Only commuter trains stop here. Four tracks lead from here to Katowice Main Station, both on separate lines. There are two platforms available.
Sosnowiec_Glowny_Description=One of the most important stations in the region, serving all passenger trains. The two of the main lines available in game meet here, each of them having their own platform.
Bedzin_Description=A station between Dąbrowa Górnicza and Sosnowiec Main Station. There are 6 main tracks, 3 of which are electrified. Only commuter trains stop here.
Dabrowa_Gornicza_Description=A small station with two tracks and a platform. Both regional and long-distance trains stop here.
Lazy_Lc_Description=A signal box guarding entrance to Łazy station. It controls switches leading to the goods part of the station, letting the passenger trains take the shortest way to the platforms.
Gora_Wlodowska_Description=A little station with no platforms on the Main Railway Route. The two side tracks can be used to stop trains that are to be overtaken.
Psary_Description=A simple station where a siding branches out of the Main Railway Route and connects to the line 64. There are three main tracks and two side ones, with no platforms.
Knapwowka_Description=A junction on the Main Railway Route. A branching line to Czarnca station starts here.
Wloszczowa_Polnoc_Description=A medium size station on the  Main Railway Route with two platforms. Their three tracks serve most long distance trains. A branching line to Żelisławice starts here.
Olszamowice_Description=(LCS). A little station on the Main Railway Route with two side tracks. From here you control remotely a small junction nearby named Pilichowice.
Pilichowice_Description=A junction on the Main Railway Route. Only changing from the left track to the right one and back is possible here.
Opoczno_Poludnie_Description=A station on the Main Railway Route. It has one platform, where some of the long distance trains stop.
Dabrowa_Gornicza_Wschodnia_Description=A medium sized junction station, where two lines meet. Two of its six main tracks are located by the platform, where the commuter trains stop. Most of the trains passing through here are cargo ones.
Zawiercie_Description=A big station with two platforms and many side tracks, where cargo trains can be stopped. Most passenger trains stop here. Here the Main Railway Route ends, and the trains from Warsaw continue on regular tracks.
Sosnowiec_Poludniowy_Description=A small junction station, where the single track from Sosnowiec Dańdówka branches to two tracks leading to Sosnowiec Główny – one of them leading into the station, and the other one bypassing it from the south. There are seven tracks here, two of which are situated by the only platform. There is also an intermodal container terminal next to the station.
Idzikowice_Description=The biggest station situated on the Main Railway Route. Two branches separate here to the Tomaszów Mazowiecki – Radom line. There is a passenger carriage repair company, as well as regional carrier’s service here. There are no platforms at this station.
Slawkow_Description=A middle-sized station between Dąbrowa Górnicza Wschodnia and Bukowno. There are four electrified tracks here, two of which serve the station’s only platform. Regional trains stop here.
Dorota_Description=A small junction where two double-track and one single-track lines meet.
Grodzisk_Mazowiecki_Description=A station in Warsaw’s suburban area, where regional, long-distance and international trains stop. There are two platforms here, and the express trains can pass the station via their separate tracks. This is the first station of the line 4, also known as the Main Railway Route (CMK).
Kozlow_Description=A medium-sized station where only regional trains stop. There are three platforms, but not many trains stop here. From here you can catch trains to Koniecpol, Psary, Sędziszów, Katowice and Kraków.
Tunel_Description=A small station where trains from Warsaw can change tracks to go to Kraków or Sosnowiec. There is a single platform which is only used by a few regional trains.
Korytow_Description=The first station of the CMK route. Aside from two main and two additional tracks, there are  a few side tracks, and a siding where aggregate is delivered by trains. There is no platform for passenger trains to stop by.
LazyLA_Description=A signal box guarding entrance to Łazy station. It controls switches leading to the goods part of the station, letting the passenger trains take the shortest way to the platforms.
LazyLB_Descritpion=A signal box controlling the „B” area of a big junction and hump yard Łazy.
Juliusz_Description=A siding post with a siding to a nearby company and a possibility to change from the left track to the right one and back.
Szeligi_Description=A little station on the CMK route, where a branching line to Marków connects to the Main Route.
Katowice_Description=The biggest junction station in the Upper Silesia’s capital. It serves the local, long distance and international trains. There are five platforms here, as the train traffic is significant.
Dabrowa_Gornicza_Zabkowice_Description=A junction station in Dąbrowa Górnicza. There are trains to the city’s center, as well as to Łazy and Huta Katowice (Katowice Steelworks) from here. Three platforms and many side tracks are available here.
DGHK_Description=A junction between Dąbrowa Górnicza Ząbkowice,  Dąbrowa Górnicza Południowa and Dąbrowa Górnicza Strzemieszyce, also serving a steelwerks sidings.
Bukowno_Description=A station between Sławków and Olkusz with ten main tracks, four of which are on one of two platforms. Only commuter trains stop here.
SosnowiecKazimierz_Description=A small junction station connecting three single track lines from Sosnowiec Dańdówka, Sosnowiec Maczki and Dąbrowa Górnicza Strzemieszyce. There are three platforms where only commuter trains stop.
Lazy_Description=A signal box between Łazy ŁA and ŁC, controlling the central part of the station, where the platforms are located.
Pruszkow_Description=(LCS). A medium-sized station on the outskirts of Warsaw. Only local and regional trains stop at the station's only platform. There are a few sidings and a container terminal at the station. From here you can remotely control the Józefinow junction, where freight and passenger trains are separated.
Strzalki_Description=(LCS). A little station on the Main Railway Route with two side tracks. From here you control remotely a small junction nearby named Biała Rawska.
KrakowBatowice_Description=A middle-sized station with six main tracks, three of which have a platforms for regional, passenger trains.
KrakowPrzedmiescie_Description=A small junction guarding the entrance to Kraków. Here cargo trains are separated from passenger ones, that are heading to the main station in the city.
Slomniki_Description=A small station between Miechów and Niedźwiedź, where only commuter trains stop. There are four tracks here, three of which can handle passenger trains.
Miechow_Descrption=A small station with four main tracks that can be used for overtaking slower trains, located between Tunel and Słomniki. Two of the station’s tracks are located by a platform, where commuter and some slower, long-distance trains stop.
Niedzwiedz_Description=Niedźwiedź (polish „Bear”) is another small station with two extra tracks to halt a slower train, and two others with a platform serving only commuter trains.
Raciborowice_Description=A junction separating traffic to and from Kraków Nowa Huta freight station and Kraków Batowice. 
Starzyny_Description=(LCS). A junction guarding the entrance to the Main Railway Route when heading from Kozłów. Here the trains can continue their journey to Warsaw via the MRR, or head further West to Częstochowa via Koniecpol station. From here you control remotely a small junction nearby named Sprowa.
Zastow_Description=Small station located between Raciborowice junction and Niedźwiedź station. There are two side tracks where you can stop a slow train to be overtaken, and two main tracks located by a platform, where only commuter trains are scheduled to stop.
Zyrardow_Description=(LCS) Station between Grodzisk Mazowiecki and Skierniewice. There are two platforms here, that can serve up to three trains simultaneously. The signal box here is also controlling Radziwiłłów Mazowiecki junction nearby.
Skierniewice_description=Big junction station, from which lines to Warsaw, Łódź, Łowicz and Łuków branch out. Outside of three platforms, there are many side tracks which could be used to stop trains for their technical stops. Next to the station, there is a historic steam loco depot located here.
Plycwia_description=Small station located between Skierniewice and Rogów. There are two platforms here, as well as two side tracks that can be used for overtaking slower trains.
Rogow_description=Mid-sized station located between Koluszki and Płyćwia stations. There is a single platform here, located between two main tracks, as well as four other side tracks, that can be used if overtaking is needed.
Widzew_Description=Important station in Łódź area, serving all kinds of passenger trains going through the city. There is a maintenance base for a local transit company also located here. There are three platforms available, six tracks in total. Cargo trains are able to avoid the station completely by using an avoiding line.
Koluszki_description=Big junction station, where the line to Łódź branches out of the one connecting Warsaw and Katowice. There are three platforms here, as well as many side tracks useful, when overtaking is needed.
Galkowek_description=(LCS) Small station near Koluszki, serving two lines – a passenger one to Łódź Fabryczna (Line 17) and a freight one via Łódź Olechów cargo station (Line 25). On Line 17 there are two passenger platforms. This signal box also remotely controls the signalling at Łódź Andrzejów station, near to Łódź Widzew.
Zakowice_Description=Small junction on an alternative route from Łódź to Koluszki, used mainly by freight trains. It is remotely controlled from the dispatcher building located at Koluszki.
Wlochy_description=Junction handling passenger trains entering the Warsaw from the west. This is where lines from Katowice, Poznań, and Grodzisk Mazowiecki meet.
Baby_Description=A station located between Piotrków Trybunalski and Koluszki. The station has a siding, a loading yard, and unusually positioned platforms located between the entry and exit signals.
Lask_Description=A railway station with one island platform and one signle-edge platform. A siding to a military unit branches off from the station. The lines towards Pabianice and Gajewniki are equipped with automatic block posts.
Pabianice_Description=A railway station with one island platform and one single-edge platform. The line towards Łask is equipped with an automatic block post.
Rokiciny_Description=A small station located between Piotrków Trybunalski and Koluszki. The station has a loading yard and unusually positioned platforms situated between the entry and exit signals.
Gajewniki_Description=A junction post located near Zduńska Wola. Lines branch off from the post to the Coal Trunk Line, which connects the north and the south.
Kaliska_Description=A large junction station located in the western part of Łódź. It handles train traffic from Kutno, Łowicz, Zduńska Wola, and Łódź Chojny. The station has three platforms and numerous tracks for train operations.
Zabieniec_Description=A medium-sized station located between Zgierz and Łódź Kaliska. The station has two single-edge platforms. Numerous sidings branch off from the station.
Zgierz_Description=A junction station directing traffic from Łowicz and Kutno towards Łódź Widzew and Łódź Kaliska. A PKP Energetyka siding is located at the station.
Lublinek_Description=A station near Łódź Lublinek Airport. The station has two island platforms. Only regional trains stop here.
Retkinia_Description=A junction post directing traffic from Zduńska Wola towards Zgierz or Koluszki. On the line towards Łódź Lublinek, there is the passenger stop Łódź Retkinia.
Chojny_Description=A station in the southern part of Łódź which for a long time did not handle passenger traffic and fell into disrepair. Following the reconstruction of Łódź Fabryczna, the station began serving long-distance and regional traffic. The station has two platforms.
Zdunska_Wola_Description=A large junction station from which lines branch off to the Coal Trunk Line. The station has two platforms and numerous additional tracks used for freight traffic. Regional and selected long-distance trains stop here.
Witonia_Description=A station located on the single-track Zgierz – Kutno line. It also remotely controls the stations of Łęczyca and Ozorków. Both stations have loading yards, while Łęczyca also features a military siding. Each station has passenger platforms for train services.
Zgierz_Polnoc_Description=Remote control workstation located in the Zgierz signal box, supervising three stations on the single-track Zgierz – Kutno line. Zgierz Kontrewers and Zgierz Północ each have 2 tracks and 2 short single-edge platforms. Chociszew has two longer platforms and one additional track.
Glinnik_Description=A double-track passing loop operated locally using relay interlocking. From this station, the dispatcher also remotely controls Stryków station, which has one additional main track and a loading yard.
Glowno_Description=The station underwent modernization in 2015, during which computer-based signalling equipment was installed. Following the modernization, the dispatcher in Głowno also remotely controls Domaniewice station. Domaniewice is used to test a new type of signal with a lowerable signal head.
Lowicz_Przedmiescie_Description=A medium-sized station on the single-track Railway Line No. 15 from Zgierz. In addition to the continuation of Line 15 towards Bednary, the station is connected by two connection lines allowing trains to proceed towards Łowicz Główny or Bednary.
Lowicz_Glowny_Description=A large junction station located on the E20 main line. The CE20 freight corridor branches off here, allowing freight trains to bypass the Warsaw railway junction by running via Skierniewice and then towards Łuków. The station has two island platforms. During the modernization, the former Arkadia and Placencja junction posts were incorporated into the station.
Belchow_Description=The only station located between Skierniewice and Łowicz Główny. The station has one platform and five tracks. It is remotely controlled from Skierniewice. The line towards Skierniewice is equipped with Automatic Block Signalling, which was installed during the modernization.
