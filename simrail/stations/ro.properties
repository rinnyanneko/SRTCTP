

Bedzin_Description=O stație între Dąbrowa Górnicza și gara principală Sosnowiec. Există 6 lini principale, dintre care 3 sunt electrificate. Doar trenurile de calatori opresc aici.
Dabrowa_Gornicza_Description=O stație mică cu două linii și o platformă. Trenurile regionale și inter regionale opresc aici.
Gora_Wlodowska_Description=O halta de miscare, fără peroane, pe ruta feroviară principală. Cele două linii laterale pot fi folosite pentru a opri trenurile care urmează să fie depășite.
Knapwowka_Description=Un nod feroviar pe ruta feroviară principală. O linie ramificată până la stația Czarnca începe aici.
Olszamowice_Description=O mică stație pe ruta feroviară principală, cu două linii laterale.
Pilichowice_Description=Un nod feroviar principal. Aici este posibilă doar schimbarea de la linia stângă la cea dreaptă și înapoi.
Opoczno_Poludnie_Description=O stație pe ruta feroviară principală. Are un peron, unde opresc unele dintre trenurile inter regionale.
Zawiercie_Description=O stație mare cu două peroane și multe linii laterale, unde trenurile de marfă pot fi oprite. Majoritatea trenurilor de călători opresc aici. Aici se termină ruta feroviară principală, iar trenurile din Varșovia continuă pe linii regulate.
Idzikowice_Description=Cea mai mare stație situată pe ruta feroviară principală. Două ramuri se separă aici de linia Tomaszów Mazowiecki – Radom. Aici există o companie de reparații pentru transportul de pasageri, precum și serviciul transportatorului regional. Nu există peroane la această stație.
Slawkow_Description=O stație de dimensiuni medii între Dąbrowa Górnicza Wschodnia și Bukowno. Există patru linii electrificate aici, dintre care două servesc singura platformă a stației. Trenurile regionale opresc aici.
Dorota_Description=Un mic nod feroviar unde se întâlnesc două linii duble și una cu o singură linie.
Kozlow_Description=O stație de dimensiuni medii unde opresc doar trenurile regionale. Există trei peroane aici, dar nu sunt multe trenuri care opresc aici. Trenurile pot pleca de aici spre Koniecpol, Sędziszów, Katowice și Cracovia.
Tunel_Description=O stație mică unde trenurile din Varșovia pot schimba linia atunci când merg la Cracovia sau Sosnowiec. Există un singur peron care este folosit doar de câteva trenuri regionale.
LazyLA_Description=O cutie de semnalizare care păzește intrarea în stația Łazy. Acesta controlează macazele care duc la partea de mărfuri a stației, permițând trenurilor de călători să ia cel mai scurt drum către peroane.
LazyLB_Descritpion=O cutie de semnalizare care controlează zona "B" a unui nod feroviar mare si a unei curți cu cocoașă Łazy.
Szeligi_Description=O mică stație pe ruta CMK, unde o linie ramificată spre Marków se conectează la ruta principală.
Katowice_Description=Cea mai mare stație de joncțiune din capitala Sileziei Superioare. Acesta servește trenurile locale, inter regionale și internaționale. Există cinci peroane aici, deoarece traficul feroviar este semnificativ.
Dabrowa_Gornicza_Zabkowice_Description=O stație de joncțiune în Dąbrowa Górnicza. Există trenuri spre centrul orașului, precum și spre Łazy și Huta Katowice (Katowice Steelworks) de aici. Trei platforme și multe lini laterale sunt disponibile aici.


Katowice_Zawodzie_Description=Doar trenurile de calatori opresc aici. Patru linii duc de aici la Gara Centrală din Katowice, ambele pe linie separată. Există două platforme disponibile.
Sosnowiec_Glowny_Description=Una dintre cele mai importante stații din regiune, care deservește toate trenurile de călători. Cele două linii principale disponibile în uz se întâlnesc aici, fiecare dintre ele având propria platformă.
Lazy_Lc_Description=O cutie de semnalizare care păzește intrarea în stația Łazy. Acesta controlează macazurile care duc la partea de mărfuri a stației, permițând trenurilor de călători să ia cel mai scurt drum către peroane.
Psary_Description=O stație simplă în care o linie secundară se ramifică din ruta feroviară principală și se conectează la linia 64. Există trei lini principale și două laterale, fără platforme.
Wloszczowa_Polnoc_Description=O stație de dimensiuni medii pe ruta feroviară principală cu două peroane. Cele trei linii ale lor deservesc majoritatea trenurilor inter regionale. O linie ramificată spre Żelisławice începe aici.
Dabrowa_Gornicza_Wschodnia_Description=O stație de joncțiune de dimensiuni medii, unde se întâlnesc două linii. Două dintre cele șase linii principale sunt situate lângă peron, unde opresc trenurile de calatori. Majoritatea trenurilor care trec pe aici sunt cele de marfă.
Sosnowiec_Poludniowy_Description=O mică stație de joncțiune, unde singura linie de la Sosnowiec Dańdówka se ramifică la două linii care duc la Sosnowiec Główny - una dintre ele duce în stație, iar cealaltă o ocolește din sud. Există șapte lini aici, dintre care două sunt situate lângă singura platformă. Există, de asemenea, un terminal intermodal de containere lângă gară.
Grodzisk_Mazowiecki_Description=O stație din zona suburbană a Varșoviei, unde opresc trenurile regionale, inter regionale și internaționale. Există două peroane aici, iar trenurile expres pot trece prin stație prin liniile lor separate. Aceasta este prima stație a liniei 4, cunoscută și sub numele de Main Railway Route (CMK).
Korytow_Description=Prima stație a traseului CMK. În afară de două linii principale și două linii suplimentare, există câteva linii laterale și o linie secundară în care agregatul este livrat de trenuri. Nu există un peron pe care trenurile de călători să treacă.
Juliusz_Description=Un post de siding cu un siding la o companie din apropiere și posibilitatea de a schimba de la calea stângă la cea dreaptă și înapoi.
