



Katowice_Zawodzie_Description=Здесь останавливаются только пригородные поезда. Отсюда до главного вокзала в Katowice есть четыре пути, по два на каждой линии. На этой станции есть две доступные платформы.
Sosnowiec_Glowny_Description=Одна из самых важных станций в регионе, обслуживающая все пассажирские поезда. Здесь встречаются две основные линии, доступные в игре, каждая из которых имеет свою собственную платформу.
Bedzin_Description=Станция между Dąbrowa Górnicza и главным вокзалом Sosnowiec. Имеет 6 основных путей, 3 из которых электрифицированы. Здесь останавливаются только пригородные поезда.
Dabrowa_Gornicza_Description=Небольшая станция с двумя путями и платформой. Здесь останавливаются как региональные поезда, так и поезда дальнего следования.
Lazy_Lc_Description=Пост дежурного, располагающийся в начале станции Łazy. Этот пост управляет маршрутами, ведущими в грузовую часть станции, позволяя пассажирским поездам проследовать под платформу кратчайшим путем.
Gora_Wlodowska_Description=Маленькая станция без платформ. Два боковых пути могут быть использованы для остановки поездов, которые должны быть расформированы.
Psary_Description=Простая станция, где от скоростной линии есть ответвление на линию 64. Здесь есть три основных пути и два боковых, без платформ.
Knapwowka_Description=Узел на скоростной линии. Здесь начинается ответвление до станции Czarnca.
Wloszczowa_Polnoc_Description=Станция среднего размера на скоростной линии с двумя платформами. Три пути обслуживают большинство поездов дальнего следования. Здесь начинается ответвление на Żelisławice.
Olszamowice_Description=Маленькая станция на скоростной линии с двумя боковыми путями.
Pilichowice_Description=Узел на скоростной линии. Здесь возможен только переход с одного пути на другой и обратно.
Opoczno_Poludnie_Description=Станция на скоростной линии. Имеет одну платформу, где останавливаются некоторые поезда дальнего следования.
Dabrowa_Gornicza_Wschodnia_Description=Узловая станция среднего размера, где сходятся две линии. Два из шести основных путей имеют платформу, где останавливаются пригородные поезда. Основа трафика станции - грузовые поезда.
Zawiercie_Description=Большая станция с двумя платформами и множеством боковых путей, где могут останавливаться грузовые поезда. Большинство пассажирских поездов останавливаются здесь. Здесь заканчивается скоростная линия, и поезда из Warsaw продолжают движение по обычным путям.
Sosnowiec_Poludniowy_Description=Небольшая узловая станция, где путь из Sosnowiec Dańdówka разветвляется на два пути, ведущих в Sosnowiec Główny - один из них ведет к станции, а другой - в обход ее с юга. Здесь есть семь путей, два из которых расположены у платформы. Рядом со станцией находится интермодальный контейнерный терминал.
Idzikowice_Description=Самая большая станция, расположенная на Главном железнодорожном маршруте. Здесь расходятся две ветки на линию Tomaszów Mazowiecki – Radom. Здеcь находятся предприятие по ремонту пассажирских вагонов и обслуживания составов регионального перевозчика. На этой станции нет платформ.
Slawkow_Description=Станция среднего размера между Dąbrowa Górnicza Wschodnia and Bukowno. Здесь есть четыре электрифицированных пути, два из которых обслуживают единственную платформу станции. Здесь останавливаются региональные поезда.
Dorota_Description=Небольшой разъезд, где сходятся две двухпутные и одна однопутная линии.
Grodzisk_Mazowiecki_Description=Станция в пригороде Warsaw, где останавливаются региональные, междугородние и международные поезда. Здесь есть две платформы, экспрессы могут проезжать станцию по отдельным веткам. Это первая станция линии 4, также известной как Главный железнодорожный маршрут (CMK).
Tunel_Description=Небольшая станция, где поезда из Warsaw могут менять маршруты, направляясь в Kraków или Sosnowiec. Имеется одна платформа, которая используется несколькими региональными поездами.
Kozlow_Description=Станция среднего размера, на которой останавливаются только региональные поезда. Здесь есть три платформы, но останавливается не так много поездов. Отсюда отправляются поезда в Koniecpol, Psary, Sędziszów, Katowice и Kraków.
Korytow_Description=Первая станция на линии СМК. Помимо двух основных и двух дополнительных путей, здесь также есть боковые пути и подъездной путь. Пассажирские поезда на станции не останавливаются.
LazyLB_Descritpion=Сигнальный пост, контролирующий парк „В” грузовой сортировочной станции Łazy.
Juliusz_Description=Вспомогательная станция, обслуживающая близлежащий завод, и позволяющая поездам переходить с одного пути на другой.
LazyLA_Description=Сигнальный пост, расположенный на входе станции Łazy. Он управляет стрелочными переводами, ведущими в грузовую часть станции, позволяя пассажирским поездам добираться до платформ кратчайшим путем.
Szeligi_Description=Небольшая станция на скоростной линии, обслуживает ответвление до станции Marków.
Katowice_Description=Самая большая узловая станция в столице Верхней Силезии. Она обслуживает поезда местного, междугороднего и международного сообщения. Здесь есть пять платформ, так как на ней значительное движение поездов.
Dabrowa_Gornicza_Zabkowice_Description=Узловая станция в Dąbrowa Górnicza. Отсюда отправляются поезда в центр города, а также в Łazy и Huta Katowice (Катовицкий металлургический завод). Здесь доступны три платформы и множество боковых путей.
DGHK_Description=Транспортный узел между Dąbrowa Górnicza Ząbkowice, Dąbrowa Górnicza Południowa и Dąbrowa Górnicza Strzemieszyce, также обслуживающий подъездные пути сталелитейного завода.
Bukowno_Description=Станция между Sławków и Olkusz с главными путями, четыре из которых расположены на одной из двух платформ. Здесь останавливаются только пригородные поезда.
SosnowiecKazimierz_Description=Небольшая узловая станция, соединяющая три однопутные линии: Sosnowiec Dańdówka, Sosnowiec Maczki и Dąbrowa Górnicza Strzemieszyce. На трех платформах останавливаются только пригородные поезда.
Lazy_Description=Сигнальный пост между станциями Łazy ŁA и ŁC, управляющая центральной частью станции, где расположены платформы.
Pruszkow_Description=Станция среднего размера на окраине Варшавы. На единственной платформе станции останавливаются только местные и региональные поезда. На станции есть несколько запасных путей и контейнерный терминал.
