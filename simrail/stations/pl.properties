# Description
Katowice_Zawodzie_Description=Na tej stacji zatrzymują się tylko pociągi osobowe. W stronę głównej stacji w Katowicach odchodzą stąd cztery tory szlakowe na liniach 1 i 138, a każda z tych linii ma do dyspozycji swój peron o dwóch krawędziach.
Sosnowiec_Glowny_Description=Jedna z najważniejszych stacji w województwie, obsługująca także pociągi ekspresowe. Spotykają się tu dostępne w grze linie 1 i 62, każda z nich ma swój peron.
Bedzin_Description=Stacja pomiędzy Dąbrową Górniczą a Sosnowcem Głównym. Posiada 6 torów głównych, z czego tylko trzy są zelektryfikowane. Zatrzymują się tu jedynie pociągi osobowe.
Dabrowa_Gornicza_Description=Niewielka stacja o dwóch torach i jednym peronie. Obsługuje zarówno pociągi osobowe, jak i pospieszne.
Lazy_Lc_Description=Nastawnia obsługująca wjazd do stacji Łazy od strony Dąbrowy Górniczej. Obsługuje rozjazdy kierujące pociągi towarowe na boczne odnogi prowadzące do części towarowej stacji, zostawiając najkrótszą drogę do peronów dla pociągów osobowych.
Gora_Wlodowska_Description=Mała stacyjka na Centralnej Magistrali Kolejowej, na której nie zatrzymują się pociągi pasażerskie. Posiada dwa tory dodatkowe, na których można zatrzymać wyprzedzane pociągi.
Psary_Description=Stacja, na której od Centralnej Magistrali Kolejowej odgałęzia się łącznica do linii Kozłów – Koniecpol. Posiada trzy tory główne zasadnicze i dwa dodatkowe. Na tej stacji nie ma peronów.
Knapwowka_Description=Posterunek odgałęźny na Centralnej Magistrali Kolejowej. Od głównej linii odchodzi tu łącznica do stacji Czarnca.
Wloszczowa_Polnoc_Description=Stacja na Centralnej Magistrali Kolejowej z dwoma peronami. Przy ich trzech torach zatrzymuje się większość pociągów pospiesznych.
Olszamowice_Description=(LCS). Mała stacja na Centralnej Magistrali Kolejowej z dwoma torami dodatkowymi. Steruje się stąd zdalnie małym posterunkiem odgałęźnym Pilichowice.
Pilichowice_Description=Posterunek odgałęźny na szlaku Centralnej Magistrali Kolejowej. W tym miejscu można jedynie przejechać z toru lewego na prawy i odwrotnie.
Opoczno_Poludnie_Description=Stacja na Centralnej Magistrali Kolejowej. Przy jej jedynym peronie zatrzymują się niektóre pociągi dalekobieżne.
Dabrowa_Gornicza_Wschodnia_Description=Stacja węzłowa, gdzie spotykają się linie w czterech kierunkach. Z jej sześciu torów głównych jedynie dwa znajdują się przy peronie, który obsługuje pociągi osobowe. Większość z przejeżdżających tu pociągów to składy towarowe.
Zawiercie_Description=Duża stacja z dwoma peronami i wieloma torami dodatkowymi, gdzie można odstawiać pociągi towarowe. Zatrzymuje się tu większość pociągów pasażerskich. To tutaj kończy się Centralna Magistrala Kolejowa.
Sosnowiec_Poludniowy_Description=Mała stacja węzłowa, na której od jednotorowego szlaku od Sosnowca Dańdówki odchodzą dwa jednotorowe szlaki do stacji Sosnowiec Główny, jeden do samej stacji, a drugi omijający ją od południa. Na stacji jest siedem torów, z czego dwa przy jedynym istniejącym peronie. Znajduje się tu również terminal kontenerowy.
Idzikowice_Description=Największa stacja na Centralnej Magistrali Kolejowej. Od głównej linii odgałęziają się tu dwie łącznice do linii Tomaszów Mazowiecki – Radom. Znajdują się tutaj zakład remontowy wagonów pasażerskich oraz punkt utrzymania taboru przewoźnika regionalnego. Stacja nie obsługuje ruchu pasażerskiego – nie znajdują się tutaj żadne perony.
Slawkow_Description=Średniej wielkości stacja pomiędzy Dąbrową Górniczą Wschodnią a Bukownem. Znajdują się tu cztery zelektryfikowane tory, z czego dwa przy peronie wyspowym. Zatrzymują się tu pociągi regionalne.
Dorota_Description=Posterunek odgałęźny bez peronów, gdzie spotykają się dwie dwutorowe i jedna jednotorowa linia kolejowa.
Grodzisk_Mazowiecki_Description=Stacja w aglomeracji warszawskiej, która obsługuje pociągi lokalne, dalekobieżne i międzynarodowe. Pasażerowie mogą korzystać z trzech krawędzi peronowych przy dwóch peronach. Pociągi ekspresowe omijają perony po osobnych torach. Jest to stacja początkowa linii numer 4, czyli Centralnej Magistrali Kolejowej.
Kozlow_Description=Średniej wielkości stacja o małym znaczeniu. Przy jej trzech peronach zatrzymują się jedynie pociągi osobowe. Można z niej wyjechać w kierunku Koniecpola (CMK), Sędziszowa, Krakowa i Katowic.
Tunel_Description=Mała stacja rozdzielająca ruch pociągów od strony Warszawy do Sosnowca i Krakowa. Przy jej jedynym peronie zatrzymują się tylko pociągi osobowe.
Korytow_Description=Pierwsza stacja na Centralnej Magistrali Kolejowej. Poza dwoma torami głównymi zasadniczymi i dwoma głównymi dodatkowymi, znajdują się tu też tory boczne i bocznica, na którą wjeżdżają pociągi z kruszywem. Na stacji nie zatrzymują się pociągi pasażerskie.
LazyLA_Description=Nastawnia obsługująca wjazd do stacji Łazy od strony Zawiercia. Obsługuje rozjazdy kierujące pociągi towarowe na boczne odnogi prowadzące do części towarowej stacji, oraz kontroluje wjazd pociągów osobowych do części pasażerskiej.
LazyLB_Descritpion=Nastawnia obsługująca okręg „B” stacji dużej stacji węzłowej i rozrządowej Łazy.
Juliusz_Description=Posterunek bocznicowy obsługujący niedaleki zakład, oraz umożliwiający pociągom przejazd z jednego toru na drugi.
Szeligi_Description=Malutka stacja bez peronów na Centralnej Magistrali Kolejowej, obsługująca także łącznicę do stacji Marków.
Katowice_Description=Największa, węzłowa stacja kolejowa w stolicy Górnego Śląska. Obsługuje ruch aglomeracyjny, lokalny i dalekobieżny, pociągi ekspresowe i dalekobieżne. Znajduje się tu pięć peronów i dziewięć krawędzi peronowych, a ruch pociągów jest bardzo duży.
Dabrowa_Gornicza_Zabkowice_Description=Stacja węzłowa w Dąbrowie Górniczej. Odjeżdżają stąd pociągi w stronę Łaz, centrum miasta i Huty Katowice. Znajdują się tu trzy perony i wiele torów dodatkowych, na których mogą stać wyprzedzane pociągi.
DGHK_Description=Posterunek odgałęźny pomiędzy Dąbrową Górniczą Ząbkowicami, Południową i Strzemieszycami obsługujący też bocznicę do huty.
Bukowno_Description=Stacja węzłowa z dziesięcioma torami głównymi z czego cztery położone są przy dwóch peronach położona pomiędzy Sławkowem a Olkuszem. Zatrzymują się tu tylko pociągi osobowe.
SosnowiecKazimierz_Description=Mała stacja węzłowa u zbiegu trzech jednotorowych szlaków ze stacji Sosnowiec Dańdówka, Sosnowiec Maczki i Dąbrowa Górnicza Strzemieszyce. Znajdują sie tutaj trzy jednokrawędziowe perony obsługujące wyłącznie pociągi osobowe.
Lazy_Description=Nastawnia obsługująca środkową część stacji Łazy gdzie znajdują się jedyne perony na tej dużej stacji. Sąsiaduje z nastawniami ŁA i ŁC oraz obsługuje bocznicę do lokomotywowni.
Pruszkow_Description=(LCS). Średniego rozmiaru stacja w aglomeracji warszawskiej, gdzie zatrzymują się jedynie pociągi lokalne i podmiejskie. Posiada jeden peron o dwóch krawędziach, parę bocznic oraz terminal kontenerowy. Z tego miejsca można zdalnie sterować posterunkiem odgałęźnym Józefinów, gdzie rozdzielane są pociągi towarowe i pasażerskie przed wjazdem do węzla warszawskiego.
Strzalki_Description=(LCS). Mała stacja na Centralnej Magistrali Kolejowej z dwoma torami dodatkowymi. Steruje się stąd zdalnie małym posterunkiem odgałęźnym Biała Rawska.
Raciborowice_Description=Posterunek odgałęźny przed Krakowem Batowicami, kierujący część pociągów towarowych do głównej stacji towarowej Kraków Nowa Huta. 
KrakowBatowice_Description=Średnich rozmiarów stacja z sześcioma torami głównymi, po których można prowadzić ruch pociągów – trzy z nich mają także krawędź peronową do obsługi pasażerów wyłącznie pociągów regionalnych.
KrakowPrzedmiescie_Description=Posterunek odgałęźny na wjeździe do Krakowa. Tu rozdziela się ruch pociągów pasażerskich w kierunku Krakowa Głównego i towarowych, które omijają główną stację obsługującą ruch pasażerski.
Miechow_Descrption=Mała stacja z czterema torami głównymi, na których pociągi mogą się wyprzedzać, leżąca pomiędzy stacjami Tunel i Słomniki. Dwa z torów głównych leżą przy krawędzi peronowej, gdzie zatrzymują się niektóre pociągi pospieszne.
Niedzwiedz_Description=Kolejna mała stacja z dwoma torami dodatkowymi służącymi do zatrzymywania wolniejszych pociągów. Tu również znajduje się tylko jeden, dwukrawędziowy peron, przy którym zatrzymują się tylko pociągi osobowe.
Slomniki_Description=Mała stacja z trzema krawędziami peronowymi dla pociągów regionalnych i jednym torem bez peronu, gdzie można odstawić do wyprzedzenia pociąg towarowy. Sąsiednimi posterunkami ruchu są Miechów i Niedźwiedź.
Starzyny_Description=Posterunek odgałęźny strzegący wjazdu na Centralną Magistralę Kolejową od strony Kozłowa. Pociągi stąd kierują się w stronę Warszawy przez CMK, lub w stronę Częstochowy przez Koniecpol. Z tego miejsca można zdalnie sterować posterunkiem odgałęźnym Sprowa.
Zastow_Description=Mała stacja obsługująca tylko ruch regionalny, znajdująca się pomiędzy podg Raciborowice a stacją Niedźwiedź. Znajdują się tu dwa tory główne dodatkowe, gdzie można zatrzymać wolniejszy pociąg, i dwa tory główne zasadnicze, przy których zbudowano wyspowy peron dwukrawędziowy.
Zyrardow_Description=(LCS) Żyrardów to stacja położona pomiędzy Grodziskiem Mazowieckim a Skierniewicami. Znajdują się tu dwa perony, które mogą obsługiwać do trzech pociągów jednocześnie. Znajdująca się tu nastawnia steruje również pobliskim posterunkiem odgałęźnym Radziwiłłów Mazowiecki.
Skierniewice_description=Skierniewice to duża stacja węzłowa, z której odchodzą linie do Warszawy, Łodzi, Łowicza i Łukowa. Poza trzema peronami znajduje się tu wiele torów dodatkowych , które mogą być wykorzystywane do zatrzymywania pociągów na postojach technicznych. Obok stacji znajduje się zabytkowa parowozownia.
Plycwia_description=Płyćwia to niewielka stacja położona pomiędzy Skierniewicami a Rogowem. Znajdują się tu dwa perony, a także dwa tory dodatkowe, które można wykorzystać do wyprzedzania wolniejszych pociągów.
Rogow_description=Rogów to średniej wielkości stacja położona pomiędzy Koluszkami i Skierniewicami. Znajduje się tu pojedynczy peron, położony pomiędzy dwoma torami głównymi, a także dwa tory dodatkowe do wyprzedzania wolniejszych pociągów.
Koluszki_description=Koluszki to duża stacja węzłowa, gdzie linia do Łodzi odgałęzia się od tej łączącej Warszawę z Katowicami. Uzupełnieniem stacji jest zestaw łącznic do posterunków Żakowice Południowe oraz Słotwiny. Znajdują się tu trzy perony, a także wiele torów dodatkowych przydatnych podczas wyprzedzania i postojów pociągów.
Zakowice_Description=Żakowice Południowe to niewielki posterunek odgałęźny na trasie z Łodzi do Tomaszowa Mazowieckiego, wykorzystywany głównie przez pociągi towarowe. Jest zdalnie sterowany z budynku dyspozytora znajdującego się w Koluszkach.
Galkowek_description=(LCS) Gałkówek to niewielka stacja w pobliżu Koluszek, obsługująca dwie linie kolejowe - pasażerską do Łodzi Fabrycznej oraz towarową przez stację towarową Łódź Olechów. Na linii pasażerskiej znajdują się dwa perony. Stacja obsługuje zdalnie posterunek bocznicowy Łódź Andrzejów.
Widzew_Description=Łódź Widzew jest ważną stacją na terenie Łodzi, obsługującą wszystkie rodzaje pociągów pasażerskich przejeżdżających przez miasto. Znajduje się tu również baza serwisowa lokalnego przewoźnika. Pasażerowie mogą tu korzystać z trzech peronów.
Wlochy_description=Posterunek odgałęźny obsługujący pociągi pasażerskie wjeżdżające do węzła warszawskiego od strony zachodniej. Spotykają się tutaj linie z Katowic, Poznania oraz Grodziska Mazowieckiego.
Baby_Description=Stacja położona między Piotrkowem Trybunalskim i Koluszkami. Stacja posiada bocznicę, plac ładunkowy oraz nietypowo położone perony, które znajdują pomiędzy semaforami wjazdowymi i wyjazdowymi.
Lask_Description=Stacja kolejowa z peronem dłukrawędziowym i jednokrawędziowym. Od stacji odchodzi bocznica do jednostki wojskowej. Szlaki do Pabianice i Gajewnik wypasażone są w automatyczne posteruki odstępowe.
Rokiciny_Description=Mała stacja położona między Piotrkowem Trybunalskim i Koluszkami. Stacja posiada plac ładunkowy oraz nietypowo położone perony, które znajdują pomiędzy semaforami wjazdowymi i wyjazdowymi.
Gajewniki_Description=Posterunek odgałężny położony w sąsiedztwie Zduńskiej Woli. Od posterunku odgałęziają się linie do magistrali węglowej, która łączy północ z południem.
Kaliska_Description=Duża stacja węzłowa położona w zachodniej części Łodzi. Obsługuje ruch pociągów z kierunku Kutna, Łowicza, Zduńskiej Woli oraz Łodzi Chojny. Posiada trzy perony oraz liczne tory do obsługi pociągów.
Zabieniec_Description=Średniej wielkości stacja między Zgierzem i Łodzią Kaliską. Stacja posiada 2 perony jednokrawędziowe. Od stacji odchodzą liczne bocznice.
Zgierz_Description=Stacja węzłowa kierująca ruch z Łowicza i Kutna w kierunku Łodzi Widzew i Łodzi Kaliskiej. Na stacji znajduje się bocznica PKP Energetyka.
Lublinek_Description=Stacja w pobliżu portu lotniczego Łódź Lublinek. Stacja posiada dwa perony dwukrawędziowe. Zatrzymują się tu wyłącznie pociągi regionalne.
Retkinia_Description=Posterunek odgałężny kierujący ruch ze Zduńskiej Woli w kierunku Zgierza lub Koluszek. Na szlaku w kierunku Łodzi Lublinek znajduje się przystanek osobowy Łódź Retkinia.
Chojny_Description=Stacja na południu Łodzi, która przez długi czas nie obsługiwała ruchu pasażerskiego i niszczała. Przez przebudowę Łodzi Fabrycznej stacja zaczęła obsługiwać ruch dalekobieżny i regionalny. Stacja posiada dwa perony.
Zdunska_Wola_Description=Duża stacja węzłowa, z której odgałęziają się linie do magistrali węglowej. Znajdują się tu dwa perony oraz liczne tory dodatkowe wykorzystywane w ruchu towarowym. Zatrzymują się tu pociągi regionalne i wybrane dalekobieżne.
Pabianice_Description=Stacja kolejowa z peronem dwukrawędziowym i jednokrawędziowym. Szlak do Łasku wyposażony jest w automatyczny posterunek odstępowy.
Witonia_Description=Stacja znajdująca się na odcinku jednotorowym Zgierz - Kutno. Steruje ona dodatkowo zdalnie Łęczycą oraz Ozorkowem. Te dwie stacje posiadają plac ładunkowy, a z Łęczycy dodatkowo odchodzi bocznica wojskowa. Każda ze stacji posiada perony do obsługi podróżnych.
Zgierz_Polnoc_Description=Stanowisko sterujące zdalnie z nastawni w Zgierzu trzema stacjami na odcinku jednotorowym Zgierz - Kutno. Zgierz Kontrewers oraz Zgierz Północ posiadają 2 tory oraz 2 krótkie perony jednokrawędziowe. Chociszew posiada dwa dłuższe perony oraz jeden tor więcej.
Glinnik_Description=Dwutorowa mijanka obsługiwana lokalnie urządzeniami przekaźnikowymi. Ze stacji dyżurny steruje również zdalnie stacją Stryków, która posiada jeden tor główny więcej oraz plac ładunkowy.
Glowno_Description=Stacja w 2015 roku przeszła modernizację, w której zamontowano urządzenia komputerowe. Po modernizacji z Głowna dyżurny steruje również stacją Domaniewice. W Domaniewicach testowany jest nowy typ sygnalizatora z opuszczaną głowicą.
Lowicz_Przedmiescie_Description=Średniej wielkości stacja na jednotorowej linii kolejowej numer 15 ze Zgierza. Oprócz kontynuacji linii 15 w stronę Bednar do stacji prowadzą dwie łącznice pozwalające pociągom na zjazd w kierunku Łowicza Głównego oraz Bednar.
Lowicz_Glowny_Description=Duża stacja węzłowa położona na magistrali E20. Odgałęzia się tutaj korytarz CE20, który pozwala pominąć węzeł Warszawski pociągom towarowym poprzez jazdę w stronę Skierniewic, a potem do Łukowa. Stacja posiada dwa perony dwukrawędziowe. Przy modernizacji zostały włączone do niej dawne posterunki odgałęźne Arkadia oraz Placencja.
Belchow_Description=Jedyna stacja położona między Skierniewicami i Łowiczem Głównym. Stacja posiada jeden peron i pięć torów. Sterowana jest zdalnie ze Skierniewic. Szlak w kierunku Skierniewic wyposażony jest w Samoczynną Blokadę Liniową, która została zabudowana w trakcie modernizacji.
