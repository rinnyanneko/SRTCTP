

Bedzin_Description=Průjezdní stanice mezi městy Dąbrowa Górnicza a Sosnowiec Główny. Má 6 hlavních kolejí, z nichž pouze tři jsou elektrifikované. Zastavují zde pouze osobní vlaky.
Dabrowa_Gornicza_Description=Malá stanice se dvěma kolejemi a jedním nástupištěm. Zastavují zde osobní i rychlíkové vlaky.
Lazy_Lc_Description=Výhybna obsluhující vjezd do stanice Łazy ze směru od Dąbrowy Górniczej. Obsluhuje výhybky, které směřují nákladní vlaky na boční koleje vedoucí do nákladní části stanice a ponechávají nejkratší cestu k nástupištím pro osobní vlaky.
Psary_Description=Výhybna, kde z hlavní železniční tratě CMK je odbočka na trať 64 - Kozłów - Koniecpol. Má tři hlavní a dvě vedlejší koleje. Na této výhybně nejsou žádná nástupiště.
Knapwowka_Description=Výhybna na hlavní železniční trati CMK. Z hlavní trati se zde odpojuje navazující trať do stanice Czarnca.
Wloszczowa_Polnoc_Description=Středně velká stanice na hlavní železniční trati CMK se dvěma nástupišti. Tři koleje slouží většině dálkových vlaků. Nachází se zde odbočka do Żelisławic.
Olszamowice_Description=(LCS). Malá výhybna na hlavní železniční trati CMK se dvěma vedlejšími kolejemi. Dálkově je odtud řízena malá výhybna Pilichowice.


Katowice_Zawodzie_Description=Na této stanici zastavují pouze osobní vlaky. Odtud směřují čtyři koleje tratí 1 a 138 na hlavní nádraží v Katovicích a každá trať má vlastní dvě nástupiště.
Sosnowiec_Glowny_Description=Jedna z nejdůležitějších stanic v této oblasti, kde zastavují všechny vlaky. Zde se spojují dvě hlavní tratě 1 a 62, které jsou ve hře k dispozici, každá s vlastním nástupištěm.
Gora_Wlodowska_Description=Malá výhybna bez nástupišť na hlavní železniční trati CMK. Dvě postranní koleje lze použít k zastavení vlaků, které mají být předjížděny.
Pilichowice_Description=Výhybna na hlavní železniční trati CMK. V tomto místě je možné přejet pouze z levé koleje na pravou a naopak.
Opoczno_Poludnie_Description=Stanice na hlavní železniční trati CMK. Má jedno nástupiště, kde zastavují některé dálkové vlaky.
Dabrowa_Gornicza_Wschodnia_Description=Uzlová stanice, kde se setkávají tratě čtyř směrů. Dvě ze šesti hlavních kolejí mají nástupiště, kde zastavují příměstské vlaky. Většina vlaků, které tudy projíždějí, jsou nákladní.
Zawiercie_Description=Velké nádraží se dvěma nástupišti a mnoha vedlejšími kolejemi, kde mohou zastavovat nákladní vlaky. Zastavuje zde většina osobních vlaků. Zde končí hlavní železniční trať CMK a vlaky z Varšavy pokračují po běžné trati.
Sosnowiec_Poludniowy_Description=Malá uzlová výhybna, kde z jednokolejné trasy ze Sosnowce Dańdówky do stanice Sosnowiec Główny odbočují dvě jednokolejné koleje, jedna do samotné stanice a druhá ji objíždí z jihu. Ve stanici je sedm kolejí, z nichž dvě jsou na jediném stávajícím nástupišti. Nachází se zde také kontejnerový terminál.
Idzikowice_Description=Největší výhybna na centrální železniční trati CMK. Z hlavní trati zde odbočují dvě odbočky na trať Tomaszów Mazowiecki - Radom. Ve stanici se nachází opravna osobních vozů a místo údržby kolejových vozidel regionálního železničního dopravce. Stanice neslouží osobní dopravě - nejsou zde žádná nástupiště.
Slawkow_Description=Středně velká stanice mezi Dąbrowou Górniczou a Bukownem. Jsou zde čtyři elektrifikované koleje, z toho dvě na ostrovním nástupišti. Zastavují zde regionální vlaky.
Dorota_Description=Výhybna bez nástupišť, kde se setkávají dvě dvoukolejné a jedna jednokolejná železniční trať.
Grodzisk_Mazowiecki_Description=Stanice ve Varšavské aglomeraci, která obsluhuje místní, dálkové a mezinárodní vlaky. Cestující mohou využít tři perony na dvou nástupištích. Expresní vlaky objíždějí nástupiště po samostatných kolejích. Jedná se o výchozí stanici tratě číslo 4, hlavní železniční tratě CMK.
Kozlow_Description=Středně velká stanice menšího významu. Zastavují zde pouze osobní vlaky a stanice obsahuje tři nástupiště. Ze stanice lze odjet směrem na Koniecpol (CMK), Sędziszów, Krakov a Katovice.
Tunel_Description=Malá stanice spojující vlakovou dopravu z Varšavy do Sosnovce a Krakova. Na jediném nástupišti této stanice zastavují pouze osobní vlaky.
Korytow_Description=První výhybna na hlavní železniční trati CMK. Kromě dvou hlavních kolejí a dvou hlavních vedlejších kolejí jsou zde také vedlejší koleje a vlečka, kterou obsluhují dieselové lokomotivy. V této výhybně nezastavují žádné osobní vlaky.
LazyLA_Description=Výhybna slouží k vjezdu do stanice Łazy ze strany od Zawiercie. Obsluhuje výhybky, kterými se řídí vjezd nákladních vlaků na boční koleje vedoucí do nákladní části stanice, a řídí také příjezdy osobních vlaků do osobní části stanice.
LazyLB_Descritpion=Stavědlo obsluhující obvod "B" železničního uzlu Lazy a seřaďovacího nádraží.
Juliusz_Description=Vlečková výhybna, která slouží nedalekému podniku a umožňuje vlakům přejíždět z jedné koleje na druhou.
Szeligi_Description=Malá výhybna na hlavní železniční trati CMK, kde se nachází odbočka do Markówa.
Katowice_Description=Největší železniční stanice v hlavním městě horního Slezska. Slouží aglomerační, místní, dálkové dopravě, rychlíkům a dálkovým vlakům. Má pět nástupišť a devět nástupištních hran, přičemž je zde velmi hustý vlakový provoz.
Dabrowa_Gornicza_Zabkowice_Description=Uzlová stanice v Dąbrowa Górnicza. Odjíždějí odtud vlaky směrem na Łazy, do centra města a do katovických oceláren. Jsou zde tři nástupiště a mnoho vedlejších kolejí, kde mohou stát předjížděné vlaky.
DGHK_Description=Odbočná stanice mezi Dąbrowou Górniczou Ząbkowice a jižní částí Strzemieszyc, která slouží jako vlečka do oceláren.
Lazy_Description=Dopravna obsluhuje centrální část stanice Łazy, kde se nacházejí pouze nástupiště v této velké stanici. Sousedí se stavědly Ła a Łc a obsluhuje vlečku do lokomotivního depa.
Bukowno_Description=Uzlová stanice s deseti hlavními kolejemi, z nichž čtyři jsou umístěny na dvou nástupištích, nacházející se mezi městy Sławków a Olkusz. Zastavují zde pouze osobní vlaky.
SosnowiecKazimierz_Description=Malá přestupní stanice se nachází na křížení tří jednokolejných tratí ze stanic Sosnowiec Dańdówka, Sosnowiec Maczki a Dąbrowa Górnicza Strzemieszyce. Jsou zde tři jednokolejná nástupiště, která slouží pouze osobním vlakům.
Pruszkow_Description=(LCS). Středně velká stanice ve varšavské aglomeraci, kde zastavují pouze osobní a příměstské vlaky. Má jedno dvojité nástupiště, dvojici vleček a kontejnerový terminál. Dálkově lze odtud ovládat odbočnou stanici Józefinów, kde se nákladní a osobní vlaky oddělují před vjezdem do varšavského uzlu.
Strzalki_Description=(LCS). Malá stanice na hlavní železniční trati CMK se dvěma vedlejšími kolejemi. Dálkově je odtud řízena malá výhybna Biała Rawska.
KrakowPrzedmiescie_Description=Malá výhybna obsluhující vjezd do Krakova. Zde se nákladní vlaky oddělují od osobních vlaků, které směřují na hlavní stanici ve městě.
Niedzwiedz_Description=Niedźwiedź (polsky "Medvěd") je další malou stanicí s 2 kolejemi navíc pro zastavení pomalých vlaků, a 2 hlavními kolejemi s nástupištěm sloužícím pro příměstské vlaky.
Slomniki_Description=Malá stanice mezi Miechów a Niedźwiedź, kde zastavují pouze příměstské vlaky. Nachází se zde 4 koleje, z toho 3 mohou být využity pro zastavení osobních vlaků.
Raciborowice_Description=Výhybna oddělující dopravu do a z nákladní stanice Kraków Nowa Huta a Kraków Batowice. 
KrakowBatowice_Description=Středně velká stanice s 6 hlavními kolejemi, z toho 3 z nich mají nástupiště pro regionální osobní vlaky.
Miechow_Descrption=Malá stanice se 4 hlavními kolejemi, které mohou být využity pro předjíždění pomalejších vlaků. Nachází se mezi stanicemi Tunel a Słomniki. 3 staniční koleje se nacházejí u nástupiště, kde zastavují příměstské, a některé pomalejší dálkové vlaky.
Starzyny_Description=(LCS). Výhybna dohlížející na vjezd vlaků na Hlavní Železniční Trať přijíždějících ze stanice Kozłów. Zde vlaky pokračují ve své jízdě do Varšavy přes Hlavní Železniční Trať, nebo směřují na západ do města Częstochowa přes stanici Koniecpol. Z tohoto místa vzdáleně ovládáš malou blízkou dopravnu Sprowa.
Zastow_Description=Malá stanice nacházející se mezi výhybnou Raciborowice a stanicí Niedźwiedź. Jsou zde dvě vedlejší koleje, kde lze zastavit pomalejší vlaky, který je potřeba předjet, a dvě hlavní koleje s nástupištěm, u kterého zastavují pouze příměstské vlaky.
Zyrardow_Description=(LCS) Stanice mezi Grodzisk Mazowiecki a Skierniewice. K dispozici jsou zde 2 nástupiště, které dokážou obsloužit až 3 vlaky současně. Výpravčí z této stanice ovládá i nedalekou dopravnu Radziwiłłów Mazowiecki.
Plycwia_description=Malá stanice umístěna mezi Skierniewice a Rogów. K dispozici jsou 2 nástupiště, a též i 2 vedlejší koleje, které mohou být využity pro předjíždění pomalejších vlaků.
Skierniewice_description=Velká přestupní stanice, z které vedou tratě do Varšavy, Łódź a Łowicz. Mimo 3 nástupiště je zde spousta odstavných kolejí, které mohou být využity pro zastavení vlaků. Vedle staniční budovy je umístěno historické depo parních lokomotiv.
Rogow_description=Středně velká stanice, která se nachází mezi stanicemi Koluszki a Płyćwia. Nachází se zde jediné nástupiště, které je umístěno uprostřed dvou hlavních kolejí a čtyřmi dalšími vedlejšími kolejemi, které lze v případě potřeby využít pro předjíždění.
Koluszki_description=Obrovská uzlová stanice, kde z trati spojující Katovice a Varšavu odbočuje i trať do Łódź. K dispozici jsou 3 nástupiště, a také spoustu užitečných vedlejších kolejí, které lze využít pro předjíždění.
Galkowek_description=(LCS) Malá stanice poblíž Koluszki, obsluhuje dvě tratě - trať pro osobní dopravu do Łódź Fabryczna (trať 17), a nákladní dopravu do nákladního nádraží Łódź Olechów (trať 25). Na trati 17 jsou k dispozici 2 nástupiště pro osobní vlaky. Výpravčí z této stanice vzdáleně ovládá i stanici Łódź Andrzejów, která se nachází vedle Łódź Widzew.
Widzew_Description=Důležitá stanice ve městě Łódź, která obsluhuje všechny druhy osobních vlaků projíždějících městem. Vedle stanice se nachází hala údržby místního dopravce. K dispozici jsou zde 3 nástupiště se 6 kolejemi. Nákladní vlaky se mohou stanici zcela vyhnout jízdou po ostatních kolejích.
Zakowice_Description=Malá dopravna nacházející se na alternativní trati mezi Łódź a Koluszki. Primárně ji využívají nákladní vlaky. Je vzdáleně ovládaná z výpravní budovy v Koluszki.
Wlochy_description=Stanice je křižovatkou několika tratí, která odbavuje osobní vlaky přijíždějící do Varšavy ze západu. Setkávají se zde tratě z Katowice, Poznań a Grodzisk Mazowiecki.
Zabieniec_Description=Středně velká stanice mezi Zgierzem a Łodzią Kaliska. Stanice má 2 jednostranné nástupiště. Ze stanice vede řada vleček.
Baby_Description=Stanice se nachází mezi Piotrków Trybunalski a Koluszki. Stanice má vlečku, nákladní nádraží a neobvykle umístěné nástupiště, které se nacházejí mezi vjezdovými a odjezdovými návěstidly.
Rokiciny_Description=Malá stanice mezi Piotrków Trybunalski a Koluszki. Stanice má nákladní nádraží a neobvykle umístěné nástupiště, které se nacházejí mezi vjezdovými a odjezdovými semafory.
Pabianice_Description=Železniční stanice s dvojitým a jednostranným nástupištěm. Trať směrem na Łask je vybavena automatickým blokovacím zařízením.
Gajewniki_Description=Dopravna se nachází v blízkosti Zuńskiej Woli. Od této dopravny se větví tratě k uhelné magistrále, spojující sever s jihem.
Kaliska_Description=Velká uzlová stanice v západní části Łodzi. Obsluhuje vlaky směřující z Kutna, Łowicza, Zuńskiej Woli a Łodzi Chojny. Stanice má tři nástupiště a řadu kolejí pro obsluhu vlaků.
Lask_Description=Železniční stanice s jedním ostrovním nástupištěm a jedním okrajovým nástupištěm. Od stanice odbočuje vlečka k jednotce armády. Trať směrem na Pabianice a Gajewniki je vybavena automatickými blokovacími zařízeními.
Zgierz_Description=Uzlová stanice, která řídí provoz z Łowicza a Kutna směrem na Łódź Widzew a Łódź Kliski. Ve stanici se nachází vlečka PKP Energetyka.
Lublinek_Description=Stanice v blízkosti letiště Łódź Lublinek. Stanice má dvě dvoustranné nástupiště. Zastavují zde pouze regionální vlaky.
Retkinia_Description=Výhybna, která řídí provoz ze Zduńska Wola směrem na Zgierz nebo Koluszki. Na trati směrem na Łódź Lublinek se nachází zastávka Łódź Retkinia.
Chojny_Description=Stanice na jihu Łodzi, která dlouhou dobu nesloužila pro osobní dopravu a chátrala. Po rekonstrukci stanice Łódź Fabryczna začala stanice obsluhovat dálkovou a regionální dopravu. Stanice má dvě nástupiště.
Zdunska_Wola_Description=Velká uzlová stanice, ze které se odbočují tratě na uhelnou magistrálu. Nacházejí se zde dvě nástupiště a mnoho dalších kolejí využívaných pro nákladní dopravu. Zastavují zde regionální vlaky a vybrané dálkové spoje.
Witonia_Description=Stanice se nachází na jednokolejné trati Zgierz – Kutno. Také vzdáleně ovládá stanice Łęczyca a Ozorków. Obě stanice mají perony pro nakládku, mezitím co Łęczyca má i odstavné koleje pro armádu. Každá stanice má nástupiště pro vlaky osobní dopravy.
Zgierz_Polnoc_Description=Dálkově řízená stanice pro výpravčí lokalizována v budově ve Zgierz. Dohlíží na 3 stanice na jednokolejné trati Zgierz – Kutno. Stanice Zgierz Kontrewers a Zgierz Północ mají 2 koleje s 2 krátkými nástupištěmi. Chociszew má 2 dlouhé nástupiště a i jednu odstavnou kolej.
Glinnik_Description=Dvoukolejná výhybna, která je řízena reléovým zabezpečovacím zařízením přímo na místě. Z této stanice výpravčí také dálkově ovládá stanici Stryków, která disponuje jednou hlavní kolejí a nakládacím nádražím.
Glowno_Description=Stanice prošla modernizací v 2015, během které bylo nainstalováno řízení přes počítač. V rámci modernizace výpravčí také vzdáleně řídí stanici Domaniewice. Ve stanici Domaniewice slouží k testování nového typu návěstidla se spouštěcí hlavou návěstidla.
Lowicz_Przedmiescie_Description=Středně velká stanice na jednokolejné trati č. 15 ze Zgierz. Stanice je navíc napojena na dvě další tratě, které umožňují vlakům pokračovat do stanic Łowicz Główny nebo Bednary.
Lowicz_Glowny_Description=Rozsáhlá železniční křižovatka tratí na hlavní trati E20. Zde se odklání nákladní koridor CE20, který jim umožňuje objet Varšavu přes Skierniewice a poté přes stanici Łuków. Stanice má dvě ostrovní nástupiště. V průběhu modernizace byla ukončena činnost výpravčích v dopravnách Arkadia a Placencja, které byly začleněny do stanice.
Belchow_Description=Jediná stanice, která se nachází mezi Skierniewice a Łowicz Główny. Stanice má pět kolejí s jedním nástupištěm. Je vzdáleně ovládá ze stanice Skierniewice. Trať do Skierniewice je osazena autoblokem, který byl instalován v rámci modernizace tratě.
