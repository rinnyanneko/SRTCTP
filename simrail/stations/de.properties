



Katowice_Zawodzie_Description=Ein Nachbarbahnhof von Kattowitz Hauptbahnhof, wo an zwei Bahnsteigen Nahverkehrszüge halten. Dieser Bahnhof mündet mit vier Streckengleisen in den Kattowitzer Hauptbahnhof.
Bedzin_Description=Ein Bahnhof zwischen Dąbrowa Górnicza und Sosnowiec Główny. Der Bahnhof besitzt sechs Gleise, nur 3 davon sind elektrifiziert. Nur Nahverkehrszüge halten hier.
Lazy_Lc_Description=Ein Bahnhof am Ortseingang von Łazy. Hier treffen sich drei Strecken; das Stellwerk besitzt viele stillgelegte Gleise zum Abstellen und Bedienen von Güterzügen.
Gora_Wlodowska_Description=Ein kleiner Bahnhof, welcher zum Überholen von Zügen dient.
Dabrowa_Gornicza_Description=Ein kleiner Bahnhof in der Stadtmitte mit zwei Gleisen und einem Bahnsteig. Nahverkehrszüge und Fernverkehrszüge halten hier.
Knapwowka_Description=Eine kleine Abzweigstelle auf der Centralna Magistrala Kolejowa (CMK), wo die Züge Richtung Czarnca abzweigen können.
Wloszczowa_Polnoc_Description=Ein mittelgroßer Bahnhof auf der Centralna Magistrala Kolejowa (CMK) mit fünf Gleisen und zwei Bahnsteigen. Nahverkehrszüge und Schnellzüge halten hier, einige Züge zweigen auf die Strecke nach Żelisławice ab.
Olszamowice_Description=(LCS) Ein kleines Stellwerk auf der Centralna Magistrala Kolejowa (CMK) mit zwei Seitengleisen. Von hier steuerst du auch eine kleine Überleitstelle in der Nähe namens Pilichowice.
Pilichowice_Description=Eine Überleitstelle auf der Centralna Magistrala Kolejowa (CMK), auf der die Züge das Streckengleis wechseln können.
Sosnowiec_Glowny_Description=Einer der wichtigsten Bahnhöfe in der Region. Nahverkehrszüge sowie Schnellzüge halten hier. Außerdem treffen sich hier die zwei im Spiel verfügbaren Eisenbahnstrecken, wovon jede einen eigenen Bahnsteig hat.
Psary_Description=Ein mittelgroßer Bahnhof auf der Centralna Magistrala Kolejowa (CMK), bei dem die Strecken aus Katowice und Kraków in Richtung Warschau zusammentreffen. Hier gibt es drei Hauptgleise und zwei Ausweichgleise, jedoch besitzt Psary keine Bahnsteige.
Opoczno_Poludnie_Description=Ein kleiner Bahnhof auf der Centralna Magistrala Kolejowa (CMK). Er hat einen Bahnsteig, wo manche Fernverkehrszüge halten.
Dabrowa_Gornicza_Wschodnia_Description=Ein mittelgroßer Bahnhof, in dem sich zwei Bahnstrecken treffen. Obwohl hier meistens Güterzüge durchfahren, halten Nahverkehrszüge an einem Mittelbahnsteig, welcher sich an zwei von insgesamt sechs Hauptgleisen befindet.
Zawiercie_Description=Ein großer Bahnhof mit vielen Ausweichgleisen, wo Güterzüge zur Überholung von Reisezügen angehalten werden können. Er besitzt insgesamt zwei Bahnsteige, wo fast alle Reisezüge planmäßig halten.
Sosnowiec_Poludniowy_Description=Kleiner Bahnhof, an dem sich die eingleisige Strecke von Sosnowiec Dańdówka in zwei Gleise nach Sosnowiec Główny verzweigt - eines führt in den Bahnhof, das andere umfährt ihn von Süden. Hier gibt es drei Gleise, von denen zwei an einen Bahnsteig angeschlossen sind. Neben dem Bahnhof befindet sich ein Containerterminal für den Güterverkehr.
Idzikowice_Description=Der größte Bahnhof auf der Schnellfahrstrecke. Hier trennen sich zwei Zweige der Strecke Tomaszów Mazowiecki - Radom. Hier gibt es eine Reparaturwerkstatt für Reisezugwagen. Der Bahnhof hat keine Bahnsteige.
Slawkow_Description=Ein mittelgroßer Bahnhof zwischen Dąbrowa Górnicza Wschodnia und Bukowno. Er verfügt über vier elektrifizierte Gleise, von denen zwei an den einzigen Bahnsteig des Bahnhofs angeschlossen sind. Hier halten ausschließlich Regionalzüge.
Dorota_Description=Eine mittelgroße Abzweigstelle, an der sich zwei zweigleisige Strecken und eine eingleisige Strecke kreuzen.
Grodzisk_Mazowiecki_Description=Ein Bahnhof am Rande Warschaus, an dem Regional- und Fernzüge halten. Es gibt zwei Bahnsteige, wo Schnellzüge durchfahren können. Er ist der erste Bahnhof der Linie 4, die auch als Schnellfahrstrecke bekannt ist.
Kozlow_Description=Ein mittelgroßer Bahnhof, an dem Regional- und Fernzüge halten. Es gibt drei Bahnsteige, aber nicht jeder Zug hält dort. Von hier aus fahren Züge nach Koniecpol, Psary, Sędziszów, Katowice oder Kraków.
Tunel_Description=Ein kleiner Bahnhof, an dem die Fahrgäste aus Warschau in Richtung Krakau oder Katowice umsteigen können. Es gibt nur einen Bahnsteig, der nur von einigen Regionalzügen bedient wird.
Korytow_Description=Der erste Bahnhof an der Schnellfahrstrecke. Neben zwei Hauptgleisen gibt es ein paar Nebengleise und ein Anschlussgleis, auf dem die Züge mit Material beliefert werden können. Es gibt keinen Bahnsteig, an dem Personenzüge halten könnten.
LazyLA_Description=Ein Stellwerk, das den Eingang zum Bahnhof Łazy bewacht. Es steuert die Weichen, die zum Güterbereich des Bahnhofs führen, damit die Personenzüge den kürzesten Weg zu den Bahnsteigen nehmen können.
LazyLB_Descritpion=Ein Stellwerk, welches den umfangreichen Personenbahnhof und die Zufahrt zum Güterbahnhof von Łazy steuert.
Juliusz_Description=Eine kleine Überleitstelle mit einem Anschlussgleis zu einer nahegelegenen Firma und einer Möglichkeit, vom linken auf das rechte Gleis und zurück zu wechseln.
Szeligi_Description=Ein kleiner Bahnhof an der Schnellfahrstrecke, an dem eine Abzweigung nach Marków an die Hauptstrecke anschließt.
Katowice_Description=Der größte Hauptbahnhof in der Hauptstadt von Oberschlesien. Er bedient den Nah-, Fern- und Internationalen Zugverkehr. Hier gibt es fünf Bahnsteige, da das Zugaufkommen sehr hoch ist.
Dabrowa_Gornicza_Zabkowice_Description=Ein Umsteigebahnhof in Dąbrowa Górnicza. Von hier aus verkehren Züge ins Stadtzentrum sowie nach Łazy und Huta Katowice (Katowice Stahlwerk). Hier gibt es drei Bahnsteige und viele Nebengleise.
SosnowiecKazimierz_Description=Ein mittelgroßer Kreuzungsbahnhof, welcher die drei eingleisigen Strecken von Sosnowiec Dańdówka, Sosnowiec Maczki und Dąbrowa Górnicza Strzemieszyce verbindet. Es gibt drei Bahnsteige, an denen Personenzüge halten können.
DGHK_Description=Eine kleine Abzweigstelle zwischen Dąbrowa Górnicza Ząbkowice, Dąbrowa Górnicza Południowa und Dąbrowa Górnicza Strzemieszyce, die auch ein Anschlussgleis eines Stahlwerks bedient.
Bukowno_Description=Ein großer Bahnhof zwischen Sławków und Olkusz mit zehn Hauptgleisen, vier davon besitzen Bahnsteige. Hier halten nur Regionalzüge.
Lazy_Description=Ein Stellwerk zwischen Łazy Ła und Łc, welches den zentralen Teil des großen Bahnhofs Łazy steuert, an dem sich auch die Bahnsteige befinden.
Pruszkow_Description=(LCS) Ein mittelgroßer Bahnhof im Randgebiet von Warschau. Hier befindet sich ein Bahnsteig, an dem nur Regionalzüge halten, außerdem gibt es ein paar Ausweichgleise und ein Containerterminal. Von hier aus steuert man auch die Abzweigstelle Józefinów, wo sich Güterzüge und Personenzüge trennen.
Strzalki_Description=(LCS) Ein kleiner Bahnhof auf der Centralna Magistrala Kolejowa (CMK) mit zwei Seitengleisen. Von hier steuert man eine kleine Überleitstelle in der Nähe, Biała Rawska.
KrakowPrzedmiescie_Description=Eine kleine Abzweigstelle am Ortseingang von Kraków. Güterzüge werden hier von Reisezügen getrennt, welche zum Hauptbahnhof von Kraków fahren.
Slomniki_Description=Ein kleiner Bahnhof zwischen Miechów und Niedźwiedź, wo nur Nahverkehrszüge halten. Es gibt vier Gleise, drei davon haben einen Bahnsteig.
Raciborowice_Description=Eine Abzweigstelle, welche den Verkehr vom und zum Güterbahnhof Kraków Nowa Huta vom Verkehr nach Kraków Batowice separiert. 
KrakowBatowice_Description=Ein mittelgroßer Bahnhof mit sechs Hauptgleisen, 3 Gleise davon haben einen Bahnsteig, an dem Nahverkehrszüge halten.
Miechow_Descrption=Ein kleiner Bahnhof mit vier Gleisen, welcher als Überholbahnhof dient. Er liegt zwischen Tunel und Słomniki. Zwei der Bahnhofsgleise haben einen Bahnsteig, wo Nahverkehrszüge und einige Fernzüge halten.
Starzyny_Description=(LCS) Eine Abzweigstelle am Eingang zur CMK aus Kozłów kommend. Die Züge können ihre Reise hier nach Warschau über die CMK fortsetzen, alternativ fahren sie weiter nach Westen nach Częstochowa über Koniecpol. Von hier steuert man die kleine Überleitstelle Sprowa fern.
Zastow_Description=Ein kleiner Bahnhof zwischen Raciborowice und Niedźwiedź. Es gibt zwei Ausweichgleise, wo ein langsamerer Zug durch einen schnelleren Zug überholt werden kann. Zwei der Hauptgleise haben einen Bahnsteig, an dem planmäßig nur Nahverkehrszüge halten.
Niedzwiedz_Description=Niedźwiedź (polnisch "Bär") ist ein weiterer kleiner Bahnhof mit zwei Ausweichngleisen, um langsamere Züge überholen zu lassen. An den Durchgangsgleisen befindet sich ein Bahnsteig, der von Nahverkehrszügen bedient wird.
Plycwia_description=Kleiner Bahnhof zwischen Skierniewice und Rogów. Es gibt zwei Bahnsteiggleise sowie zwei Seitengleise, welche für Überholungen genutzt werden können.
Rogow_description=Mittelgroßer Bahnhof zwischen Koluszki und Płyćwia. Es gibt einen Mittelbahnsteig zwischen den beiden durchgehenden Hauptgleisen sowie zwei Seitengleise, welche für Überholungen genutzt werden können.
Koluszki_description=Großer Abzweigbahnhof, an dem sich die Strecken nach Łódź, Warszawa und Katowice aufteilen. Es gibt drei Bahnsteige mit sechs Bahnsteiggleisen sowie viele Seitengleise, um Züge überholen zu lassen.
Galkowek_description=(LCS) Mittelgroßer Bahnhof neben Koluszki, bei dem man zwei Bahnstrecken steuert - eine Fernbahnstrecke nach Łódź Fabryczna sowie eine Güterstrecke in Richtung Łódź Olechów. Auf der Fernbahnstrecke gibt es zwei Bahnsteige. In diesem Stellwerk steuert man auch das benachbarte kleine Łódź Andrzejów fern.
Zakowice_Description=Kleine Abzweigstelle auf einem alternativen Weg von Łódź nach Koluszki, welche hauptsächlich von Güterzügen genutzt wird. Der Fahrdienstleiter sitzt im Stellwerksgebäude Koluszki.
Zyrardow_Description=(LCS) Ein Bahnhof zwischen Grodzisk Mazowiecki und Skierniewice. Hier gibt es zwei Bahnsteige, an welchen drei Züge gleichzeitig halten können. Das Stellwerk hier steuert auch das benachbarte Radziwiłłów Mazowiecki fern.
Skierniewice_description=Ein großer Abzweigbahnhof, an dem die Strecken nach Warschau, Łódź, Łowicz und Łukòw zusammenführen. Außer der drei Bahnsteige gibt es viele Seitengleise, an denen Züge für Aufenthalte angehalten werden können. Neben dem Bahnhof befindet sich ein historisches Dampflokdepot.
Widzew_Description=Wichtiger Bahnhof in Łódź, bei dem man sogut wie alle Personenzüge bedient, welche durch die Stadt führen. Hier befindet sich auch ein Betriebswerk für das lokale Verkehrsunternehmen. Die Fahrgäste können drei Bahnsteige mit sechs Bahnsteiggleisen nutzen, ein selten durchfahrendee Güterzug würde ein Gleis ohne Bahnsteig nutzen.
Wlochy_description=Knotenbahnhof für Personenzüge, die von Westen kommend in Warschau einfahren. Hier treffen sich die Linien aus Katowice, Poznań und Grodzisk Mazowiecki.
Baby_Description=Ein Bahnhof zwischen Piotrków Trybunalski und Koluszki. Der Bahnhof verfügt über ein Anschlussgleis, einen Ladehof sowie ungewöhnlich angeordnete Bahnsteige, die sich zwischen den Ein- und Ausfahrsignalen befinden.
Rokiciny_Description=Ein kleiner Bahnhof zwischen Piotrków Trybunalski und Koluszki. Der Bahnhof verfügt über einen Ladehof sowie ungewöhnlich angeordnete Bahnsteige, die sich zwischen den Ein- und Ausfahrsignalen befinden.
Gajewniki_Description=Eine Abzweigstelle in der Nähe von Zduńska Wola. Von dort zweigen Strecken zur Kohlenmagistrale ab, die den Norden und den Süden miteinander verbindet.
Lask_Description=Ein Bahnhof mit einem Mittelbahnsteig und einem Seitenbahnsteig. Vom Bahnhof zweigt ein Anschlussgleis zu einer Militäreinheit ab. Die Strecken in Richtung Pabianice und Gajewniki sind mit automatischen Streckenblockstellen ausgerüstet.
Zabieniec_Description=Ein mittelgroßer Bahnhof zwischen Zgierz und Łódź Kaliska. Der Bahnhof verfügt über zwei Seitenbahnsteige. Zahlreiche Nebengleise zweigen vom Bahnhof ab.
Zgierz_Description=Ein Abzweigbahnhof, der den Verkehr aus Richtung Łowicz und Kutno nach Łódź Widzew und Łódź Kaliska lenkt. Am Bahnhof befindet sich ein Anschlussgleis der PKP Energetyka.
Lublinek_Description=Ein Bahnhof in der Nähe des Flughafens Łódź Lublinek. Der Bahnhof verfügt über zwei Mittelbahnsteige. Hier halten ausschließlich Regionalzüge.
Retkinia_Description=Ein Abzweigstelle, der den Verkehr von Zduńska Wola in Richtung Zgierz oder Koluszki leitet. Auf der Strecke nach Łódź Lublinek befindet sich der Haltepunkt Łódź Retkinia.
Zdunska_Wola_Description=Ein großer Knotenbahnhof, von dem Strecken zur Kohlenmagistrale abzweigen. Der Bahnhof verfügt über zwei Bahnsteige sowie zahlreiche zusätzliche Gleise für den Güterverkehr. Hier halten Regionalzüge sowie ausgewählte Fernzüge.
Chojny_Description=Ein Bahnhof im südlichen Teil von Łódź, der lange Zeit keinen Personenverkehr abfertigte und zunehmend verfiel. Nach dem Umbau von Łódź Fabryczna nahm der Bahnhof wieder den Fern- und Regionalverkehr auf. Der Bahnhof verfügt über zwei Bahnsteige.
Pabianice_Description=Ein Bahnhof mit einem Mittelbahnsteig und einem Seitenbahnsteig. Die Strecke in Richtung Łask ist mit einem automatischen Streckenblock ausgerüstet.
Kaliska_Description=Ein großer Knotenbahnhof im westlichen Teil von Łódź. Er wickelt den Zugverkehr aus Richtung Kutno, Łowicz, Zduńska Wola und Łódź Chojny ab. Der Bahnhof verfügt über drei Bahnsteige sowie zahlreiche Gleise für den Zugbetrieb.
Witonia_Description=Ein kleiner Bahnhof, welcher an der eingleisigen Strecke Zgierz - Kurno liegt. Von hier werden die benachbarten Bahnhöfe Łęczyca und Ozorków ferngesteuert. Beide Stationen haben Verladegleise, Łęczyca hat sogar ein Militärgleis. An jedem Bahnhof gibt es mehrere Bahnsteige.
Zgierz_Polnoc_Description=Ferngesteuertes Stellwerk, welches im Stellwerk Zgierz sitzt. Von hier werden insgesamt drei Bahnhöfe auf der Strecke Zgierz-Kutno gesteuert. Zgierz Kontrewers und Zgierz Północ haben jeweils zwei Gleise mit je einem relativ kurzen Bahnsteig. Chociszew hingegen hat drei Gleise, wovon nur die beiden äußeren einen Bahnsteig besitzen.
Glinnik_Description=Ein kleiner Bahnhof mit einem Ausweichgleis und zwei Bahnsteigen. Von hier wird auch Stryków ferngesteuert, welches zusätzliches Gleis und ein Ladegleis besitzt.
Glowno_Description=Der Bahnhof wurde im Jahre 2015 modernisiert, wodurch dort ein elektronisches Stellwerk errichtet wurde. Dadurch wird von hier auch das benachbarte Domaniewice ferngesteuert. In Domaniewice wurden zum Test neue Signale mit beweglichen Signalschirmen installiert, was die Wartung vereinfachen soll.
Lowicz_Przedmiescie_Description=Ein mittelgroßer Bahnhof auf der LK15 kommend von Zgierz. Da die LK15 weiter nach Bednary führt, gibt es hier auch über andere Strecken Abzweige nach Łowicz Główny sowie eben auch nach Bednary.
Lowicz_Glowny_Description=Ein großer Kreuzungsbahnhof auf der Hauptstrecke E20 (Berlin-Moskau). Hier zweigt der Güterverkehrskorridor CE20 ab, wo die Züge via Skierniewice und Łuków das Warschauer Kreuz umfahren können. Der Bahnhof hat zwei Mittelbahnsteige. Während der Modernisierung wurden die vorherigen Abzweigstellen Arkadia und Placencja in den Bahnhof integriert und werden von hier nun auch gesteuert.
Belchow_Description=Der einzige Bahnhof zwischen Skierniewice und Łowicz Główny. Hier gibt es fünf Gleise, aber nur zwei Bahnsteiggleise. Der Bahnhof wird im Stellwerksgebäude von Skierniewice ferngestellt. Die Strecke nach Skierniewice ist bereits mit Selbstblocksignalen ausgestattet, diese wurden während der Modernisierung installiert.
