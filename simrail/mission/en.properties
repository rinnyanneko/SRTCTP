08_lodz_cargo_Hello=Welcome to the Cargo scenario in the Łódź district. Your task will be to pick up a train carts in Pabianice and transport it to Łódź Chojny station. Prepare to leave in the direction of Łódź Widzew station, then report to the dispatcher.
