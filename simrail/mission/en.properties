veh_163_radiochannel_step3=Confirm the channel change.
veh_163_release_main=Set the driver’s valve in driving or assimilation position.
veh_163_try_cruise_control=Now you are beginning your journey in manual mode. You can enter automatic mode (cruise control) any time by using the switch.
veh_163_cruise_ctrl_speed=The cruise control speed is set using the keypad on the right-hand side of the drive control.
veh_163_cruise_ctrl_speed2=You can also change the cruise control speed using the drive control.
veh_163_cruise_ctrl_force=The traction force of the cruise control can be set using the knob. It also controls the force of the electrodynamic brake. In position 1, it is switched off, then the force increases and reaches its maximum in positions 7-12.
veh_163_cruise_ctrl_drive=Now you can start the drive with cruise control.
veh_163_cruise_ctrl_start=Set the driving mode switch to the S position to start the locomotive and hold it until the locomotive exceeds speed of 3 kph.
veh_163_power_to_zero=Move and hold the control lever backwards to switch off the drive.
veh_163_manual_start=Move the control lever forward to apply power and start moving. You must wait for the Drive-Brake shaft to engage and apply at least 5% traction force.
veh_set_lights_red=Set the red lights.
veh_163_battery=Switch on the battery by the switch on the rear wall of the cabin.
veh_battery_too_low=The battery voltage is to low for starting the vehicle. It is necessary to charge the battery by external supply in depot. Please reload the chosen mission.
veh_163_pantvalves_open=There are two pneumatic valves placed in the cabin for supplying the air to the pantographs. The valves need to be opened.
veh_163_pantvalve_front=Open the valve of front pantograph.
veh_163_pantvalve_back=Open the valve of back pantograph.
veh_163_popychpociag=Set the drive mode switch to train mode, which will activate the CA and SHP devices.
veh_163_grouding_desc=The locomotive has a switch in the cab for disconnecting and grounding the pantographs, which connects the pantographs to the ground or the locomotive's high-voltage circuits.
veh_163_grouding=Set the pantograph disconnectors to the P+Z position.
veh_163_low_pant_press=The air pressure in the pantograph tank is too low for them to rise.
veh_163_small_compressor=Start the pantograph compressor by setting the compressor switch to the PK position.
veh_163_protections_desc=The vehicle's electrical safety devices are active to protect it from damage.
veh_163_protections_crouch=Press {button=In-Game Global Actions|Crouch} to crouch down in order to reset the security system.
veh_163_protections_crouch_sitting=Lean to the left using the A key and crouch using the {button=In-Game Global Actions|Crouch} button to reset the safety devices.
veh_163_protections=Reset the safety devices with the button.
veh_163_electronics_supply=Switch on the 115 V central power supply.
veh_163_circuitbreaker_desc=Unlike Polish vehicles, the 163 series locomotive requires the circuit breaker to be closed without voltage. The vehicle's high voltage circuit is closed by raising the pantographs.
veh_163_pantographs_up=Set the desired configuration of pantographs with the switch on the control panel. 
veh_163_compressors_auto=Switch on the compressor in automatic mode.
veh_163_radiochannel_step0=Change the radio channel.
veh_163_radiochannel_step1=Enter the channel changing mode by button with arrow.
veh_163_radiochannel_step2=Select the channel number.
veh_163_cruise_ctrl_coast=Set the driving mode switch to the V position to switch off the drive.
Tut_Cd163_HelloMsg=In front of you stands a locomotive from the 163 series, manufactured by the Czech company Škoda. Today, you will learn how to operate it at the Żmigród Experimental Section.
