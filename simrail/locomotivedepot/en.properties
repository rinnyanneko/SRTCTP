TrainDetails_desc_ep08=The EP08 (type 102E) is a locomotive designed for express passenger trains. In comparison to EU07 4E the transmission was changed and new roller bearings were used. This allowed for an increase of top service speed to <kmph>140</kmph>. Built between 1972 and 1976 at the Pafawag Wrocław plant, only 15 examples of EP08 were built. Production was aborted due to lack of foreign currency to get components abroad. Some of them got converted to EU07 due to distressing behaviors at high speeds.
TrainDetails_desc_412w=412w is a four axle wagon designed for bulk cargo of materials such as coal, sand, ore and gravel. It can carry up to 60 tons of cargo with a capacity of 72 m3. Unloading can be carried with tipplers.
TrainDetails_desc_408s=408s is a four axle dry bulk wagon for cargo such as cement and ashes. It can carry up to 55.7 tons in four tanks with combined capacity of 50 m3. Loading takes place by hatches on top while unloading is pneumaticly powered with hoses on the sides.
TrainDetails_desc_424z=424z is a type of Polish platform wagon designed for transport of ISO containers in compliance with European regulations. Can be loaded with 10, 20, 30 and 40 feet containers with overall bed length of 60 foot with a carrying capacity of 58 tons.
TrainDetails_desc_111a=111a is type of Polish passenger wagon designed to the European UIC Y standard. They have 10 second class compartments with eight seats each. They were produced in PFW Wrocław and HCP Poznań factories from 1967 up to 1992, with various changes and improvements such as simplified sheathing, strengthened roof structure and more modern heating systems. With over 25 hundred produced, they were the most common passenger wagon on Polish rails for decades.
TrainDetails_desc_112a=112a is type of Polish passenger wagons designed to the European UIC Y standard. They have 9 first class compartments with six seats each. They were produced in HCP Poznań factory from 1967 up to 1991 with various changes and improvements such as simplified sheathing, strengthened roof structure and more modern heating systems.
TrainDetails_desc_156A=156a is a passenger wagon of modern design by FPS Poznań with fully welded self supporting body. Seated on 25ANa bogies with three disc brakes on every axle and magnetic brake that allows for design speed of <kmph>200</kmph>. Interior is fully air conditioned and silenced, divided into 6 first class compartments with six seats each and 3 business class compartments with four adjustable seats and tables in the middle.
TrainDetails_desc_B91=B91 is family of 70 passenger wagons of the Z2 European standard produced for PKP at the VEB Waggonbau Bautzen factory. The order was composed of 30 wagons First class and 40 Second Class. The First class wagons are divided into nine compartments with six seats each while second class is divided into eleven compartments, also with six seats each. They are mounted on GP200 bogies with three individual disc brakes per axle and magnetic breaks, capable of service speed of <kmph>160</kmph>. Compartments are air conditioned and equipped with electrical outlets. During their lifespan they all got modernised at ZNTK Nowy Sącz, getting new doors, seats and electronic destination displays.
TrainDetails_desc_G90=G90 were the first foreign ordered second class passenger wagons for PKP. 70 were built in 1990 at the VEB Waggonbau Görlitz factory. At first they were divided into eleven air conditioned compartments with eight seats each, not fitting into any European classification and designated XB. Later on during modernisation got switched to six seats per compartment and fallen under Z2 standard. Wagons have self-supporting body mounted on G200 bogies with three individual disc brakes per axle and magnetic brake, capable of speed of <kmph>160</kmph>. Half of the series got modernised in 2015 by PESA Bydgoszcz and got designation 170A. Modernisation included new windows, doors, electronic destination displays and retention toilets.
TrainDetails_desc_406A=406A is a conversion of Z1A wagons produced by ABB Henschel AG in the early 90's into dining cars. They are mounted on MD524 bogies with disc and magnetic brakes, capable of reaching <kmph>200</kmph> for usage in international relations. During conversion by PESA Bydgoszcz all compartments were removed as well as doors at one end to make place for dining space with 36 seats and the kitchen with storage that have their own service doors at the side.
TrainDetails_desc_en57=EN57 is a standard-gauge 3-car electric multiple unit designed for regional passenger services. It is colloquially known as "Kibel" ("Toilet"). The unit is powered by 4 LK450 motors, each rated at 194 hp, located in the middle car. The outermost cars are labeled with the letters a and b which are both only driving trailers with no motors, each containing compressor and batteries respectively. The EN57 supports multiple unit operation with up to 3 units in conjunction, seating a total of 636 passengers, 212 in each unit.\nProduction of the unit lasted over 30 years at the Pafawag factory in Wrocław, starting in 1962 and ending in 1993, making it one of the longest-produced rail vehicles in the world. Throughout the years of production, a total of 1452 train sets were produced, some of which are still operational.
TrainDetails_desc_ty2=Ty2 is Polish modification of the German BR52 steam locomotive. It was designed as war emergency vehicle for service on conquered eastern territories. It's characterised by cheap but reliable construction and low axle load to withstand hastily repaired tracks and bridges with additional thermal insulation for service in Russia. Production continued shortly after the war and almost 7800 were built in many different factories in Germany and in occupied territories. Whilst most were taken by the USSR, 1426 continued to serve in Poland with various modifications to increase comfort and service life, such as steam cooler for compressor, automatic greasing system and steam heating for passenger service. Ty2 had low power-to-weight ratio but could haul much more freight than pre-war German engines. Up to 1700t with speed of <kmph>50 </kmph>. They remained in active service to the end of steam traction in mid '80 with a few preserved in operating condition and many more as static monuments.
TrainDetails_desc_en71=EN71 is a standard-gauge 4-car electric multiple unit designed for regional passenger services on mountainous routes. They were created from the basic 3-car EN57 by adding second motor car to the formation, doubling its power and adding another 52 seats for total of 264 in a complete 4-car unit. The EN71's can be coupled with other EN71s or with EN57s to make longer formations when required.\nThe first batch of EN71's were produced at the Pafawag factory in Wrocław between 1965-1966 with more produced later between 1974-1975, including some for the former Yugoslavian market. In 1976, 20 units were produced for the domestic Kraków-Zakopane route where EN57's would frequently underperform on the steeply graded sections of the route. In later years many were created by combining sections of damaged EN57's and some were taken back from former Yugoslavian countries.
TrainDetails_desc_406Ra=406Ra is a four axle tank wagon designed for transportation of oil products. It can carry 57 tons of liquid with capacity of 61 m3. Each tank sits on saddles and are strapped by two steel belts attached to the underframe with set of roman screws. It is filled by hatch on top and drained by valves on both sides. It is equipped with steam heating system (not present in 406Rb variant).
TrainDetails_desc_441v=441v is a four axle hopper wagon designed for high granulation bulk cargo such as coal and gravel. It can carry up to 64 tons of cargo in two independent compartments with an overall capacity of 86 m3. Loading takes place from the top using a conveyor belt or scoop, and unloaded by gravity from the sides through pneumatically powered flaps.
TrainDetails_desc_et22=The ET22 (type 201E) is a six-axle heavy freight electric locomotive. To simplify production and operation, it uses six DC series motors and drive systems proven in 4E with a similar resistance start system. Most of the electrical equipment also remained unchanged. The ET22 locomotive can haul freight trains weighing 3125 tons at a speed of <kmph>70 </kmph> or heavy passenger trains up to 700 tons at a maximum design speed of <kmph>125 </kmph>. For twenty years, 1184 units of type 201E electric locomotives were produced for PKP and 23 for export to Morocco. Currently, most of them are still operated by PKP Cargo, and private companies have brought over half of the Moroccan locomotives back to Poland and renovated them.
TrainDetails_desc_110a=110a is a family of Polish sleeping berth wagons. They have 9 compartments with 54 bunks convertible to 72 seats. They were produced exclusively by HCP Poznań with three batches from 1971 to 1977. Variant 110Aa had only steam and electric heating. Variant 110Ab got coal fired stove and variable gauge bogies to serve on lines to the USSR. Variant 110Ac does not have those features but was standardised to the UIC Y standard for use on Western rail networks.
TrainDetails_desc_434z=The 434Z is a four-axle platform wagon designed to carry containers. It can carry up to 70 tonnes, which corresponds to the weight of two or three loaded containers . It has lashing pins for different container sizes. It has a loading length of 60 feet, which allows it to carry up to three 20-foot containers or one 40-foot and one 20-foot container. The wagon carries the Sgns series designation, but is capable of speeds as high as <kmph>120</kmph>. The wagon was manufactured in Poland.\nUnlike the other container wagons at SimRail, this wagon is equipped with cast-iron brake shoes, which translates into the use of large brake cylinders and very high air consumption when loaded, as well as low brake sensitivity when empty.\nCaution: when braking the empty wagons, use a higher braking ratio than normal!
TrainDetails_desc_629z=The 629Z is a six-axle platform wagon designed to carry containers. It can carry up to 106.5 tonnes, which corresponds to the weight of three or four loaded containers. Its payload capacity is increased compared to four-axle wagons thanks to an additional bogie, but this necessitated the use of a joint between the sections. It has lashing pins for different container sizes. Its loading length is 2x40 feet, which allows two 20-foot containers or one 40-foot container to be carried on each section. The wagon was manufactured in Poland. The wagon belongs to Sggrss series and can run in the SS regime (maximum <kmph>120</kmph> with load).\nThis wagon is equipped with K-type brake shoes (so-called ‘composites’) with a high coefficient of friction which have a more linear action than cast iron pads.\nCaution: when braking the wagons at low speed, use a higher braking ratio than normal!
TrainDetails_desc_230_01=The 230-01 is a four-axle platform wagon designed to carry containers. It can carry up to 73.5 tonnes, which to the weight of two or three loaded containers. It has lashing pins for different container sizes. Its load length is 40 feet, which allows it to carry two 20-foot containers or one 40-foot container. The wagon was manufactured in the Czech Republic. The wagon belongs to Sgmmns series and can run in the S regime (maximum <kmph>100</kmph> with a load), while without a load it can run at a maximum speed of <kmph>120</kmph>.\nThis wagon is equipped with K-type brake shoes (so-called ‘composites’) with a high coefficient of friction which have a more linear action than cast iron pads.\nCaution: when braking the wagons at low speed, use a higher braking ratio than normal!
TrainDetails_desc_163=ČD 163 (Škoda 71E) is a Czechoslovak four axle standard gauge locomotive used mostly for passenger operations. Quite modern design for the 80's, using power efficient thiristor pulse regulation, resulting in characteristic buzzing noise. 120 units were produced with over 180 of multisystem ČD 363 class for Československé státní dráhy. In the 90's, after collapse of eastern block and Czechoslovakia, now separate České dráhy and Železnice Slovenskej republiky could not afford new locomotives. Last batch got sold to Italy and production got canceled. PKP Intercity and Przewozy Regionalne leased them between 2007 and 2016, but they still are common sight on Polish rails hauling freight for ČD Cargo.
TrainDetails_desc_36wed=The 36WEd EMUs are the second generation of the Impuls family, delivered to Łódź by Newag of Nowy Sącz to strengthen its rolling stock and serve the increasingly dense network of connections in the Łódź aglomeration. ŁKA has a total of 14 of these vehicles (numbers 001 to 014) in its fleet. The 36WEd design is based on three units connected by Jacobs bogies (shared by two adjacent units), which improves running stability and safety. The train has four asynchronous traction motors, each with a power of 400 kW. These are controlled by modern traction converters using IGBT technology, allowing for smooth acceleration and energy recovery during braking (recuperation). A two-stage suspension system is used. The first stage uses coil springs, while the second stage uses air suspension (airbags). This system not only reduces vibrations but also maintains a constant floor height relative to the platform, regardless of the number of passengers on board. These trains feature a completely low floor throughout (except for the areas above the powered bogies), making them fully accessible to people with disabilities. In the ŁKA version, the trains are equipped with ticket machines, air conditioning, and a passenger information system with LCD monitors. The 36WEd model was designed specifically for the requirements of the Łódź Agglomeration Railway. Unlike the newer 36WEha version, these units are exclusively electric.
