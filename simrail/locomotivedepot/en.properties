TrainDetails_desc_eu07=EU07 (type 4E) is Polish electric locomotive, designed as freight and passenger locomotive. It is based on a licensed version of the UK Class 83 by English Electric from the early 1960's. With a top speed of <kmph>125 </kmph> this locomotive is used for most passenger trains across Poland, as well as freight trains of up to 2000 tons. It uses four resistance started serial electric motors with resistor blocks cooled by ventilators powered from starter resistors making it really loud when accelerating. It can be connected with another locomotive of same series with multiple unit control so it could take trains up to 3600 tons (maximum weight of the train is restricted by station track length). During the decade of its production 240 were made. The design was later improved with a double-unit 203E that resulted in type 303E produced up to early 1990's. Despite its age it is still one of most reliable locomotives on the Polish railway. The EP07 variant differs slightly by having a different transmission ratio (traction motor gearing) which gives a better performance at higher speeds.
TrainDetails_desc_ed250=The ED250 Pendolino is an Italian built high speed train manufactured by Alstom. Unlike its other Pendolino counterparts, it is not capable of tilting. It has a maximum design speed of <kmph>250 </kmph> , however the maximum permitted speed in normal service is <kmph>200 </kmph>, making it the fastest train in Poland. Comprised of seven carriages of aluminium construction, it is powered by induction motors driving one axle per bogie. It can be powered by both direct current (DC) and alternating current (AC) of varying voltages using different pantographs. It hosts a multitude of onboard safety systems that enables it to operate services across multiple European countries. The unit has both First and Second Class accommodation. First class has 45 seats and Second Class has 341 seats. There are places provided for wheelchairs and one carriage serves as dining car. Near the entrances is space for bicycles or large luggage. Every carriage has at least one toilet and whole unit is fully soundproofed and fully air conditioned throughout.
TrainDetails_desc_et25=ET25 (nickname Dragon 2) is 6 axle freight locomotive designed to pull trains up to 4500 tons. It is powered by six induction motors with 834 kW. The first Dragon was designed in ZNTK Gliwice, while later improved versions are built to this day in Newag Nowy Sącz. Dragon 2 was adjusted for European norms and got new converters made by Polish company Medcom. Different variants are available with alternating current supply or dual power for international services, additional last mile diesel engine and ETCS security system or on board toilet.
TrainDetails_desc_e186=The E186 (EU43) is a locomotive from Traxx family. Its roots start in early 1990s, while represented F140MS variant comes from early 2000's with a strengthened body, IGBT inverters and individually controlled axles. It is a four axle multi system freight locomotive with max speed of <kmph>140 </kmph> capable of operating under 1.5kV DC, 3 kV DC, 15kV AC and 25 kV AC across multiple European networks. Koleje Mazowieckie uses eleven P160DC variant with speed increased to <kmph>160 </kmph>.
TrainDetails_desc_elf=The Pesa Elf is a low floor Electric Multiple Unit (EMU) used for regional and commuter services. It can be seen in different configurations such as 2, 3, 4, 5 and 6 car formations, which also includes differing interior arrangements depending on the operator requirements. It has been produced since 2010 until the present day by PESA Bydgoszcz company with various modifications over its lifespan. Each unit is powered by four induction motors, and features pneumatic suspension (air bags) for a guaranteed smooth ride. Each unit is of a fixed formation, however they can be coupled together with other units from the Elf family to allow for longer formations.
