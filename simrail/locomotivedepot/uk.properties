TrainDetails_desc_ed250=ED250 Pendolino - це високошвидкісний поїзд італійського виробництва, виготовлений компанією Alstom. На відміну від інших аналогів Pendolino, він не має системи нахилу кузова. Його максимальна конструкційна швидкість становить <kmph>250 </kmph>, однак максимальна дозволена швидкість у звичайній експлуатації - <kmph>200 </kmph>, що робить його найшвидшим поїздом у Польщі. Складаючись із семи вагонів алюмінієвої конструкції, він приводиться в рух асинхронними двигунами, що приводять одну вісь на кожному візку. Він може живитися як постійним (DC), так і змінним (AC) струмом різної напруги, використовуючи різні пантографи. Він має безліч бортових систем безпеки, що дозволяє йому здійснювати рейси в багатьох європейських країнах. У поїзді є вагони першого та другого класу. У першому класі - 45 місць, а в другому - 341 місце. Передбачені місця для інвалідних візків, а один вагон служить вагоном-рестораном. Біля входів є місце для велосипедів або великого багажу. У кожному вагоні є щонайменше один туалет, а весь поїзд повністю звукоізольований і кондиціонований.
TrainDetails_desc_en57=EN57 - це 3-вагонний електропоїзд стандартної колії, призначений для регіонального пасажирського транспорту і відомий у народі як "Кібель" ("Туалет"). Електропоїзд оснащений чотирма моторами LK450, кожен з яких має потужність 194 к.с., розташованими в середньому вагоні. Зовнішні вагони позначені літерами "а" та "b" і представляють собою лише вагони-причепи без моторів, кожен з яких містить компресор і батареї відповідно. EN57 підтримує роботу кількох потягів одночасно до трьох одиниць і вміщує загалом 636 пасажирів, по 212 у кожному вагоні. \nВиробництво цього потягу тривало понад 30 років на заводі Pafawag у Вроцлаві, починаючи з 1962 року і закінчившись у 1993 році, що робить його одним із найтриваліших вироблених залізничних транспортних засобів у світі. Протягом років виробництва було випущено загалом 1452 поїзди, деякі з яких все ще знаходяться в експлуатації.
TrainDetails_desc_ty2=Ty2 - це польська модифікація німецького паровоза BR52. Він був розроблений як військовий транспортний засіб екстреного призначення для служби на завойованих східних територіях. Він характеризується дешевою, але надійною конструкцією та низьким навантаженням на вісь, щоб витримувати поспішно відремонтовані колії та мости, з додатковою теплоізоляцією для служби в CРСР. Виробництво тривало недовго після війни, і майже 7800 одиниць було побудовано на багатьох різних заводах у Німеччичині та на окупованих територіях. Хоча більшість з них була забрана СРСР, 1426 продовжували служити в Польщі з різними модифікаціями для підвищення комфорту та терміну служби, такими як паровий охолоджувач для компресора, система автоматичного змащення та парове опалення для пасажирських перевезень. Ty2 мав низьке співвідношення потужності до ваги, але міг тягнути набагато більше вантажу, ніж довоєнні німецькі локомотиви. До 1700 т зі швидкістю <kmph>50 </kmph>. Вони залишалися в активній експлуатації до кінця парової тяги в середині 80-х років, кілька з них збереглися в робочому стані, а багато інших - як статичні пам'ятники.
TrainDetails_desc_ep08=EP08 (тип 102E) - це локомотив, розроблений для швидких пасажирських поїздів. У порівнянні з EU07 4E було змінено трансмісію та використано нові роликові підшипники. Це дозволило збільшити максимальну експлуатаційну швидкість до <kmph>140</kmph>. Побудований між 1972 і 1976 роками на заводі Pafawag у Вроцлаві, було створено лише 15 екземплярів EP08. Виробництво було припинено через брак іноземної валюти для закупівлі компонентів за кордоном. Деякі з них були переобладнані на EU07 через нестабільну поведінку на високих швидкостях.
TrainDetails_desc_eu07=EU07 (тип 4E) - це польський електровоз, розроблений як вантажний і пасажирський локомотив. Він заснований на ліцензійній версії британського Class 83 від English Electric з початку 1960-х років. З максимальною швидкістю <kmph>125 </kmph> цей локомотив використовується для більшості пасажирських поїздів по всій Польщі, а також для вантажних поїздів вагою до 2000 тонн. Він використовує чотири серійні електродвигуни з реостатним пуском з резисторними блоками, що охолоджуються вентиляторами, які живляться від пускових резисторів, що робить його дуже гучним під час прискорення. Він може бути з'єднаний з іншим локомотивом тієї ж серії за допомогою системи керування багатьма одиницями, що дозволяє йому водити поїзди вагою до 3600 тонн (максимальна вага поїзда обмежена довжиною станційних колій). Протягом десятиліття його виробництва було виготовлено 240 одиниць. Пізніше конструкція була вдосконалена двосекційним 203E, що призвело до створення типу 303E, який вироблявся до початку 1990-х років. Незважаючи на свій вік, він досі залишається одним з найнадійніших локомотивів на польській залізниці. Варіант EP07 дещо відрізняється іншим передавальним числом (редуктором тягового двигуна), що забезпечує кращу продуктивність на вищих швидкостях.
TrainDetails_desc_G90=G90 були першими пасажирськими вагонами другого класу з PKP, замовленими за кордоном. 70 були побудовані в 1990 році на заводі VEB Waggonbau Görlitz. Спочатку вони були розділені на одинадцять купе з кондиціонерами по вісім місць у кожному, які не вписувалися в жодну європейську класифікацію і позначалися як XB. Пізніше, під час модернізації, вони були переведені на шість місць у купе і підпали під стандарт Z2. Вагони мали самонесучий кузов на візках G200 з трьома індивідуальними дисковими гальмами на кожну вісь та магнітним гальмом, здатним розвивати швидкість <kmph>160</kmph>. Половина серії була модернізована в 2015 році компанією PESA Bydgoszcz і отримала позначення 170A. Модернізація включала в себе нові вікна, двері, електронні покажчики пунктів призначення та туалети з замкнутим контуром.
