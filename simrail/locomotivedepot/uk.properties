TrainDetails_desc_B91=B91 - сімейство з 70 пасажирських вагонів європейського стандарту Z2, виготовлених для PKP на заводі VEB Waggonbau Bautzen. Замовлення складалося з 30 вагонів з купе першого класу та 40 вагонів другого класу. Вагони першого класу розділені на дев'ять купе з шістьма сидячими місцями в кожному, а вагони другого класу - на одинадцять купе, також з шістьма сидячими місцями в кожному. Вони розміщені на візках GP200 з трьома індивідуальними дисковими розривами на вісь та магнітними розривами, які можуть розвивати швидкість до <kmph>160</kmph>. Купе обладнані кондиціонерами та електричними розетками. Під час експлуатації всі вагони були модернізовані в ZNTK Nowy Sącz, отримавши нові двері, сидіння та електронні табло призначення.
TrainDetails_desc_elf=Pesa Elf - це низькопідлоговий електропоїзд (EMU), що використовується для регіональних та приміських перевезень. Його можна побачити в різних конфігураціях, таких як 2, 3, 4, 5 і 6-вагонні склади, які також мають різне внутрішнє облаштування залежно від вимог оператора. Він виробляється з 2010 року до сьогоднішнього дня компанією PESA Bydgoszcz з різними модифікаціями протягом свого життєвого циклу. Кожен поїзд приводиться в рух чотирма асинхронними двигунами і оснащений пневматичною підвіскою (повітряними подушками) для гарантовано плавної їзди. Кожен поїзд має фіксований склад, однак їх можна з'єднувати з іншими поїздами сімейства Elf для створення довших складів.
TrainDetails_desc_et25=ET25 ( псевдонім Dragon 2) це 6-вісний вантажний локомотив, призначений для водіння поїздів вагою до 4500 тонн. Він оснащений шістьма асинхронними двигунами потужністю 834 кВт. Перший "Дракон" був розроблений на ZNTK у Гливицях, тоді як пізніші вдосконалені версії будуються донині в Newag у Новому Сончі. "Дракон 2" був адаптований до європейських норм і отримав нові перетворювачі виробництва польської компанії Medcom. Доступні різні варіанти з живленням від змінного струму або подвійним живленням для міжнародних перевезень, додатковим дизельним двигуном "останньої милі", системою безпеки ETCS або бортовим туалетом.
TrainDetails_desc_406A=406A - це переобладнання вагонів Z1A виробництва ABB Henschel AG на початку 90-х років у вагон-ресторан. Вони розміщені на візках MD524 з дисковими та магнітними гальмами, здатними розвивати швидкість <kmph>200</kmph> для використання в міжнародних перевезеннях. Під час переобладнання PESA Bydgoszcz були видалені всі купе, а також двері з одного боку, щоб звільнити місце для їдальні на 36 місць та кухні з коморою, які мають власні службові двері збоку.
YearsOfProduction_Present=Наразі
TrainDetails_desc_e186=E186 (EU43) - локомотив з сімейства Traxx. Його коріння сягає початку 90-х років, тоді як представлений варіант F140MS походить з початку 2000-х років з посиленим кузовом, IGBT-інверторами та індивідуально керованими осями. Це чотиривісний мультисистемний вантажний локомотив з максимальною швидкістю <kmph>140 </kmph>, здатний працювати під напругою 1,5, 3 кВ постійного струму або 15 і 25 кВ змінного струму в різних європейських мережах. Koleje Mazowieckie використовує одинадцять модифікацій P160DC зі збільшеною до <kmph>160</kmph> швидкістю.
TrainDetails_desc_111a=111a - це сімейний тип польських пасажирських вагонів, спроектованих за європейським стандартом UIC Y. Вони мають 10 купе другого класу з вісьмома сидячими місцями в кожному. Вони вироблялися на заводах PFW у Вроцлаві та HCP у Познані з 1967 до 1992 року з різними змінами та вдосконаленнями, такими як спрощена обшивка, посилена конструкція даху та більш сучасні системи опалення. З більш ніж 25 сотнями вироблених вагонів, вони були найпоширенішими пасажирськими вагонами на польських залізницях протягом десятиліть.
TrainDetails_desc_156A=156a - це пасажирський вагон сучасного дизайну від FPS Познань з повністю звареним самонесучим кузовом. Сидить на візках 25ANa з трьома дисковими гальмами на кожній осі та магнітним гальмом, що дозволяє розвивати проектну швидкість <kmph>200</kmph>. Салон повністю кондиціонований і безшумний, розділений на 6 купе першого класу з шістьма сидіннями в кожному і 3 купе бізнес-класу з чотирма регульованими сидіннями і столами посередині.
TrainDetails_desc_112a=112a - це сімейний тип польських пасажирських вагонів, спроектованих за європейським стандартом UIC Y. Вони мають 9 купе першого класу з шістьма сидячими місцями кожне. Вони вироблялися на заводі HCP в Познані з 1967 до 1991 року з різними змінами та вдосконаленнями, такими як спрощена обшивка, посилена конструкція даху та більш сучасні системи опалення.
TrainDetails_desc_408s=408s - це чотиривісний вагон для перевезення сухих сипучих вантажів, таких як цемент та зола. Він може перевозити до 55,7 тонн у чотирьох цистернах загальним об'ємом 50 м3. Завантаження відбувається через люки зверху, а розвантаження - пневматично за допомогою шлангів з боків.
TrainDetails_desc_412w=412w - це чотиривісний вагон, призначений для перевезення сипучих вантажів, таких як вугілля, пісок, руда та гравій. Він може перевозити до 60 тонн вантажу об'ємом 72 м3. Розвантаження може здійснюватися за допомогою вагоноперекидачів.
TrainDetails_desc_424z=424z - це перший тип польського вагона-платформи, призначений для перевезення контейнерів відповідно до європейських норм. Може бути завантажений 10-, 20-, 30- і 40-футовими контейнерами з загальною довжиною кузова 60 футів і вантажопідйомністю 58 тонн.
TrainDetails_desc_en71=EN71 - це 4-вагонний електропоїзд стандартної колії, призначений для регіональних пасажирських перевезень на гірських маршрутах. Вони були створені на основі 3-вагонного EN57 шляхом додавання до складу другого моторного вагона, що подвоїло його потужність і збільшило кількість місць ще на 52, довівши загальну кількість до 264 у повному 4-вагонному поїзді. EN71 можуть з'єднуватися з іншими EN71 або з EN57 для формування довших складів за потреби.\nПерша партія EN71 була виготовлена на заводі Pafawag у Вроцлаві в 1965-1966 роках, а пізніше, в 1974-1975 роках, було виготовлено більше, в тому числі для ринку колишньої Югославії. У 1976 році 20 одиниць було виготовлено для внутрішнього маршруту Краків-Закопане, де EN57 часто не справлялися на ділянках маршруту з крутими ухилами. У наступні роки багато з них було створено шляхом поєднання секцій пошкоджених EN57, а деякі були повернуті з країн колишньої Югославії.
TrainDetails_desc_406Ra=406Ra - це чотиривісний вагон-цистерна, призначений для перевезення нафтопродуктів. Він може перевозити 57 тонн рідини при місткості 61 м3. Цистерна розміщена на стійках і обв'язана двома сталевими ременями, прикріпленими до рами за допомогою набору римських гвинтів. Наповнення здійснюється через люк зверху, а злив - через клапани з обох боків. Цистерна обладнана системою парового опалення (відсутня у варіанті 406Rb).
TrainDetails_desc_441v=441v - це чотиривісний вагон-хопер, призначений для перевезення сипучих вантажів з високим рівнем грануляції, таких як вугілля та гравій. Він може перевозити до 64 тонн вантажу у двох незалежних відсіках загальним об'ємом 86 м3. Завантаження відбувається зверху за допомогою конвеєра або ковша, а розвантаження з боків під дією сили тяжіння через заслінки з пневматичним приводом.
TrainDetails_desc_et22=ET22 (тип 201E) - це шестивісний важкий вантажний електровоз. Для спрощення виробництва та експлуатації в ньому використовуються шість серійних двигунів постійного струму та системи приводу, випробувані на 4E, з аналогічною системою реостатного пуску. Більша частина електрообладнання також залишилася без змін. Локомотив ET22 може вести вантажні поїзди вагою 3125 тонн зі швидкістю <kmph>70 </kmph> або важкі пасажирські поїзди вагою до 700 тонн з максимальною конструкційною швидкістю <kmph>125 </kmph>. Протягом двадцяти років для PKP було вироблено 1184 одиниці електровозів типу 201E та 23 на експорт до Марокко. Наразі більшість з них все ще експлуатується PKP Cargo, а приватні компанії повернули до Польщі та відремонтували понад половину марокканських локомотивів.
TrainDetails_desc_110a=110a - перше сімейство польських спальних вагонів. Вони мають 9 купе з 54 спальними місцями, які можна розкласти на 72 місця. Вони були виготовлені виключно HCP Познань трьома партіями з 1971 по 1977 рік. Варіант 110Aa мав лише парове та електричне опалення. Варіант 110Ab мав вугільну піч і візки змінної ширини колії для роботи на лініях до СРСР. Варіант 110Ac не мав цих особливостей, але був стандартизований за стандартом UIC Y для експлуатації на західних залізницях.
TrainDetails_desc_434z=434Z - це чотиривісний вагон-платформа, призначений для перевезення контейнерів. Він може перевозити до 70 тонн, що відповідає вазі двох або трьох завантажених контейнерів. Він має кріпильні штифти для контейнерів різних розмірів. Його вантажна довжина становить 60 футів, що дозволяє перевозити до трьох 20-футових контейнерів або один 40-футовий і один 20-футовий контейнер. Вагон має позначення серії Sgns, але може розвивати швидкість до <kmph>120</kmph>. Вагон був виготовлений у Польщі.\nНа відміну від інших вагонів-контейнеровозів у SimRail, цей вагон оснащений чавунними гальмівними колодками, що виражається у використанні великих гальмівних циліндрів і дуже високому споживанні повітря в завантаженому стані, а також низькій чутливості гальм у порожньому стані.\nУвага: при гальмуванні порожніх вагонів використовуйте вищий коефіцієнт гальмування, ніж зазвичай!
TrainDetails_desc_629z=629Z - це шестивісний вагон-платформа, призначений для перевезення контейнерів. Він може перевозити до 106,5 тонн, що відповідає вазі трьох або чотирьох завантажених контейнерів. Його вантажопідйомність збільшена порівняно з чотиривісними вагонами завдяки додатковому візку, але це зумовило необхідність використання з'єднання між секціями. Він має кріпильні штифти для контейнерів різних розмірів. Його вантажна довжина становить 2х40 футів, що дозволяє перевозити два 20-футових контейнери або один 40-футовий контейнер на кожній секції. Вагон був виготовлений у Польщі. Вагон належить до серії Sggrss і може працювати в режимі SS (максимум <kmph>120</kmph> з вантажем).\nЦей вагон обладнаний гальмівними колодками типу K (так звані "композити") з високим коефіцієнтом тертя, які мають більш лінійну дію, ніж чавунні колодки.\nУвага: при гальмуванні вагонів на низькій швидкості, використовуйте вищий коефіцієнт гальмування, ніж зазвичай!
TrainDetails_desc_230_01=230-01 - це чотиривісний вагон-платформа, призначений для перевезення контейнерів. Він може перевозити до 73,5 тонн, що відповідає вазі двох або трьох завантажених контейнерів. Він має кріпильні штифти для контейнерів різних розмірів. Його вантажна довжина становить 40 футів, що дозволяє перевозити два 20-футових контейнери або один 40-футовий контейнер. Вагон був виготовлений у Чехії. Вагон належить до серії Sgmmns і може працювати в режимі S (максимум <kmph>100</kmph> з вантажем), тоді як без вантажу він може рухатися з максимальною швидкістю <kmph>120</kmph>.\nЦей вагон обладнаний гальмівними колодками типу K (так звані "композити") з високим коефіцієнтом тертя, які мають більш лінійну дію, ніж чавунні колодки.\nУвага: при гальмуванні вагонів на низькій швидкості, використовуйте вищий коефіцієнт гальмування, ніж зазвичай!
TrainDetails_desc_163=ČD 163 (Škoda 71E) - це чехословацький чотиривісний локомотив стандартної колії, який використовується переважно для пасажирських перевезень. Досить сучасна конструкція для 80-х років, що використовує енергоефективне тиристорне імпульсне регулювання, яке створює характерний дзижчачий звук. Було вироблено 120 одиниць та понад 180 багатосистемних локомотивів серії ČD 363 для Československé státní dráhy. У 90-х роках, після розпаду східного блоку та Чехословаччини, тепер вже окремі České dráhy та Železnice Slovenskej republiky не могли дозволити собі нові локомотиви. Остання партія була продана до Італії, а виробництво було скасовано. PKP Intercity та Przewozy Regionalne орендували їх між 2007 та 2016 роками, але їх все ще часто можна побачити на польських залізницях, коли вони тягнуть вантажі для ČD Cargo.
TrainDetails_desc_36wed=Електропоїзди 36WEd - це друге покоління сімейства Impuls, поставлене до Лодзі компанією Newag з Нового Сонча для посилення її рухомого складу та обслуговування все більш щільної мережі сполучень у Лодзькій агломерації. ŁKA має у своєму парку загалом 14 таких транспортних засобів (номери від 001 до 014). Конструкція 36WEd базується на трьох вагонах, з'єднаних візками Якобса (спільними для двох суміжних вагонів), що покращує стабільність ходу та безпеку. Поїзд має чотири асинхронні тягові двигуни, кожен потужністю 400 кВт. Вони керуються сучасними тяговими перетворювачами, що використовують технологію IGBT, що забезпечує плавне прискорення та рекуперацію енергії під час гальмування. Використовується двоступенева система підвіски. На першому ступені використовуються гвинтові пружини, а на другому - пневматична підвіска (повітряні подушки). Ця система не тільки зменшує вібрації, але й підтримує постійну висоту підлоги відносно платформи, незалежно від кількості пасажирів на борту. Ці поїзди мають повністю низьку підлогу по всій довжині (за винятком зон над моторними візками), що робить їх повністю доступними для людей з інвалідністю. У версії ŁKA поїзди оснащені квитковими автоматами, кондиціонерами та системою інформування пасажирів з РК-моніторами. Модель 36WEd була розроблена спеціально для потреб Лодзької агломераційної залізниці. На відміну від новішої версії 36WEha, ці поїзди є виключно електричними.
