TrainDetails_desc_ed250=ED250 是義大利 Alstom 製造的高速列車。最高設計速度為 <kmph>250 </kmph>（波蘭境內最高運轉速度為 <kmph>200 </kmph>），是波蘭鐵路速度最高的列車。全列由七節鋁合金車體組成，兩端各有兩具轉向架的單一車軸由非同步馬達驅動。藉由兩組不同集電弓，可接受多種電壓的直流與交流供電；配合多套列車保安系統，得以在多個歐洲國家運轉。第一節車廂為開放式一等座，共 45 席；其餘車廂設有 341 席二等座，第三節另設無障礙空間並兼作餐車。車門附近設有自行車及大型手提行李空間。每節車廂至少設有一間廁所，全列具隔音與空調設備。
TrainDetails_desc_et25=ET25（Dragon 2）是六軸貨運機車，設計牽引總重最高 4,500 噸的列車。動力來自六具非同步馬達，每具功率 834 kW。第一代 Dragon 由 ZNTK Gliwice 設計，後續改良型至今仍由新松奇的 Newag 製造。Dragon 2 符合歐洲 TSI 規範，並採用波蘭 Medcom 製造的新型變流器。選配項目包括交流或多電壓供電以供國際運轉、最後一哩柴油引擎、ETCS 列車保安系統及車上廁所。
TrainDetails_desc_elf=Pesa Elf 是供都會及區域運輸使用的低地板電聯車。依營運業者需求，設有 2、3、4、5、6 節等不同編組及內裝配置。自 2010 年起由 PESA Bydgoszcz 持續生產，期間推出多項改良。列車由裝於兩端轉向架的四具非同步馬達驅動，車體透過空氣彈簧及液壓避震器承載，以確保行駛平穩。各車節不可在日常運用中拆分，但不同 Elf 編組可重聯成較長列車。
