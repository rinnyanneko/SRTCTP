TrainDetails_desc_B91=B91 是 VEB Waggonbau Bautzen 為 PKP 製造的 70 輛歐洲 Z2 標準客車系列，其中一等客車 30 輛、二等客車 40 輛。一等車設 9 間客室，每間 6 席；二等車設 11 間客室，每間亦為 6 席。車體置於 GP200 轉向架上，每軸設三組獨立碟式軔機，另有磁軌軔機，最高速度為 <kmph>160</kmph>。客室設有空調及電源插座。所有車輛後來均在 ZNTK Nowy Sącz 現代化，換裝新車門、座椅及電子行先顯示器。
TrainDetails_desc_406A=406A 是將 ABB Henschel AG 於 1990 年代初製造的 Z1A 客車改造而成的餐車。車體置於 MD524 轉向架上，配備碟式及磁軌軔機，國際運轉最高可達 <kmph>200</kmph>。PESA Bydgoszcz 改造時拆除所有客室及一端車門，改設 36 席餐區、廚房與儲藏室；廚房另有車側專用勤務門。
TrainDetails_desc_156A=156A 是 FPS Poznań 設計的現代客車，採全焊接自承式車體。25ANa 轉向架每軸設三組碟式軔機，另有磁軌軔機，設計速度為 <kmph>200</kmph>。車內具完整空調與隔音，配置 6 間一等客室（每間 6 席）及 3 間商務客室（每間 4 張可調式座椅，中央設桌）。
TrainDetails_desc_ep08=EP08（102E 型）是供快速旅客列車使用的電力機車。相較於 EU07 4E 型，本型修改齒輪比並採用新式滾柱軸承，使最高運轉速度提高至 <kmph>140</kmph>。1972 至 1976 年間，Pafawag Wrocław 僅製造 15 輛 EP08；其後因缺乏採購進口零組件所需外匯而停產。部分車輛因高速運轉表現不佳，後來改造為 EU07。
TrainDetails_desc_412w=412w 是四軸敞車，用於載運煤、砂、礦石、碎石及雜貨等散裝貨物。72 m3 的車斗可裝載最高 60 噸貨物，並可使用翻車機卸貨。
TrainDetails_desc_408s=408s 是四軸粉粒體槽車，用於載運水泥與灰燼等散裝貨物。四個槽體合計容積 50 m3，最高可裝載 55.7 噸。貨物由車頂開口裝入，卸貨時則由車側軟管以氣力排出。
TrainDetails_desc_424z=424Z 是波蘭第一款依歐洲標準設計的貨櫃平車，可載運 10、20、30、40 呎貨櫃。裝載面長 60 呎，載重能力為 58 噸。
TrainDetails_desc_111a=111a 是依歐洲 UIC Y 標準設計的波蘭客車系列，設有 10 間二等客室，每間 8 席。1967 至 1992 年間由 PFW Wrocław 與 HCP Poznań 製造，歷經簡化車身外板、強化車頂及更新暖氣等多次改良。總產量超過 2,500 輛，數十年間一直是波蘭鐵路最普遍的客車。
TrainDetails_desc_112a=112a 是依歐洲 UIC Y 標準設計的波蘭客車系列，設有 9 間一等客室，每間 6 席。1967 至 1991 年間由 HCP Poznań 製造，歷經簡化車身外板、強化車頂及更新暖氣等多次改良。
TrainDetails_desc_G90=G90 是 PKP 首批向國外訂購的二等客車，1990 年由 VEB Waggonbau Görlitz 製造 70 輛。最初設有 11 間空調客室，每間 8 席，因不符合既有歐洲分類而編為 XB；現代化時改為每間 6 席，納入 Z2 標準。自承式車體置於 G200 轉向架上，每軸設三組獨立碟式軔機，另有磁軌軔機，最高速度為 <kmph>160</kmph>。半數車輛於 2015 年由 PESA Bydgoszcz 現代化並改稱 170A，工程包括更新車窗、車門、電子行先顯示器及密閉式廁所。
TrainDetails_desc_en57=EN57 是供區域客運使用的標準軌三節編組電聯車，俗稱「Kibel」（廁所）。中間動力車裝有四具 LK450 馬達，每具功率 145 kW；兩端 a、b 車均為無動力駕駛拖車，分別裝有空氣壓縮機與蓄電池。EN57 最多可三列重聯，共提供 636 個座位，每列 212 席。\n本型由 Wrocław 的 Pafawag 生產逾 30 年，自 1962 年延續至 1993 年，是全球生產期最長的鐵道車輛之一。總計製造 1,452 列，部分至今仍在營運。
TrainDetails_desc_ty2=Ty2 是德國 BR52 蒸汽機車的波蘭改型。原型是為占領區東部領土運用而設計的戰時機車，特色為造價低廉但堅固、軸重低，能行駛於倉促修復的軌道與橋梁，並有良好隔熱以適應俄羅斯氣候。戰後仍短暫生產，德國及占領區各廠合計製造近 7,800 輛。多數由蘇聯接收，另有 1,426 輛在波蘭使用，並加裝壓縮機前蒸汽冷卻器、自動潤滑、鍋爐排污裝置及旅客列車蒸汽暖氣等設備，以提升舒適性與壽命。Ty2 功率重量比較低，但牽引力優於戰前德國機車，可用 <kmph>50 </kmph> 牽引最高 1,700 噸。直到 1980 年代中期蒸汽牽引退場時才除役；少數仍可動態運轉，更多則作為靜態展示。
TrainDetails_desc_en71=EN71 是供山區區域客運使用的標準軌四節編組電聯車。它在 EN57 基本三節編組中增加第二節動力車，使功率加倍並增加 52 席，全列共 264 席。EN71 可與其他 EN71 或 EN57 重聯。\n首批由 Wrocław 的 Pafawag 於 1965 至 1966 年製造，第二批則於 1974 至 1975 年製造，兩批原供南斯拉夫出口。1976 年另製造 20 列供波蘭國內 Kraków－Zakopane 線使用，因 EN57 在該線陡坡路段性能不足。後來另有許多 EN71 由受損 EN57 車節重組而成，也有部分自前南斯拉夫國家回購。
TrainDetails_desc_406Ra=406Ra 是載運石油產品的四軸罐車，61 m3 槽體可裝載 57 噸液體。槽體置於鞍座上，以兩條鋼帶及一組花籃螺絲固定於底架。貨物由頂部開口裝入，並由車輛兩側閥門排出。除 406Rb 變型外，均設有蒸汽加熱系統。
TrainDetails_desc_et22=ET22（201E 型）是六軸重型貨運電力機車。為簡化製造與維修，本型採用六具已在 4E 型驗證的直流串激馬達及傳動系統，並使用類似的電阻控制起動方式，多數電氣設備亦維持不變。ET22 可用 <kmph>70 </kmph> 牽引 3,125 噸貨物列車，或以最高設計速度 <kmph>125 </kmph> 牽引 700 噸重型旅客列車。20 年間共為 PKP 製造 1,184 輛 201E，另有 23 輛出口摩洛哥。目前多數仍由 PKP Cargo 使用，民營業者也已將超過半數摩洛哥車輛運回波蘭翻修。
TrainDetails_desc_441v=441V 是四軸自卸漏斗車，用於載運煤與碎石等粗粒散裝貨物。兩個獨立料斗總容積 86 m3，可載重最高 64 噸。貨物由輸送帶或抓斗自上方裝入，卸貨時則開啟氣動側門，利用重力向兩側排出。
TrainDetails_desc_110a=110A 是波蘭製臥鋪客車系列，設有 9 間客室，可配置 54 個臥鋪或 72 個座位。1971 至 1977 年間由 HCP Poznań 分三批製造。110Aa 僅設蒸汽與電氣暖氣；110Ab 增設燃煤暖爐及可變軌距轉向架，以行駛前往蘇聯的路線；110Ac 則無這些設備，但依 UIC Y 標準規格化，以供西歐鐵路網運用。
TrainDetails_desc_434z=434Z 是載運貨櫃的四軸平車，載重最高 70 噸，約相當於兩至三個滿載貨櫃。車上設有適用不同貨櫃尺寸的固定銷。裝載長度 60 呎，可載三個 20 呎貨櫃，或一個 40 呎加一個 20 呎貨櫃。車種標記為 Sgns，最高速度可達 <kmph>120</kmph>，於波蘭製造。\n與 SimRail 其他貨櫃車不同，本車採鑄鐵閘瓦，因而使用大型軔缸；重車時耗氣量很大，空車時軔機靈敏度則偏低。\n注意！空車制軔時應使用比平常更高的軔機段位！
TrainDetails_desc_629z=629Z 是載運貨櫃的六軸關節式平車，載重最高 106.5 噸，約相當於三至四個滿載貨櫃。增設一具轉向架使載重能力高於四軸貨車，但也必須在兩車節間設有關節。車上設有適用不同貨櫃尺寸的固定銷；裝載長度為 2x40 呎，每節可載兩個 20 呎貨櫃或一個 40 呎貨櫃。車輛於波蘭製造，車種標記為 Sggrss，可依 SS 條件運轉（有載時最高 <kmph>120</kmph>）。\n本車採高摩擦係數的 K 型複合閘瓦，其制軔作用較鑄鐵閘瓦線性。\n注意！低速制軔時應使用比平常更高的軔機段位！
TrainDetails_desc_230_01=230-01 是載運貨櫃的四軸平車，載重最高 73.5 噸，約相當於兩至三個滿載貨櫃。車上設有適用不同貨櫃尺寸的固定銷。裝載長度 40 呎，可載兩個 20 呎貨櫃或一個 40 呎貨櫃。車輛於捷克製造，車種標記為 Sgmmns，可依 S 條件運轉（有載時最高 <kmph>100</kmph>），空車最高速度則為 <kmph>120</kmph>。\n本車採高摩擦係數的 K 型複合閘瓦，其制軔作用較鑄鐵閘瓦線性。\n注意！低速制軔時應使用比平常更高的軔機段位！
TrainDetails_desc_163=ČD 163（Škoda 71E）是捷克斯洛伐克製四軸標準軌機車，主要用於旅客運輸。以 1980 年代而言設計相當先進，採節能的閘流體脈衝控制，運轉時會產生特有的嗡鳴聲。捷克斯洛伐克國營鐵路共取得 120 輛本型，以及超過 180 輛多電壓的 ČD 363。1990 年代東歐集團與捷克斯洛伐克解體後，分立的 České dráhy 與 Železnice Slovenskej republiky 無力採購新機車，最後一批遂售往義大利並停產。PKP Intercity 與 Przewozy Regionalne 曾於 2007 至 2016 年租用本型；如今仍常見其為 ČD Cargo 牽引貨物列車行駛於波蘭鐵路。
TrainDetails_desc_36wed=36WEd 是 Impuls 家族第二代電聯車，由新松奇的 Newag 交付羅茲，以擴充車隊並服務日益密集的羅茲地區路網。ŁKA 共擁有 14 列（編號 001 至 014）。本型由三節車廂組成，相鄰車廂共用 Jacobs 轉向架，可提升行駛穩定性與安全。四具非同步牽引馬達各具 400 kW 功率，由採 IGBT 技術的現代牽引變流器控制，可平順加速並於制軔時回生電力。懸吊分為兩級：第一級採螺旋彈簧，第二級採空氣彈簧。此系統除降低振動外，也可不受載客量影響，使地板與月台維持固定相對高度。除動力轉向架上方外，全列採低地板設計，方便身心障礙旅客使用。ŁKA 版本設有自動售票機、空調及 LCD 旅客資訊系統。36WEd 專為 Łódzka Kolej Aglomeracyjna 的需求設計；與較新的 36WEha 不同，本型僅能以電力運轉。
