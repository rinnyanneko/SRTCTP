TrainDetails_desc_eu07=EU07（4E 型）是波蘭製客貨兩用電力機車。最高速度為 <kmph>125 </kmph>，可牽引波蘭國內多數旅客列車及總重 2,000 噸以下的貨物列車。機車使用四具串激牽引馬達，以電阻控制起動；起動電阻器的冷卻風扇由電阻抽頭供電，因此起動時噪音格外明顯。可與同型機車重聯控制，牽引總重最高 3,600 噸的列車（實際列車總重受站場股道長度限制）。本型源自 1960 年代初期 English Electric 製造的英國 Class 83 授權設計，十年間共製造 240 輛。其設計後續由雙節式 203E 改良，發展成生產至 1990 年代初的 303E 型。儘管車齡已高，EU07 至今仍是波蘭鐵路可靠度極佳的機車之一。EP07 變型主要採用不同齒輪比，以改善高速運轉性能。
TrainDetails_desc_e186=E186（EU43）屬於 Traxx 機車家族。其源流可追溯至 1990 年代初期；遊戲中的 F140MS 變型則出自 2000 年代初，具強化車體、IGBT 變流器及各軸獨立控制。這款四軸多電壓貨運機車最高速度為 <kmph>140 </kmph>，可在歐洲多國的 1.5 kV、3 kV 直流，以及 15 kV、25 kV 交流電化路線運轉。Koleje Mazowieckie 使用 11 輛最高速度提高至 <kmph>160 </kmph> 的 P160DC 變型。
