RailwayNo11_15_16=Railway lines no. 11, 15, 16
Lodz3_desc=Discover the magic of Łódź's single-track lines! Head north and visit Kutno and Łowicz.
Ł3_01_ic_SŁK_desc=InterCity train on the Warsaw - Wrocław route.\nRoute: Skierniewice -> Łódź Kaliska (81km)\n\nConfigurable scenario (season, weather, rolling stock, time)
Ł3_02_ic_ŁWK_desc=InterCity train on the Kraków - Szczecin route.\nRoute: Łódź Widzew -> Kutno (71km)\n\nConfigurable scenario (season, weather, rolling stock, time)
Ł3_03_icn_KutSkier_desc=Tourist train on the Kutno - Skierniewice route.\nRoute: Kutno -> Łódź Widzew -> Łódź Kaliska -> Łowicz -> Skierniewice (175km)\n\nConfigurable scenario (season, weather, rolling stock, time)
Ł3_04_r_LWL_desc=ŁKA train on the Łódź Widzew - Łowicz route.\nRoute: Łódź Widzew -> Łódź Kaliska -> Łowicz Główny (75km)\n\nConfigurable scenario (season, weather, rolling stock, time)
Ł3_05_r_LLW_desc=ŁKA train on the Łowicz - Łódź Widzew route.\nRoute: Łowicz Główny -> Łódź Kaliska -> Łódź Widzew (75km)\n\nConfigurable scenario (season, weather, rolling stock, time)
Ł3_06_r_LWK_desc=ŁKA train on the Łódź Widzew - Kutno route.\nRoute: Łódź Widzew -> Łódź Marysin -> Kutno (71km)\n\nConfigurable scenario (season, weather, rolling stock, time)
Ł3_07_r_KLK_desc=ŁKA train on the Kutno - Łódź Widzew route.\nRoute: Kutno -> Łódź Marysin -> Łódź Widzew (71km)\n\nConfigurable scenario (season, weather, rolling stock, time)
Ł3_08_r_LSL_desc=Regio train on the Łowicz - Skierniewice - Łowicz route.\nRoute: Łowicz Główny -> Skierniewice -> Łowicz (44km)\n\nConfigurable scenario (season, weather, rolling stock, time)
