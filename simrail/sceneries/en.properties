Ł2_01_IC-SP_desc=InterCity train from Poznań to Kraków.\nRoute: Sędzice -> Piotrków Trybunalski (140 km)\n\nCustomizable scenario (season, weather, rolling stock, time of day)
Ł2_02_IC-PS_desc=InterCity train from Kraków to Poznań.\nRoute: Piotrków Trybunalski -> Sędzice (140 km)\n\nCustomizable scenario (season, weather, rolling stock, time of day)
Ł2_03_IC-ZM_desc=InterCity train from Szczecin to Kraków.\nRoute: Zgierz -> Mikołajów (42 km)\n\nCustomizable scenario (season, weather, rolling stock, time of day)
Ł2_04_IC-MZ_desc=InterCity train from Kraków to Bydgoszcz.\nRoute: Mikołajów -> Zgierz (65 km)\n\nCustomizable scenario (season, weather, rolling stock, time of day)
Ł2_05_R-PK_desc=Regional train from Piotrków Trybunalski to Zgierz.\n\nRoute: Piotrków Trybunalski -> Zgierz (83 km)\n\nCustomizable scenario (season, weather, rolling stock, time of day)
Ł2_06_R-ZP_desc=Regional train from Zgierz to Piotrków Trybunalski.\nThe scenario begins at Łódź Widzew, where you start with a light engine move to the initial station. During the run, you will perform three cab changes in an EMU or run-arounds when operating a locomotive-hauled consist.\n\nRoute: Łódź Widzew -> Zgierz -> Łódź Olechów -> Łódź Widzew -> Koluszki -> Piotrków Trybunalski (95 km)\n\nCustomizable scenario (season, weather, rolling stock, time of day)
Ł2_07_Carg_SZ_desc=Freight train operation.\nRoute: Sieradz -> Łódź Żabieniec (64 km)\n\nCustomizable scenario (season, weather, rolling stock, time of day)
Ł2_08_Carg_L_desc=Take over the locomotive and travel from Łódź Dąbrowa to Pabianice to pick up container wagons, then transport them to Łódź Chojny.\nRoute: Łódź Dąbrowa -> Pabianice -> Łódź Chojny (51 km)\n\nCustomizable scenario (season, weather, rolling stock, time of day)
LinieKolejoweNr1_14_15_16_25=Railway lines no. 1, 14, 15, 16, 25
Lodz2_desc=Step onto the rails of the vast Łódź metropolitan area — a land where industrial heritage intertwines with modern railways. From Sieradz to Zgierz and Piotrków Trybunalski, you will guide trains across a region whose lines have connected people, cities, and history for generations.
TutorialCD163_Desc=In this tutorial, you will learn how to operate a Škoda Class 163 locomotive.
