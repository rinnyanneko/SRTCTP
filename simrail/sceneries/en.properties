ETCS_training_scenario_scenery_description=Enter the world of modern railway traffic control systems - learn about the operation of ETCS - level 1 and 2.
ETCSZmigrod_SceneryNameTextL1=ETCS training scenario level 1
ETCSZmigrod_SceneryDescriptionL1=In this scenario, you will learn how to drive an ED250 high-speed train under the supervision of an ETCS level 1. You will learn how to initiate the system, input train data, and drive the train following the system's directives in both regular and exceptional situations, such as faults in railway traffic control devices. Prior to beginning the scenario, you must be proficient in operating an ED250 train without the ETCS system, with a firm grasp on driving and braking techniques.
ETCSZmigrod_SceneryNameTextL2=ETCS training scenario level 2
ETCSZmigrod_SceneryDescriptionL2=In this scenario, you will learn how to drive an ED250 high-speed train under the supervision of an ETCS level 2. You will learn how to initiate the system, input train data, and drive the train following the system's directives in both regular and exceptional situations, such as faults in railway traffic control devices. Prior to beginning the scenario, you must be proficient in operating an ED250 train without the ETCS system, with a firm grasp on driving and braking techniques.
