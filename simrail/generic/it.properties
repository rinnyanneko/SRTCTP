MultiplayerIntroduction_Driver_ExpressTrain=Oggi condurrai un treno espresso.
MultiplayerIntroduction_Driver_FastTrain=Oggi condurrai un treno espresso.
MultiplayerIntroduction_Driver_WelcomeDriver=Benvenuto nella modalità multigiocatore di SimRail. Oggi avrai il ruolo di macchinista per la prima volta.
MultiplayerIntroduction_Driver_AI=Attualmente il treno è sotto il controllo di un AI. Quando ti senti pronto, puoi prendere il controllo del treno in qualunque momento premendo il pulsante in cima allo schermo.
MultiplayerIntroduction_Driver_AFK=Se sarai inattivo per molto tempo, l'AI prenderà il controllo del treno automaticamente.
MultiplayerIntroduction_Driver_Remember=Ricorda che stai cooperando con altre persone. Stai attento ai segnali e ai limiti di velocità.
MultiplayerIntroduction_Driver_Comm=Per comunicare con altre persone, puoi usare il radiotelefono come una chat vocale (vedi il tasto assegnato sulla tastiera nalle impostazioni) oppure usando la chat di testo sul lato sinistro dello schermo.
MultiplayerIntroduction_Driver_RadioChannel1=Affinchè gli altri utenti nell'area possano ricevere il tuo messaggio, devi essere sempre sullo stesso canale radio. Dopo aver preso il controllo dall'AI, il canale radio verrà impostato automaticamente su quello corretto per la linea.
MultiplayerIntroduction_Driver_RadioChannel2=Dopo aver superato il segnale a fondo nero con una R ed un numero gialli, seleziona il canale radio indicato - il numero sul segnale identifica il canale valido. In alternativa puoi attivare il cambio automatico dei canali radio dalle impostazioni.
MultiplayerIntroduction_Driver_PlayersList=Per verificare se la stazione a cui ti stai avviciando è gestita da utenti oppure da AI, apri la lista degli utenti (tasto TAB). Inoltre, è anche possibile utilizzarla per segnalare gli utenti che disturbano deliberatamente gli altri o che sono assenti.
MultiplayerIntroduction_Dispatcher_Welcome=Benvenuto nella modalità multigiocatore di SimRail. Oggi avrai il ruolo di regolatore della circolazione per la prima volta.
MultiplayerIntroduction_Dispatcher_Systems=Per dirigere il traffico ferroviario hai a disposizione 3 sistemi importanti: il banco di comando, l'orario dei treni e i dispositivi di comunicazione.
MultiplayerIntroduction_Dispatcher_Comm=Puoi comunicare con i regolatori della circolazione vicini. Se la stazione è gestita da AI, vedrai le informazioni rilevanti sul tuo telefono.
MultiplayerIntroduction_Dispatcher_AI=In questa situazione, la comunicazione potrà avvenire solo tramite messaggi di testo, scelti dalla lista. È diverso quando la stazione è gestita da un altro utente.
MultiplayerIntroduction_Dispatcher_Human=In questa situazione, hai la scelta di usare messaggi preimpostati, scrivere liberamente nella finestra di chat della stazione specifica, oppure fare una telefonata.
MultiplayerIntroduction_Dispatcher_Voice=Se vuoi effettuare una telefonata, alza la cornetta del telefono e premi il pulsante della stazione che vuoi contattare.
MultiplayerIntroduction_Dispatcher_IncommingCall=Se qualcuno ti sta chiamando, ti basta alzare la cornetta del telefono per rispondere.
MultiplayerIntroduction_Dispatcher_Radio=Il secondo tipo di comunicazioni è tramite la radio. Per contattare un macchinista vicino a te, puoi usare sia la chat di testo sulla sinistra oppure la comunicazione a voce (usando il tasto impostato sulla tastiera).
MultiplayerIntroduction_Dispatcher_RadioChannel=Ricorda che solo utenti nell'area, che hanno la radio impostata sullo stesso canale, potranno sentirti.
MultiplayerIntroduction_Dispatcher_Playerslist=Per visualizzare gli utenti nella tua area, apri la lista (tasto TAB). Inoltre, è anche possibile utilizzarla per segnalare gli utenti che disturbano deliberatamente gli altri o che sono assenti.
MultiplayerIntroduction_Dispatcher_Timetable1=Per controllare quali treni si stanno avvicinando alla stazione, hai a disposizione il monitor con le tabelle degli orari.
MultiplayerIntroduction_Dispatcher_Timetable2=Saprai da essa se il treno si fermerà alla tua stazione, quanto ritardo ha, da quale parte arriverà e dove deve essere inviato.
MultiplayerIntroduction_Dispatcher_MultipleStations=Tieni presente che alcune stazioni, come Sosnowiec Główny, hanno una cabina di segnalamento remota controllata automaticamente - in questo caso Sosnowiec R52. Per controllare il loro orario, è necessario cambiare la scheda sul monitor.
MultiplayerIntroduction_Dispatcher_NearbyTrains=Nel riquadro a sinistra è possibile osservare i treni vicini, insieme alla distanza e al nome del segnale più vicino. L'inizio del nome indica l'abbreviazione della stazione, seguita dal simbolo univoco del rispettivo segnale.
MultiplayerIntroduction_Dispatcher_Computer=È possibile utilizzare un computer o il banco di un sistema a relè per controllare i segnali e gli scambi. Le istruzioni dettagliate su come utilizzarli sono disponibili sotto l'icona "i". Si invita a familiarizzare con esse.
MultiplayerIntroduction_Dispatcher_LineBlocks=Ricorda che puoi incontrare blocchi automatici e semi-automatici che collegano due stazioni.
MultiplayerIntroduction_Dispatcher_AutomaticLB=Con il blocco automatico, non è necessario chiedere il permesso alla stazione vicina per far partire il treno, occorre soltanto informare il regolatore della circolazione vicino della partenza del treno.
MultiplayerIntroduction_Dispatcher_OthersLB=In caso contrario, prima della partenza del treno, è necessario chiedere al regolatore della circolazione vicino il permesso di inviare il treno con una comunicazione telefonica e poi agendo sul banco di controllo.
MultiplayerIntroduction_GL=Buona fortuna!
