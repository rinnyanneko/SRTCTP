MultiplayerIntroduction_Driver_WelcomeDriver=Bienvenido a SimRail multijugador. Hoy te pondrás en la piel de un maquinista por primera vez.
MultiplayerIntroduction_Driver_AFK=Si vas a estar inactivo durante mucho tiempo, la IA se hará cargo del tren automáticamente.
MultiplayerIntroduction_Driver_Remember=Recuerda que estás cooperando con otros jugadores. Presta atención a las señales y a los límites de velocidad.
MultiplayerIntroduction_Driver_RadioChannel1=Para que otros jugadores de la zona reciban tu mensaje, debes estar en el mismo canal de radio. Tras tomar el relevo de la IA, el canal de radio se ajustará automáticamente al correcto en la línea dada.
MultiplayerIntroduction_Dispatcher_Welcome=Bienvenido al modo multijugador de SimRail. Hoy jugarás como Controlador por primera vez.
MultiplayerIntroduction_Dispatcher_Systems=Dispones de 3 sistemas básicos: panel de control, horario y comunicación.
MultiplayerIntroduction_Dispatcher_Comm=Puedes comunicarte con el Controlador vecino por teléfono. Si esa caseta de señales está operada por la AI, verás la información relevante en tu teléfono.
MultiplayerIntroduction_Dispatcher_AI=En esta situación, la comunicación se realizará mediante mensajes de texto predefinidos seleccionados de la lista. Es diferente cuando esa estación es controlada por otro jugador.
MultiplayerIntroduction_Dispatcher_Human=En esta situación, tienes donde elegir, puedes utilizar mensajes predefinidos, escribir libremente en la ventana de chat con un mensaje específico, o elegir una llamada de voz.
MultiplayerIntroduction_Dispatcher_IncommingCall=Si alguien te llama, sólo tiene que descolgar el teléfono.
MultiplayerIntroduction_Dispatcher_Radio=El segundo tipo de comunicación es por radio. Para contactar con maquinistas cercanos, utiliza el chat de la izquierda o la comunicación por voz (tilde en el teclado por defecto).
MultiplayerIntroduction_Dispatcher_RadioChannel=El segundo tipo de comunicación es por radio. Para contactar con maquinistas cercanos, utiliza el chat de la izquierda o la comunicación por voz (tilde en el teclado por defecto).
MultiplayerIntroduction_Dispatcher_Playerslist=Para ver los jugadores de tu zona, abre la lista (tabulador por defecto). También puedes utilizarla para denunciar a los jugadores que arruinan deliberadamente el juego a los demás, así como a los inactivos.
MultiplayerIntroduction_Dispatcher_Timetable1=Para comprobar qué trenes se acercan a su estación, tiene a su disposición un monitor de horarios.
MultiplayerIntroduction_Dispatcher_Timetable2=En ella podrás saber si el tren tiene parada en su estación, cuánto tiempo lleva de retraso, por qué lado llegará y adónde debe ser enviado.
MultiplayerIntroduction_Dispatcher_NearbyTrains=Los trenes cercanos pueden observarse en el campo de la izquierda junto con la distancia y el nombre del semáforo más próximo. El comienzo del nombre significa la abreviatura de la estación y, a continuación, el símbolo único de un determinado semáforo.
MultiplayerIntroduction_Dispatcher_Computer=Puedes utilizar un escritorio de ordenador o del panel para controlar la caja de señales. Encontrará instrucciones detalladas para utilizar los escritorios en el icono "i". Familiarícese con ellas.
MultiplayerIntroduction_Dispatcher_LineBlocks=Recuerda que puedes encontrarte con bloqueos automáticos y semiautomáticos que conecten dos estaciones.
MultiplayerIntroduction_Dispatcher_OthersLB=De lo contrario, antes de la salida del tren, es necesario pedir permiso a la estación vecina para despachar el tren utilizando la comunicación telefónica, y luego utilizando el escritorio.
MultiplayerIntroduction_GL=¡Buena suerte!
MultiplayerIntroduction_Driver_ExpressTrain=Hoy conducirás un tren expreso.
MultiplayerIntroduction_Driver_FastTrain=Hoy conducirás un tren expreso.
MultiplayerIntroduction_Driver_AI=Actualmente el tren lo controla la IA. Cuando estés preparado, podrás tomar el control pulsando el botón de la parte superior de la pantalla en cualquier momento.
MultiplayerIntroduction_Driver_Comm=Para comunicarte con otros jugadores, puedes utilizar un radioteléfono como chat de voz (por defecto, una tilde en el teclado) y un chat de texto en la parte izquierda de la pantalla.
MultiplayerIntroduction_Driver_RadioChannel2=Al pasar el indicador con la letra R y un número, cambie el canal de radio en consecuencia - el número indica el canal válido. También puedes activar el cambio automático de canales de radio en los ajustes.
MultiplayerIntroduction_Driver_PlayersList=Para comprobar si la estación a la que te acercas está operada por un humano o una IA, abre la lista de jugadores (tecla tab por defecto). También puedes utilizarla para denunciar a los jugadores que molesten deliberadamente en el juego a los demás, así como a los que están inactivos.
MultiplayerIntroduction_Dispatcher_Voice=Si deseas utilizar la llamada de voz, descuelga el auricular del teléfono y pulsa el botón para seleccionar la emisora a la que desea llamar.
MultiplayerIntroduction_Dispatcher_MultipleStations=Recuerda que algunas estaciones, como Sosnowiec Główny, tienen caja de señales remota controlada por nosotros - en este caso Sosnowiec R52. Para comprobar su horario, cambie la pestaña en el monitor.
MultiplayerIntroduction_Dispatcher_AutomaticLB=En el bloqueo automático, no tienes que pedir el consentimiento de la estación vecina para la salida del tren, sino sólo informar al Controlador vecino sobre la salida del tren.
