MultiplayerIntroduction_Driver_Remember=Ne feledd, hogy más játékosokkal működsz együtt. Kérlek, figyelj a közlekedési lámpákra és a sebességkorlátozásokra.
MultiplayerIntroduction_Driver_Comm=A többi játékossal való kommunikációhoz használhatsz rádiótelefont hangcsevegésként (alapértelmezés szerint a billentyűzeten lévő tilde) és szöveges csevegést a képernyő bal oldalán.
MultiplayerIntroduction_Driver_RadioChannel1=Ahhoz, hogy a környéken lévő többi játékos is megkapja az üzenetedet, ugyanazon a rádiócsatornán kell lenned. Miután átvetted az AI-tól a rádiócsatornát, az automatikusan a megfelelő csatornára lesz állítva az adott vonalon.
MultiplayerIntroduction_Driver_RadioChannel2=Az R betűvel és egy számmal jelzett jelző mellett elhaladva ennek megfelelően változtasd meg a rádiócsatornát - a szám az érvényes csatornát jelzi. A rádiócsatornák automatikus váltását a beállításokban is aktiválható.
MultiplayerIntroduction_Driver_PlayersList=Annak ellenőrzéséhez, hogy a közeledő állomást ember vagy mesterséges intelligencia működteti-e, nyisd meg a játékosok listáját (alapértelmezés szerint a tab billentyűvel). Használhatod arra is, hogy jelentsd azokat a játékosokat, akik szándékosan elrontják mások játékát, valamint azokat, akik inaktívak.
MultiplayerIntroduction_Dispatcher_Welcome=Üdvözlünk a SimRail többjátékos módjában. Ma először fogsz forgalmi szolgálattevőként játszani.
MultiplayerIntroduction_Dispatcher_Systems=3 alapvető rendszer áll a rendelkezésedre: vezérlőpanel, menetrend és telefon.
MultiplayerIntroduction_Dispatcher_Comm=A szomszédos forgalmi szolgálattevővel telefonon kommunikálhatsz. Ha a szomszédos állomást mesterséges intelligencia kezeli, akkor a telefon nyomógombja kék lesz.
MultiplayerIntroduction_Dispatcher_AI=Ebben a helyzetben a kommunikáció sablon szöveges üzenetekkel történik. Más a helyzet, ha az adott állomást egy másik játékos irányítja.
MultiplayerIntroduction_Dispatcher_Human=Ebben a helyzetben van választási lehetőséged, ugyanis használhatsz sablon üzeneteket, írhatsz szabadon a csevegőablakba, vagy választhatod a hanghívást.
MultiplayerIntroduction_Dispatcher_Voice=Ha hanghívást szeretnél használni, vegyed fel a telefonkagylót, és nyomdd meg a gombot a hívni kívánt állomás kiválasztásához.
MultiplayerIntroduction_Dispatcher_Radio=A kommunikáció második típusa a rádiózás. A közelben lévő mozdonyvezetőkkel való kapcsolatfelvételhez használd a csevegőablakot vagy a hangkommunikációt (alapértelmezés szerint a billentyűzeten lévő "," gomb).
MultiplayerIntroduction_Dispatcher_RadioChannel=Ne feledd, hogy csak azok a környékbeli játékosok hallanak téged, akiknek a rádiója ugyanarra a csatornára van állítva, mint a te rádiód.
MultiplayerIntroduction_Dispatcher_Playerslist=Ha látni szeretnéd a szerveren lévő játékosokat, nyisd meg a játékoslistát (alapértelmezés szerint a tabulátor "TAB" billentyűvel). Használhatod arra is, hogy jelentsd azokat a játékosokat, akik szándékosan tönkreteszik mások játékát, valamint azokat, akik inaktívak.
MultiplayerIntroduction_Dispatcher_Timetable1=Ahhoz, hogy ellenőrizd, mely vonatok közelednek az adott állomás felé, rendelkezésedre áll egy menetrendi monitor.
MultiplayerIntroduction_Dispatcher_Timetable2=Ebből megtudhatod, hogy a vonat megáll-e az adott állomáson, késik-e, melyik irányból érkezik, illetve hova tart.
MultiplayerIntroduction_Dispatcher_MultipleStations=Ne feledd, hogy néhány állomás, mint például Sosnowiec Główny, rendelkezik vonalkiágazással - ebben az esetben Sosnowiec R52. A vonatok útirányának ellenőrzéséhez válts a monitoron lévő fülre.
MultiplayerIntroduction_Dispatcher_NearbyTrains=A közeli vonatok a bal oldali mezőben láthatók a távolsággal és a legközelebbi jelző nevével együtt. A név eleje az állomás rövidítését jelenti, majd az adott jelző egyedi azonosítója következik.
MultiplayerIntroduction_Dispatcher_Computer=A biztosítóberendezés számítógép vagy kezelőpult segítségével vezérelhető. A kezelőfelületek használatára vonatkozó részletes utasításokat az "i" ikon alatt találod. Kérjük, ismerkedj meg vele.
MultiplayerIntroduction_Dispatcher_LineBlocks=Ne feledd, hogy két állomás között lehet térközi közlekedés és állomástávolságú közlekedés.
MultiplayerIntroduction_Dispatcher_AutomaticLB=Térközi közlekedés esetén nem kell a szomszédos állomás hozzájárulását kérned a vonat indulásához, hanem csak a szomszédos forgalmi szolgálattevőt kell értesítened a vonat indulásáról.
