MultiplayerIntroduction_Driver_AI=Jelenleg a vonat mesterséges intelligencia irányítása alatt áll. Ha készen állsz, a képernyő tetején lévő gomb megnyomásával bármikor átveheted az irányítást.
MultiplayerIntroduction_Driver_AFK=Ha hosszú ideig inaktív leszel, a mesterséges intelligencia automatikusan átveszi a vonat irányítását.

