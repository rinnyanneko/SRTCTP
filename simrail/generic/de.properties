MultiplayerIntroduction_Driver_RadioChannel1=Damit Mitspieler deine Nachrichten empfangen können, musst du immer im richtigen Funkkanal eingewählt sein. Nach der Übernahme des Zuges vom Computer wird der richtige Funkkanal automatisch ausgewählt.
MultiplayerIntroduction_Dispatcher_Comm=Du kannst mit den Nachbarfahrdienstleitern mittels Telefon kommunizieren. Sollte der Nachbarbahnhof vom Computer gesteuert werden, findet die Kommunikation über den zugehörigen Textchat statt.
EbiLabelDropdown_9=Achtung! Arbeiter im Gleisbereich.
MultiplayerIntroduction_Driver_FastTrain=Heute fährst du einen Schnellzug.
MultiplayerIntroduction_Driver_WelcomeDriver=Willkommen im Multiplayer von SimRail! Heute schlüpfst du zum ersten Mal in die Rolle des Lokführers.
MultiplayerIntroduction_Driver_AFK=Solltest du für eine längere Zeit keine Eingabe tätigen, wird der Computer das Fahren des Zuges übernehmen.
MultiplayerIntroduction_Driver_Remember=Behalte immer im Hinterkopf, dass du diese Welt auch mit anderen Spielern teilst. Achte daher immer auf die Signale und die Geschwindigkeitsbeschränkungen.
MultiplayerIntroduction_Driver_Comm=Die Kommunikation mit den Mitspielern erfolgt entweder per Sprache (siehe Tastenbelegung in den Einstellungen) oder mittels Textchat.
MultiplayerIntroduction_Driver_RadioChannel2=Nachdem du an dem schwarzen Schild mit einem gelben R und einer Nummer vorbeigefahren bist, ändere bitte den Funkkanal auf die angegebene Nummer. Wenn du das nicht manuell tun möchtest, kannst du auch die automatischen Funkkanäle in den Einstellungen aktivieren.
MultiplayerIntroduction_Dispatcher_Welcome=Willkommen im Multiplayer von SimRail! Heute schlüpfst du zum ersten Mal in die Rolle des Fahrdienstleiters.
MultiplayerIntroduction_Dispatcher_Systems=Für das Regeln des Zugverkehrs benötigst du drei wichtige Hilfsmittel: Das Stellpult, den Fahrplan und das Telefon.
MultiplayerIntroduction_Dispatcher_AI=In diesem Fall erfolgt die Kommunikation mittels vorgefertigten Textbausteinen. Das ist anders, wenn das Stellwerk von einem Spieler gesteuert wird.
MultiplayerIntroduction_Driver_ExpressTrain=Heute fährst du einen Schnellzug.
MultiplayerIntroduction_Driver_AI=Aktuell befindet sich der Zug unter Kontrolle des Computers. Wenn du bereit bist, kannst du die komplette Steuerung beim Anklicken des Textfelds oben jederzeit selbst übernehmen.
MultiplayerIntroduction_Driver_PlayersList=Ob ein Bahnhof von einem Computer oder von einem Mitspieler gesteuert wird, kann mittels der Spielerliste (Taste TAB) eingesehen werden. Zusätzlich ist das Melden von Mitspielern bei möglichen Fehlverhalten möglich, dies inkludiert auch offensichtlich abwesende Spieler.
MultiplayerIntroduction_Dispatcher_Voice=Wenn du den Sprachanruf nutzen möchtest, nimm den Telefonhörer ab und drücke die Taste, um das gewünschte Stellwerk anzurufen.
MultiplayerIntroduction_Dispatcher_IncommingCall=Wenn du angerufen wirst, musst du einfach nur den Telefonhörer abnehmen.
MultiplayerIntroduction_Dispatcher_Timetable2=Dort erfährst du, ob der Zug hier hält, wie viel Verspätung er hat, von welcher Betriebsstelle er kommt und wohin er fahren muss.
MultiplayerIntroduction_Dispatcher_Computer=Das Stellwerk kann unterschiedliche Bauformen haben. Unter dem Symbol "i" findest du eine ausführliche Anleitung zur Bedienung des Stellwerks. Bitte mach dich damit vertraut.
MultiplayerIntroduction_Dispatcher_OthersLB=Im anderen Fall muss vor der Abfahrt eines Zuges der Nachbarbahnhof telefonisch um Erlaubnis gebeten werden, um den Zug abfertigen zu können.
MultiplayerIntroduction_GL=Viel Glück!
MultiplayerIntroduction_Dispatcher_Human=In dieser Situation hast du die Wahl: Du kannst Nachrichten frei in das Chatfenster schreiben, vordefinierte Textbausteine nutzen oder einen Sprachanruf tätigen.
MultiplayerIntroduction_Dispatcher_RadioChannel=Denke daran, dass du von Mitspielern in deinem Funkbereich gehört werden kannst, wenn deren Funkgeräte auf dem gleichen Kanal eingestellt sind.
MultiplayerIntroduction_Dispatcher_Playerslist=Um die Spieler in deiner Umgebung zu sehen, öffne die Spielerliste (standardmäßig mit der Tabulatortaste). Hier kannst du auch Spieler melden, die das Spielerlebnis stören oder inaktiv sind.
MultiplayerIntroduction_Dispatcher_Timetable1=Um zu wissen, welche Züge sich deinem Bahnhof nähern, steht dir ein Fahrplanmonitor (EDR) zur Verfügung.
MultiplayerIntroduction_Dispatcher_MultipleStations=Bitte beachte, dass einige Bahnhöfe, wie z.B. Sosnowiec Główny, über ein von uns ferngesteuertes Stellwerk verfügen - in diesem Fall Sosnowiec Gł. pzs R52. Um dessen Fahrplan zu überprüfen, wechsle das Stellwerk auf dem Fahrplanmonitor.
MultiplayerIntroduction_Dispatcher_NearbyTrains=Die Züge in deiner Umgebung werden im linken Feld angezeigt, zusammen mit der Entfernung und dem Namen des nächstgelegenen Signals. Der Signalname setzt sich zusammen aus der Abkürzung der Betriebsstelle und der eindeutigen Bezeichnung des Signals.
MultiplayerIntroduction_Dispatcher_LineBlocks=Beachte, dass du auf selbsttätige und nichtselbsttätige Blockaden stoßen kannst, die zwei Stationen miteinander verbinden.
MultiplayerIntroduction_Dispatcher_AutomaticLB=Bei der selbsttätigen Blockade ist es nicht erforderlich, die Zustimmung des Nachbarbahnhofs zur Abfahrt des Zuges einzuholen. Es genügt, den Nachbarfahrdienstleiter über die Abfahrt des betreffenden Zuges zu informieren.
EbiLabelDropdown_8=Informiere den Betriebsleiter über die Abfahrt
MultiplayerIntroduction_Dispatcher_Radio=Die zweite Art der Kommunikation erfolgt über den Zugfunk. Um Lokführer in deiner Nähe zu kontaktieren, verwende den Chat auf der linken Seite oder die Sprachkommunikation (standardmäßig "Dachzeichen" auf der Tastatur).
