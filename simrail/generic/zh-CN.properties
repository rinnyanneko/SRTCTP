MultiplayerIntroduction_Driver_ExpressTrain=本次您将驾驶快速列车。
MultiplayerIntroduction_Driver_FastTrain=本次您将驾驶特快列车。
MultiplayerIntroduction_Driver_AI=目前列车由 AI 控制，当您准备好时，可以按屏幕上方的按钮恢复人工操纵。
MultiplayerIntroduction_Driver_Comm=如果您要与其它玩家交流，可以使用无线电台的麦克风（默认是按键盘 Tab 上方的 ` 键），或者也可以在输入框打字。
MultiplayerIntroduction_Driver_RadioChannel2=当您通过一个带有大写“R” 和一个数字的标志时，您需要按照上面写的数字切换无线电频道。在设置里可以改为自动调节频道。
MultiplayerIntroduction_Driver_PlayersList=如果您想查看您前方车站是由 AI 还是由玩家调度，可以按 Tab 键打开玩家列表。您也可以利用玩家列表举报干扰游戏或者挂机的玩家。
MultiplayerIntroduction_Dispatcher_Welcome=欢迎来到 Simrail 多人联机。现在您将第一次在服务器中担任调度角色。
MultiplayerIntroduction_Dispatcher_Systems=在您面前的，是信号楼的 3 个基本构件——调度控制台，电子运行计划表，以及调度电话。
MultiplayerIntroduction_Dispatcher_Human=而与玩家沟通时有多种选择，您可以使用预置对话，或者在聊天框打字，或按键语音（频道一致且距离不远时），或打调度电话联系。
MultiplayerIntroduction_Dispatcher_Voice=如果您想使用调度电话，请拿起听筒，然后按下您要呼叫的车站的按钮，等待对方接听。
MultiplayerIntroduction_Dispatcher_IncommingCall=如果有人呼叫您，您只需要拿起听筒即可。
MultiplayerIntroduction_Dispatcher_Radio=第二种情况是使用无线电交流。您可以通过聊天窗口或者语音（默认按键为 Tab 键上方的 ` 键）来和您附近的司机进行交流。
MultiplayerIntroduction_Dispatcher_RadioChannel=请记住，只有频道与你的信号楼电台频道相同的玩家才能听到你的声音。
MultiplayerIntroduction_Dispatcher_Playerslist=如果您想查看您附近的玩家，可以按 Tab 键打开玩家列表。您也可以利用玩家列表举报干扰游戏或者挂机的玩家。
MultiplayerIntroduction_Dispatcher_Timetable1=您可以使用电子运行计划表（EDR）屏幕来查看哪些列车即将到达您的车站。
MultiplayerIntroduction_Dispatcher_Timetable2=您可以从 EDR 中了解列车是否停靠本站，晚点多久，应当从哪里进站，向哪个方向发车。
MultiplayerIntroduction_Dispatcher_MultipleStations=注意一些车站拥有一些远程控制的线路所，例如索斯诺维茨总站也负责管理索斯诺维茨 R52 信号楼。您可以切换时刻表上的标签页来查看 R52 的时刻表。
MultiplayerIntroduction_Dispatcher_NearbyTrains=附近的列车可以在左侧的浮动窗口中看到，这个窗口可以为您显示列车距离前方最近信号机的名称与距离。信号机名称的前半部分为车站缩写（例如 SDn = 索斯诺维茨 丹杜夫卡），紧跟着信号状态。
MultiplayerIntroduction_Dispatcher_Computer=您可以使用计算机或者联锁台来进行控制，具体的使用方式可以按左上方的“i”图标来查阅，请先阅读来熟悉一下。
MultiplayerIntroduction_Dispatcher_LineBlocks=请注意您可能遇到自动闭塞和半自动闭塞两种情况。
MultiplayerIntroduction_Dispatcher_AutomaticLB=在自动闭塞中，您不需要向相邻车站询问发车许可，仅需要向相邻车站通知列车的发车信息。
MultiplayerIntroduction_Dispatcher_OthersLB=而在半自动闭塞中，您在列车发车前，必须询问相邻车站是否允许您发车，使用电话交流进行询问，而后再进行相应操作。
MultiplayerIntroduction_GL=祝您好运！
