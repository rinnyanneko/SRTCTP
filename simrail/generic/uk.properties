DominoPanel_DNSwitch_NightLabel=Ніч
MultiplayerIntroduction_Driver_AFK=Якщо ви будете неактивні протягом тривалого часу, ШІ автоматично візьме керування поїздом на себе.
MultiplayerIntroduction_Driver_Remember=Пам'ятайте, що ви взаємодієте з іншими гравцями. Звертайте увагу на світлофори та обмеження швидкості.
MultiplayerIntroduction_Driver_RadioChannel1=Щоб інші гравці в цій зоні отримали ваше повідомлення, ви повинні бути на тому ж радіоканалі. Після перехоплення керування від ШІ, радіоканал буде автоматично встановлений на правильний на даній лінії.
MultiplayerIntroduction_Dispatcher_Welcome=Ласкаво просимо до мультиплеєру SimRail. Сьогодні ви вперше зіграєте роль диспетчера руху.
MultiplayerIntroduction_Dispatcher_Human=У цій ситуації у вас є вибір, ви можете скористатися готовими повідомленнями, вільно написати у вікні чату певне повідомлення або вибрати голосовий дзвінок.
MultiplayerIntroduction_Dispatcher_IncommingCall=Якщо вам хтось телефонує, то все, що вам потрібно зробити, це підняти слухавку.
MultiplayerIntroduction_Dispatcher_Timetable1=Щоб перевірити, які поїзди наближаються до вашої станції, у вас є монітор розкладу.
MultiplayerIntroduction_Dispatcher_Timetable2=З нього ви дізнаєтеся, чи має поїзд зупинку на вашій станції, як довго він затримується, з якого боку він прибуде і куди його слід відправити.
MultiplayerIntroduction_Dispatcher_OthersLB=В іншому випадку перед відправленням поїзда необхідно запитати у сусідньої станції дозвіл на відправлення поїзда за допомогою телефонного зв'язку, а потім за допомогою пульта керування.
MultiplayerIntroduction_GL=Щасти вам!
MultiplayerIntroduction_Driver_ExpressTrain=Сьогодні ви поїдете на швидкісному експрес поїзді.
MultiplayerIntroduction_Driver_FastTrain=Сьогодні ви поїдете на швидкісному поїзді.
MultiplayerIntroduction_Driver_AI=Наразі поїзд знаходиться під контролем ШІ. Коли ви будете готові, ви можете взяти керування на себе, натиснувши кнопку у верхній частині екрана в будь-який момент.
MultiplayerIntroduction_Driver_Comm=Для спілкування з іншими гравцями ви можете використовувати радіотелефон як голосовий чат (за замовчуванням, тильда на клавіатурі) і текстовий чат в лівій частині екрана.
MultiplayerIntroduction_Driver_RadioChannel2=Коли ви проїдете повз індикатор з літерою R і цифрою, змініть радіоканал відповідно - цифра вказує на діючий канал. Ви також можете активувати автоматичну зміну радіоканалів у налаштуваннях.
MultiplayerIntroduction_Dispatcher_Systems=У вашому користуванні є 3 основні системи - панель керування, розклад та комунікація.
MultiplayerIntroduction_Dispatcher_Comm=Ви можете зв'язатися з сусіднім диспетчером по телефону. Якщо ця станція керується штучним інтелектом, ви побачите відповідну інформацію на своєму телефоні.
MultiplayerIntroduction_Dispatcher_AI=У цій ситуації спілкування відбуватиметься за допомогою готових текстових повідомлень, доступних у списку. Інша справа, коли цією станцією керує інший гравець.
MultiplayerIntroduction_Dispatcher_Radio=Другий тип зв'язку - за допомогою радіо. Щоб зв'язатися з машиністами поїздів, використовуйте чат зліва або голосовий зв'язок (тильда на клавіатурі за замовчуванням).
Train_rdy=Відправлення поїзда {0}
train_on_collision_course=Гравець {0} відправив поїзд з номером {1} на курс зіткнення з поїздом з номером {2}
keyboard=Клавіатура
disconnect_all=Відключити все
suspend_call=Призупинити виклик
tape_recorder=Диктофон
automatic_answering=Автовідповідач
