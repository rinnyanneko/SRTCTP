MultiplayerIntroduction_Driver_WelcomeDriver=Ласкаво просимо до мультиплеєру SimRail. Сьогодні ви вперше зіграєте роль машиніста поїзда.
Signal_nszp=Заміна сигналу для виїзду з неправильної колії у зворотному напрямку - підтвердження
EbiLabelDropdown_7=Розпорядження та реєстрація по телефону
MultiplayerIntroduction_Driver_PlayersList=Щоб перевірити, чи керує станцією, до якої ви наближаєтеся, людина або ШІ, відкрийте список гравців (за замовчуванням клавіша табуляції). Ви також можете використовувати його, щоб повідомити про гравців, які навмисно псують гру іншим, а також про тих, хто неактивний.
MultiplayerIntroduction_Dispatcher_Playerslist=Щоб побачити гравців у вашому регіоні, відкрийте список (за замовчуванням клавіша табуляції). Ви також можете використовувати його, щоб повідомляти про гравців, які навмисно псують гру іншим, а також про тих, хто неактивний.
MultiplayerIntroduction_Dispatcher_NearbyTrains=Найближчі поїзди можна побачити в полі зліва разом з відстанню та назвою найближчого світлофора. Початок назви означає абревіатуру станції, а далі - унікальний символ даного світлофора.
MultiplayerIntroduction_Dispatcher_LineBlocks=Пам'ятайте, що ви можете зіткнутися з автоматичними та напівавтоматичними блокуваннями, що з'єднують дві станції.
MultiplayerIntroduction_Dispatcher_AutomaticLB=При автоматичному блокуванні не потрібно запитувати згоди сусідньої станції на відправлення поїзда, а лише повідомити сусідньому диспетчеру про відправлення поїзда.
MultiplayerIntroduction_Dispatcher_Voice=Якщо ви хочете скористатися голосовим викликом, підніміть слухавку і натисніть кнопку, щоб вибрати станцію, до якої ви хочете зателефонувати.
MultiplayerIntroduction_Dispatcher_RadioChannel=Пам'ятайте, що вас почують лише ті гравці, чиї радіоприймачі налаштовані на той самий канал, що й ваша станція.
MultiplayerIntroduction_Dispatcher_MultipleStations=Пам'ятайте, що на деяких станціях, таких як Sosnowiec Główny, є дистанційно керований нами пост - в даному випадку Sosnowiec R52. Щоб перевірити їхній розклад, перемкніть вкладку на моніторі.
MultiplayerIntroduction_Dispatcher_Computer=Ви можете використовувати комп'ютер або пульт керування для управління сигнальним блоком. Детальну інструкцію з їх використання можна знайти під іконкою "i". Будь ласка, ознайомтеся з нею.

